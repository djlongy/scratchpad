# Agents and Endpoint outside the cluster read the file store here. TLS ends at the
# ingress with a certificate from your internal CA; the ingress re-encrypts to the store and
# verifies it against ca.crt of the in-namespace secret.
# Path style: https://elastic-mirror.example.internal/<bucket>/<key>.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: elastic-mirror
  namespace: elastic-mirror
  labels:
    app.kubernetes.io/name: elastic-mirror
  annotations:
    cert-manager.io/cluster-issuer: internal-ca
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-secret: elastic-mirror/elastic-mirror-tls
    nginx.ingress.kubernetes.io/proxy-ssl-name: minio.elastic-mirror.svc
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Agent binaries are large downloads.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - elastic-mirror.example.internal
      secretName: elastic-mirror-ingress-tls
  rules:
    - host: elastic-mirror.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
