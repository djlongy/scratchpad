# Elastic Package Registry, full catalogue (every integration, the detection rules
# package, prebuilt ML jobs). The image crosses the transfer once, lands in your
# internal registry and is pulled by digest, so a moving tag cannot change what is
# served. To update rules and integrations, import a newer image and change the
# digest below. Rollback: put the previous digest back.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epr
  namespace: elastic-mirror
  labels:
    app.kubernetes.io/name: epr
spec:
  replicas: 1
  # A cold pull of the full image (about 25 GiB compressed) can take longer than the
  # default 10 minutes. Leave time for the pull and the 30 minute indexing probe.
  progressDeadlineSeconds: 3600
  # The old pod keeps serving while the new one pulls and indexes.
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: epr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: epr
    spec:
      imagePullSecrets:
        - name: registry-pull
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The node needs room for the compressed image and its extracted layers
      # (about 25 GiB plus 45 GiB). Pin the pod to nodes with a large image disk:
      # label them first, for example `kubectl label node <node> elastic-mirror/epr=true`.
      nodeSelector:
        elastic-mirror/epr: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: epr
          image: registry.example.internal/elastic/package-registry/distribution:production@sha256:<digest>
          imagePullPolicy: IfNotPresent
          env:
            - name: EPR_ADDRESS
              value: 0.0.0.0:8080
            - name: EPR_TLS_CERT
              value: /tls/tls.crt
            - name: EPR_TLS_KEY
              value: /tls/tls.key
            - name: EPR_TLS_MIN_VERSION
              value: "1.2"
          ports:
            - name: https
              containerPort: 8080
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The registry indexes every package before it listens. The full
          # catalogue takes up to 30 minutes: 180 x 10 s.
          startupProbe:
            httpGet:
              path: /
              port: https
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /
              port: https
              scheme: HTTPS
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: https
              scheme: HTTPS
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 2Gi
            limits:
              memory: 4Gi
      volumes:
        - name: tls
          secret:
            secretName: elastic-mirror-tls
---
apiVersion: v1
kind: Service
metadata:
  name: epr
  namespace: elastic-mirror
  labels:
    app.kubernetes.io/name: epr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: epr
  ports:
    - name: https
      port: 8080
      targetPort: https
