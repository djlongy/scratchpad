# Proves default-deny egress. Run it inside the elastic-mirror namespace: the
# default-deny policy selects every pod there, so this pod gets the same denial.
# Expected log: exit=28 for the first two probes, 200 for the third.
# Not part of kustomization.yaml. Delete the Job after reading the log.
apiVersion: batch/v1
kind: Job
metadata:
  name: egress-probe
  namespace: elastic-mirror
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: registry-pull
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: registry.example.internal/mirror/curl:8.11.1@sha256:<digest>
          command: [sh, -c]
          args:
            - |
              probe() { curl -sS -m 5 -o /dev/null -w '%{http_code}' "$@" 2>/dev/null; echo " exit=$?"; }
              echo "elastic registry:  $(probe https://epr.elastic.co/)"
              echo "public ip:         $(probe https://1.1.1.1/)"
              echo "own store:         $(probe -k https://minio.elastic-mirror.svc:9000/minio/health/live)"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
