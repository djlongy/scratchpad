# The file store and web server for the raw mirror files: Fleet agent binaries and
# Elastic Defend artifacts (bucket elastic-mirror, prefix downloads/), the GeoIP
# databases (geoip/), ML model files (models/) and the AI Assistant knowledge base
# (bucket elastic-kb, whose root listing is the S3 ListBucketResult Kibana reads).
# Anonymous read, signed write. MinIO sends the ETag as the object's MD5 in hex,
# which is the form Elastic Endpoint accepts (the dashless form of nginx's ETag).
# The files arrive from the high side of the transfer, written by the transfer
# flow with the write-only user created by minio-writer-bootstrap.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: elastic-mirror
  labels:
    app.kubernetes.io/name: minio
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard   # set your storage class
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: elastic-mirror
  labels:
    app.kubernetes.io/name: minio
spec:
  replicas: 1
  # One RWO volume: the old pod must release it before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
      spec:
      imagePullSecrets:
        - name: registry-pull
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          # Any S3-compatible store works if a single-part PUT returns the object's MD5
          # as the ETag and it ships the mc client (used by the writer Job). Pin by digest.
          image: registry.example.internal/mirror/minio:RELEASE.<pin>@sha256:<digest>
          imagePullPolicy: IfNotPresent
          args: [server, /data, --address, ":9000", --certs-dir, /certs]
          envFrom:
            - secretRef:
                name: minio-root
          env:
            - name: MINIO_BROWSER
              value: "off"
            - name: HOME
              value: /tmp
          ports:
            - name: https
              containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /certs
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: https
              scheme: HTTPS
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: https
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
        - name: tls
          secret:
            secretName: elastic-mirror-tls
            items:
              - {key: tls.crt, path: public.crt}
              - {key: tls.key, path: private.key}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: elastic-mirror
  labels:
    app.kubernetes.io/name: minio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: https
      port: 9000
      targetPort: https
