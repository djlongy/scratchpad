# Cluster-native TLS: a CA created inside this namespace by cert-manager, and one
# serving certificate for the store and the registry. No external CA is
# involved. A consumer trusts the mirror by mounting ca.crt from the secret
# elastic-mirror-tls (or a trust-manager Bundle built from it).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: elastic-mirror-selfsigned
  namespace: elastic-mirror
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: elastic-mirror-ca
  namespace: elastic-mirror
spec:
  isCA: true
  commonName: elastic-mirror-ca
  secretName: elastic-mirror-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: elastic-mirror-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: elastic-mirror-ca
  namespace: elastic-mirror
spec:
  ca:
    secretName: elastic-mirror-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: elastic-mirror-tls
  namespace: elastic-mirror
spec:
  secretName: elastic-mirror-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages: [server auth]
  dnsNames:
    - minio
    - minio.elastic-mirror
    - minio.elastic-mirror.svc
    - minio.elastic-mirror.svc.cluster.local
    - epr
    - epr.elastic-mirror
    - epr.elastic-mirror.svc
    - epr.elastic-mirror.svc.cluster.local
  issuerRef:
    name: elastic-mirror-ca
    kind: Issuer
