# The namespace that holds the mirror. Pod Security "restricted" is enforced:
# every manifest in this directory runs as non-root with no capabilities.
apiVersion: v1
kind: Namespace
metadata:
  name: elastic-mirror
  labels:
    app.kubernetes.io/name: elastic-mirror
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
