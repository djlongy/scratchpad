# No egress at all: the mirror serves, it never fetches. Ingress only from the
# consumer namespaces and, when enabled, the ingress controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: elastic-mirror
  labels: {{- include "elastic-mirror.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: {{- toYaml .Values.consumerNamespaces | nindent 18 }}
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8443}
    {{- if .Values.ingress.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace }}
          podSelector:
            matchLabels: {{- toYaml .Values.ingress.controllerPodLabels | nindent 14 }}
      ports:
        - {protocol: TCP, port: 8443}
    {{- end }}
