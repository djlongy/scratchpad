# No egress at all: the mirror serves, it never fetches. Ingress only from the
# ingress controller, which terminates TLS with the corp-signed certificates.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: elastic-mirror
  labels: {{- include "elastic-mirror.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace }}
          podSelector:
            matchLabels: {{- toYaml .Values.ingress.controllerPodLabels | nindent 14 }}
      ports:
        - {protocol: TCP, port: 8080}
