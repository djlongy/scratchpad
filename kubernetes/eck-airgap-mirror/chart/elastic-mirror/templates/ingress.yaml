# TLS ends here with certificates from your internal ClusterIssuer, which the corp
# CA signs. Consumers (Kibana, Elasticsearch, agents) trust the corp CA.
{{- $issuer := required "ingress.clusterIssuer is required" .Values.ingress.clusterIssuer }}
{{- range $name, $host := dict "epr" .Values.ingress.eprHost "files" .Values.ingress.filesHost }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels: {{- include "elastic-mirror.labels" $ | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $issuer }}
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Agent binaries and model files are large downloads.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  tls:
    - hosts: [{{ required (printf "ingress.%sHost is required" $name) $host }}]
      secretName: {{ $name }}-ingress-tls
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port: {number: 8080}
{{- end }}
