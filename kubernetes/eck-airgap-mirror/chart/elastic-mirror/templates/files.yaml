# The file server. Layout under /srv/mirror is the export bundle as it is:
# artifacts/ geoip/ models/ kb/. Load it with a tar pipe through kubectl exec.
apiVersion: v1
kind: ConfigMap
metadata:
  name: files-nginx
  labels: {{- include "elastic-mirror.labels" . | nindent 4 }}
data:
  default.conf: |
    # Elastic Endpoint needs an ETag. This is Elastic's documented form: nginx's
    # ETag with the dash removed.
    map $sent_http_etag $elastic_etag { "~(.*)-(.*)" "$1$2"; }
    server {
      listen 8443 ssl;
      ssl_certificate     /tls/tls.crt;
      ssl_certificate_key /tls/tls.key;
      ssl_protocols       TLSv1.2 TLSv1.3;
      root /srv/mirror;
      add_header ETag $elastic_etag;
      # Agent binaries and Defend artifacts, artifacts.elastic.co layout.
      location /downloads/ { alias /srv/mirror/artifacts/downloads/; }
      location = /GPG-KEY-elastic-agent { alias /srv/mirror/artifacts/GPG-KEY-elastic-agent; }
      location /geoip/ { }
      location /models/ { }
      # Kibana reads the repository root as an S3 ListBucketResult.
      location ~ ^/kb/?$ { default_type application/xml; rewrite ^ /kb/index.xml break; }
      location /kb/ { }
      location = /healthz { access_log off; return 200 "ok\n"; }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: files
  labels: {{- include "elastic-mirror.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.files.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.files.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: files
  labels:
    app.kubernetes.io/name: files
    {{- include "elastic-mirror.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One ReadWriteOnce volume: the old pod releases it before the new one starts.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: files}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: files
        {{- include "elastic-mirror.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ .Values | toYaml | sha256sum | trunc 16 }}
    spec:
      {{- include "elastic-mirror.pod" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          image: {{ required "files.image is required" .Values.files.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - {name: https, containerPort: 8443}
          volumeMounts:
            - {name: data, mountPath: /srv/mirror}
            - {name: conf, mountPath: /etc/nginx/conf.d}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          {{- include "elastic-mirror.container" . | nindent 10 }}
          readinessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            periodSeconds: 20
          resources: {{- toYaml .Values.files.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: files}
        - name: conf
          configMap: {name: files-nginx}
        - name: tls
          secret: {secretName: elastic-mirror-tls}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: files
  labels: {{- include "elastic-mirror.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: files}
  ports:
    - {name: https, port: 8443, targetPort: https}
