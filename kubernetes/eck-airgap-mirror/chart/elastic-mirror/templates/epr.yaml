apiVersion: apps/v1
kind: Deployment
metadata:
  name: epr
  labels:
    app.kubernetes.io/name: epr
    {{- include "elastic-mirror.labels" . | nindent 4 }}
spec:
  replicas: 1
  # A cold pull of the full image can take longer than the default 10 minutes.
  progressDeadlineSeconds: 3600
  # The old pod serves until the new one has pulled and indexed.
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: epr}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: epr
        {{- include "elastic-mirror.labels" . | nindent 8 }}
    spec:
      {{- include "elastic-mirror.pod" . | nindent 6 }}
      {{- with .Values.epr.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.epr.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: epr
          image: {{ required "epr.image is required" .Values.epr.image }}
          imagePullPolicy: IfNotPresent
          env:
            - {name: EPR_ADDRESS, value: "0.0.0.0:8080"}
            - {name: EPR_TLS_CERT, value: /tls/tls.crt}
            - {name: EPR_TLS_KEY, value: /tls/tls.key}
            - {name: EPR_TLS_MIN_VERSION, value: "1.2"}
          ports:
            - {name: https, containerPort: 8080}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
          {{- include "elastic-mirror.container" . | nindent 10 }}
          # The registry indexes every package before it listens: up to 30 minutes
          # for the full catalogue (180 x 10 s).
          startupProbe:
            httpGet: {path: /, port: https, scheme: HTTPS}
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet: {path: /, port: https, scheme: HTTPS}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: https, scheme: HTTPS}
            periodSeconds: 20
          resources: {{- toYaml .Values.epr.resources | nindent 12 }}
      volumes:
        - name: tls
          secret: {secretName: elastic-mirror-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: epr
  labels: {{- include "elastic-mirror.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: epr}
  ports:
    - {name: https, port: 8080, targetPort: https}
