map $sent_http_etag $elastic_etag { "~(.*)-(.*)" "$1$2"; }
server {
  listen 8443 ssl;
  ssl_certificate /certs/tls.crt;
  ssl_certificate_key /certs/tls.key;
  root /srv/mirror;
  add_header ETag $elastic_etag;
  location /downloads/ { alias /srv/mirror/artifacts/downloads/; }
  location = /GPG-KEY-elastic-agent { alias /srv/mirror/artifacts/GPG-KEY-elastic-agent; }
  location /geoip/ { }
  location /models/ { }
  location ~ ^/kb/?$ { default_type application/xml; rewrite ^ /kb/index.xml break; }
  location /kb/ { }
  location = /healthz { access_log off; return 200 "ok\n"; }
}
