apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: artifact-files
  namespace: elastic
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: artifact-files
  namespace: elastic
spec:
  secretName: artifact-files-tls
  issuerRef:
    kind: Issuer
    name: mirror-ca
  dnsNames:
  - files
  - files.elastic
  - files.elastic.svc
  - files.example.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: files
  namespace: elastic
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: files
  template:
    metadata:
      labels:
        app.kubernetes.io/name: files
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: registry-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
        ports:
        - name: https
          containerPort: 8443
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /srv/mirror
        - name: config
          mountPath: /etc/nginx/conf.d
          readOnly: true
        - name: certs
          mountPath: /certs
          readOnly: true
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          periodSeconds: 20
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: artifact-files
      - name: config
        configMap:
          name: files-nginx
      - name: certs
        secret:
          secretName: artifact-files-tls
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: files
  namespace: elastic
spec:
  selector:
    app.kubernetes.io/name: files
  ports:
  - name: https
    port: 8443
    targetPort: https
