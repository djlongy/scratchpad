# Kibana fragment (ECK). Merge config, env, volumeMounts and volumes into your
# Kibana resource, then kubectl apply it. Kibana restarts.
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
  namespace: elastic-system
spec:
  version: 9.5.2
  config:
    xpack.fleet.isAirGapped: true
    xpack.fleet.registryUrl: "https://epr.elastic-mirror.svc:8080"
    xpack.productDocBase.artifactRepositoryUrl: "https://files.elastic-mirror.svc:8443/kb"
  podTemplate:
    spec:
      containers:
        - name: kibana
          env:
            # Node trusts the public CAs only. This adds the mirror CA.
            - name: NODE_EXTRA_CA_CERTS
              value: /usr/share/kibana/mirror-ca/ca.crt
          volumeMounts:
            - {name: mirror-ca, mountPath: /usr/share/kibana/mirror-ca, readOnly: true}
      volumes:
        - name: mirror-ca
          configMap: {name: elastic-mirror-ca}
