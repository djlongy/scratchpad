# Kibana fragment (ECK). Merge config, env, volumeMounts and volumes into the Kibana
# resource from the OIDC setup, then kubectl apply it. Kibana restarts.
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kb
  namespace: elastic
spec:
  version: 9.5.2
  config:
    xpack.fleet.isAirGapped: true
    xpack.fleet.registryUrl: "https://epr.example.internal"
    xpack.productDocBase.artifactRepositoryUrl: "https://elastic-mirror.example.internal/kb"
  podTemplate:
    spec:
      containers:
        - name: kibana
          env:
            # Node trusts the public CAs plus every certificate in this file.
            - name: NODE_EXTRA_CA_CERTS
              value: /usr/share/kibana/config/corp-ca/ca.crt
          volumeMounts:
            - {name: corp-ca, mountPath: /usr/share/kibana/config/corp-ca, readOnly: true}
      volumes:
        - name: corp-ca
          secret: {secretName: corp-ca}
