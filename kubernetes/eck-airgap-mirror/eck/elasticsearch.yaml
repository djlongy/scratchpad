# Elasticsearch resource fragment (ECK). Merge into every nodeSet.
# Both settings are static: applying this rolls the nodes one at a time.
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
  namespace: elastic-system
spec:
  version: 9.5.2
  nodeSets:
    - name: default
      count: 3
      config:
        ingest.geoip.downloader.endpoint: "https://minio.elastic-mirror.svc:9000/elastic-mirror/geoip/overview.json"
        xpack.ml.model_repository: "https://minio.elastic-mirror.svc:9000/elastic-mirror/models"
      podTemplate:
        spec:
          initContainers:
            # -Djavax.net.ssl.trustStore replaces the JDK default instead of adding to
            # it, so the init container copies the JDK's cacerts and adds the mirror CA.
            # It re-runs on every pod start, so a rotated CA lands on the next restart.
            - name: mirror-trust-store
              image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2   # use your internal registry path
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  J=/usr/share/elasticsearch/jdk
                  cp "$J/lib/security/cacerts" /es-trust/cacerts
                  chmod u+w /es-trust/cacerts
                  "$J/bin/keytool" -importcert -noprompt -alias elastic-mirror-ca \
                    -file /mirror-ca/ca.crt -keystore /es-trust/cacerts -storepass changeit
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - {name: mirror-ca, mountPath: /mirror-ca, readOnly: true}
                - {name: es-trust, mountPath: /es-trust}
          containers:
            - name: elasticsearch
              env:
                # The store password only satisfies the keystore format: the file holds
                # public certificates.
                - name: ES_JAVA_OPTS
                  value: "-Xms2g -Xmx2g -Djavax.net.ssl.trustStore=/es-trust/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
              volumeMounts:
                - {name: es-trust, mountPath: /es-trust, readOnly: true}
          volumes:
            - name: mirror-ca
              configMap:
                name: elastic-mirror-ca
            - name: es-trust
              emptyDir: {}
