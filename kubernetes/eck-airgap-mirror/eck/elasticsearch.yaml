# Elasticsearch fragment (ECK). Merge config, initContainers, env and volumes into
# every nodeSet of your Elasticsearch resource, then kubectl apply it.
# Both settings are static: ECK rolls the nodes one at a time.
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
  namespace: elastic-system
spec:
  version: 9.5.2
  nodeSets:
    - name: default
      count: 3
      config:
        ingest.geoip.downloader.endpoint: "https://files.elastic-mirror.svc:8443/geoip/overview.json"
        xpack.ml.model_repository: "https://files.elastic-mirror.svc:8443/models"
      podTemplate:
        spec:
          initContainers:
            # -Djavax.net.ssl.trustStore replaces the JDK default instead of adding
            # to it, so this copies the JDK cacerts and adds the mirror CA. It runs on
            # every pod start, so a rotated CA lands on the next restart.
            # keytool imports only the first certificate of a PEM file: the
            # configmap must hold the mirror CA alone.
            - name: mirror-trust-store
              image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2   # the same image as the nodes
              command: ["sh", "-ec"]
              args:
                - |
                  J=/usr/share/elasticsearch/jdk
                  cp "$J/lib/security/cacerts" /es-trust/cacerts
                  chmod u+w /es-trust/cacerts
                  "$J/bin/keytool" -importcert -noprompt -alias elastic-mirror-ca \
                    -file /mirror-ca/ca.crt -keystore /es-trust/cacerts -storepass changeit
              volumeMounts:
                - {name: mirror-ca, mountPath: /mirror-ca, readOnly: true}
                - {name: es-trust, mountPath: /es-trust}
          containers:
            - name: elasticsearch
              env:
                # Heap sizing stays automatic. The store password only satisfies the
                # keystore format: the file holds public certificates.
                - name: ES_JAVA_OPTS
                  value: "-Djavax.net.ssl.trustStore=/es-trust/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
              volumeMounts:
                - {name: es-trust, mountPath: /es-trust, readOnly: true}
          volumes:
            - name: mirror-ca
              configMap: {name: elastic-mirror-ca}
            - name: es-trust
              emptyDir: {}
