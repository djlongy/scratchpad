# Elasticsearch fragment (ECK). Merge config, initContainers, env, volumeMounts and
# volumes into every nodeSet of the Elasticsearch resource from the OIDC setup, then
# kubectl apply it. Both settings are static: ECK rolls the nodes one at a time.
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: es
  namespace: elastic
spec:
  version: 9.5.2
  nodeSets:
    - name: default
      count: 3
      config:
        ingest.geoip.downloader.endpoint: "https://elastic-mirror.example.internal/geoip/overview.json"
        xpack.ml.model_repository: "https://elastic-mirror.example.internal/models"
      podTemplate:
        spec:
          initContainers:
            # The GeoIP downloader and the model repository use the JVM trust store,
            # not the realm ssl settings. -Djavax.net.ssl.trustStore replaces the JDK
            # default, so this copies the JDK cacerts and adds every certificate of
            # the corp CA bundle (keytool reads only the first certificate of a PEM
            # file, hence the split). Runs on every pod start.
            - name: corp-trust-store
              image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2   # the same image as the nodes
              command: ["sh", "-ec"]
              args:
                - |
                  J=/usr/share/elasticsearch/jdk
                  cp "$J/lib/security/cacerts" /es-trust/cacerts
                  chmod u+w /es-trust/cacerts
                  awk '/BEGIN CERTIFICATE/{n++} n>0{print > ("/tmp/corp-ca-" n ".pem")}' /corp-ca/ca.crt
                  for f in /tmp/corp-ca-*.pem; do
                    "$J/bin/keytool" -importcert -noprompt -alias "$(basename "$f" .pem)" \
                      -file "$f" -keystore /es-trust/cacerts -storepass changeit
                  done
              volumeMounts:
                - {name: corp-ca, mountPath: /corp-ca, readOnly: true}
                - {name: es-trust, mountPath: /es-trust}
                - {name: trust-tmp, mountPath: /tmp}
          containers:
            - name: elasticsearch
              env:
                # Heap sizing stays automatic. The store password only satisfies the
                # keystore format: the file holds public certificates.
                - name: ES_JAVA_OPTS
                  value: "-Djavax.net.ssl.trustStore=/es-trust/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
              volumeMounts:
                - {name: corp-ca, mountPath: /usr/share/elasticsearch/config/corp-ca, readOnly: true}
                - {name: es-trust, mountPath: /es-trust, readOnly: true}
          volumes:
            - name: corp-ca
              secret: {secretName: corp-ca}
            - name: es-trust
              emptyDir: {}
            - name: trust-tmp
              emptyDir: {}
