# templates/container-mirror-skopeo/contract.yml
schema_version: 1
name: container-mirror-skopeo
kind: component
status: experimental
introduced_in: '0.1.0'
minimum_gitlab: '17.0'
path: templates/container-mirror-skopeo/template.yml

purpose: >-
  Copy every reference in one or more list files into a destination registry,
  under a caller-chosen repository prefix, with the upstream registry host
  stripped from the path.

jobs:
  - name: '<instance>:container-mirror-skopeo'
    stage_input: stage
    default_stage: publish

inputs_summary:
  required:
    - instance
    - list-job
    - list-files
    - repository-prefix
    - registry    # unless vault-addr is set
  optional:
    - stage
    - arch
    - dry-run
    - vault-addr
    - vault-role
    - vault-kv-path
    - vault-field-registry
    - vault-field-user
    - vault-field-token
    - ca-bundle-url
    - execution-image
    - egress-proxy
    - no-proxy
    - runner-tags
    - run-rules

producers:
  - input: list-job
    artifacts: true
    optional: false
    note: >-
      Required. A mirror copies a list somebody else resolved, so the producer
      is never optional and never dropped when run-rules are overridden.

outputs:
  - path: .ci-artifacts/<instance>/container-mirror-skopeo/digests.txt
    format: >-
      One line per reference, the destination reference and its sha256 digest,
      tab separated. In dry-run mode the digest is the upstream one, because
      nothing was written.
    retention: 30 days
    when: always

reference_format: >-
  `registry/repo:tag` or `registry/repo:tag@sha256:<64 hex>`. A reference that
  pins a digest is fetched by that digest. skopeo cannot parse a tag and a
  digest in one reference, so the component splits them and fetches
  `repo@digest`; a digest the registry does not hold fails as `manifest
  unknown` and the job exits non-zero.

media_type: >-
  Copies are made with `--format oci`, not `--preserve-digests`. The export
  component stores these manifests in an OCI layout, which accepts OCI media
  types only, so preserving an upstream docker v2 manifest produces one the
  receiving side cannot read.

authentication:
  default_mode: >-
    CI/CD variables. REGISTRY_USER and REGISTRY_PASSWORD hold the destination
    registry credential; mask both. The registry input must be set, because
    there is no Vault to read the host from.
  vault_mode: >-
    Selected by a non-empty vault-addr. The job then logs in with the GitLab ID
    token VAULT_JWT, whose audience is vault-addr, and reads vault-kv-path;
    vault-role and vault-kv-path are required and the job exits 1 without them.
    The KV path and every field name are inputs with no site-specific default.
  identity: GitLab ID token VAULT_JWT, audience = vault-addr (Vault mode only)
  secrets:
    - 'variables: REGISTRY_USER, REGISTRY_PASSWORD'
    - 'or vault-kv-path fields for the registry host, robot name and robot token'
  handling: >-
    The credential is written by python into a mode-600 docker auth file and
    passed to skopeo as --dest-authfile. It never reaches a command line, a
    process listing or the job log; only its length is printed. In Vault mode
    the Vault response is removed from the filesystem before the script stage.
  network:
    - every source registry named in the list files
    - the destination registry
    - vault-addr, in Vault mode
    - ca-bundle-url, when set

failure_behaviour:
  - 'neither credential source configured: exit 1 before any registry call'
  - 'vault-addr set without vault-role or vault-kv-path: exit 1'
  - 'Vault login returning no token: exit 1 before any registry call'
  - 'a list file that is absent, absolute or traverses out of the checkout: exit 1'
  - 'an empty assembled reference set: exit 1'
  - 'a copy or inspect that fails three rounds: exit 1, naming the reference'
  - 'a pinned digest the registry does not hold: same path, `manifest unknown`'

reserved_variables:
  - name: CI_TPL_DRY_RUN
    note: >-
      Set from the dry-run input and overridable by a rule variable, which is
      how a composition runs merge requests in inspect-only mode. Guarded at
      run time because a project or group CI variable outranks a job variable:
      the value must be exactly true or false, and true is accepted only when
      CI_PIPELINE_SOURCE is merge_request_event. Any other combination exits 1
      naming the variable, so a mirror that writes nothing can never report
      success.

compatibility:
  gitlab: '>=17.0 for typed spec:inputs with regex validation'
  runner: 'shell-capable Linux executor, outbound HTTPS'
  execution_image: >-
    docker.io/library/alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
    (alpine 3.21, amd64 index digest verified with skopeo inspect on 2026-09-15)

limitations:
  - list-files is a validated space-separated string, not an array. GitLab
    rejects an array input interpolated into a variables value
    ("variable definition must be either a string or a hash"), and offers no
    join function, so an array cannot reach the shell.
  - The default execution image installs skopeo with apk at run time. See the
    same note in container-list-rke2.

verification:
  - yaml-parsed
  - gitlab-linted
  - integration-tested
