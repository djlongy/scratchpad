# -----------------------------------------------------------------------------
# Tmux config for DevOps workflows (works without plugin downloads)
# -----------------------------------------------------------------------------

set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

set -g history-limit 200000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on

# prefix and ergonomics
unbind C-a
set -g prefix C-b
bind C-b send-prefix

set -g mouse on
setw -g mode-keys vi
set -g status-keys vi
set -g set-clipboard on

# Mouse drag-copy: STAY at the scrolled position after copying (don't snap back
# to the live bottom). The default MouseDragEnd1Pane copies and CANCELS
# copy-mode, which jumps the view to the bottom mid-read. copy-selection-no-clear
# copies to the tmux buffer (and the system clipboard via set-clipboard/OSC 52,
# so it works over SSH with no xclip/wl-copy dependency) while keeping the view
# where it is. Leave copy-mode with q, or just scroll back to the bottom.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# fast reload/edit helpers
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind e new-window -n tmuxconf "vi ~/.tmux.conf"
# Guarded so a missing script produces a message, not a pane that flashes and
# dies (the usual symptom when only .tmux.conf was copied to a box without
# running install.sh).
bind ? if-shell 'test -x "$HOME/.local/bin/tmx-cheatsheet"' \
  'split-window -h -l 48 "~/.local/bin/tmx-cheatsheet"' \
  'display-message "tmx-cheatsheet not found in ~/.local/bin — run dotfiles/install.sh"'

# pane movement and splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize with vim keys (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# quality-of-life in restricted environments (no plugin dependency)
bind-key C-f command-prompt -p "find-window" "find-window '%%'"
bind-key S choose-tree -Zw
bind-key s choose-tree -sZw
bind-key N command-prompt -p "new session name" "new-session -A -s '%%' -c '#{pane_current_path}'"
bind-key -n F1 switch-client -t :=1
bind-key -n F2 switch-client -t :=2
bind-key -n F3 switch-client -t :=3

# status line — placement and lengths only. Colours are left at tmux's defaults
# on purpose: the stock green bar is the clearest signal that you are inside a
# tmux session and not on the bare shell.
set -g status-position bottom
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 100

# Optional blue theme — uncomment to enable
# set -g status-style "fg=colour250,bg=colour236"
# set -g status-left "#[fg=colour39,bold]#S #[fg=colour244]| #[fg=colour252]#(whoami)"
# set -g status-right "#[fg=colour244]%Y-%m-%d #[fg=colour252]%H:%M #[fg=colour244]| #[fg=colour39]#(hostname -s)"
# setw -g window-status-format "#[fg=colour245] #I:#W "
# setw -g window-status-current-format "#[fg=colour16,bg=colour39,bold] #I:#W #[default]"

# -----------------------------------------------------------------------------
# Plugins — vendored in this repo, never downloaded
# -----------------------------------------------------------------------------
# dotfiles/install.d/10-tmux.sh copies the plugin trees into ~/.tmux/plugins.
# TPM is used only as a loader: it reads the @plugin lines below straight out of
# this file, runs the matching plugin, and sends all output to /dev/null. A
# plugin that is not on disk is skipped without a word — so this file stays
# quiet on a machine that never ran install.sh, instead of nagging about it.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect/continuum defaults
set -g @continuum-restore 'off'
set -g @resurrect-capture-pane-contents 'on'

# sessionx settings. Note there is deliberately no @plugin line for it: sessionx
# is the one plugin with a hard external dependency (fzf), and TPM would load it
# unconditionally, leaving a prefix+O binding that fails the moment it is
# pressed. It is loaded further down instead, behind an fzf check.
set -g @sessionx-bind 'O'
set -g @sessionx-prefix on
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '80%'
set -g @sessionx-preview-enabled 'true'
set -g @sessionx-zoxide-mode 'off'
set -g @sessionx-filter-current 'true'
set -g @sessionx-custom-paths "$HOME/work,$HOME/projects,$HOME/.config"
set -g @sessionx-custom-paths-subdirectories 'true'
# Use fzf's own --tmux (fzf >= 0.53) rather than the separate fzf-tmux script,
# which is one less thing that has to exist on the box.
set -g @sessionx-fzf-builtin-tmux 'on'

# Tell TPM where the plugins live up front. It otherwise probes for this
# variable and the miss is recorded in tmux's message log as "unknown variable"
# on every new server. The value is TPM's own default, trailing slash included.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# Load TPM if it is there, silently if it is not, then take away its network
# keys: prefix+I, prefix+U and prefix+M-u shell out to git and cannot work
# against vendored trees. Both halves are one shell command so TPM's own
# bind-key calls are guaranteed to have already run.
run-shell 'tpm=$HOME/.tmux/plugins/tpm/tpm; test -x $tpm || exit 0; $tpm >/dev/null 2>&1; tmux unbind-key U 2>/dev/null; tmux unbind-key M-u 2>/dev/null; tmux bind-key I display-message "tmux plugins ship with this repo - nothing to install" 2>/dev/null; exit 0'

# Load sessionx only when fzf resolves here, in the tmux server environment the
# plugin itself will inherit. No fzf means no prefix+O binding, no error, and no
# message.
run-shell 'command -v fzf >/dev/null 2>&1 || exit 0; sx=$HOME/.tmux/plugins/tmux-sessionx/sessionx.tmux; test -x $sx || exit 0; $sx >/dev/null 2>&1; exit 0'
