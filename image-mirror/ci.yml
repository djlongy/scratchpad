# image-mirror — one job that mirrors the RKE2 image set for the version pinned
# in image-mirror/rke2.yaml. Include it from the repo root .gitlab-ci.yml:
#
#   include: { local: image-mirror/ci.yml }
#   stages: [mirror]
#
# merge request   MIRROR_PUBLISH=false  resolve + fetch + vet (grype gate)
# default branch  MIRROR_PUBLISH=true   + push to $REGISTRY, cosign sign, export
#
# Nothing here is specific to one estate: every host, credential and key is a CI
# variable. Set them in the project's CI/CD settings, masked where they are
# secret. The job needs none of them for a vet-only run.
#
#   REGISTRY            registry host the mirror publishes to (publish only)
#   REGISTRY_USER       robot / service account name        (publish only, masked)
#   REGISTRY_TOKEN      its token                            (publish only, masked)
#   COSIGN_KEY          cosign key: a KMS URI (hashivault://cosign, awskms://...)
#                       or a path to a private key file. With a file, also set
#                       COSIGN_PASSWORD (masked) and provide the key as a CI
#                       *file* variable, e.g. COSIGN_KEY_FILE.
#   S3_ENDPOINT         object store URL for the baseline and the export archive.
#                       Unset = no baseline and no export; the gate still runs.
#   S3_BUCKET/S3_PREFIX where the archive and the baseline live
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY   object store identity (masked)
#   EGRESS_PROXY        http://proxy.example.com:3128, or empty for direct egress
#   CA_BUNDLE           PEM text (or a file variable) for an internal CA that the
#                       job image does not carry. Empty = nothing installed.
#   GATE / GATE_SEVERITY see the README; defaults ratchet / critical.

mirror:
  stage: mirror
  image: alpine:3.21
  variables:
    COSIGN_VERSION: "v2.4.1"
    SYFT_VERSION: "v1.20.0"
    # Pin grype no older than the vulnerability database schema it downloads. An
    # older client fails the migration and then writes an EMPTY report for every
    # image, which reads as a clean scan. Bump this pin with the database.
    GRYPE_VERSION: "v0.118.0"
  before_script:
    - |
      if [ -n "${EGRESS_PROXY:-}" ]; then
        export HTTP_PROXY="$EGRESS_PROXY" HTTPS_PROXY="$EGRESS_PROXY"
        export http_proxy="$HTTP_PROXY" https_proxy="$HTTPS_PROXY"
        # The internal object store host is listed BY NAME as well as by CIDR:
        # botocore, and therefore aws-cli, ignores CIDR entries in NO_PROXY, so
        # a CIDR-only list sends every S3 call through the proxy, which denies
        # the host with 403.
        s3_host=$(printf '%s' "${S3_ENDPOINT:-}" | sed -e 's#^[a-z]*://##' -e 's#[:/].*##')
        export NO_PROXY="localhost,127.0.0.1,.example.com,10.0.0.0/8,192.168.0.0/16${s3_host:+,$s3_host}"
        export no_proxy="$NO_PROXY"
        echo "egress: via proxy $EGRESS_PROXY (NO_PROXY=$NO_PROXY)"
      else
        echo "egress: direct (EGRESS_PROXY unset)"
      fi
      # Name the right culprit when the proxy is what is down: apk reports it as
      # a generic "network error" against the Alpine CDN. Plain http here on
      # purpose: busybox wget (the only fetcher in a bare alpine job) cannot
      # CONNECT-tunnel https through an HTTP proxy, so an https probe fails with
      # "error getting response" even when the proxy is fine. apk and curl
      # (installed next) tunnel https correctly.
      if ! wget -T 15 -O /dev/null http://dl-cdn.alpinelinux.org/alpine/v3.21/main/x86_64/APKINDEX.tar.gz 2>&1; then
        echo "egress ${EGRESS_PROXY:+through $EGRESS_PROXY }is not working from this runner."
        echo "This is a runner/proxy-host problem, not a repo problem."
        exit 1
      fi
    - apk add --no-cache bash curl python3 skopeo tar aws-cli ca-certificates >/dev/null
    - |
      # An alpine job trusts no internal CA. Install the chain before the first
      # registry call, or publish fails with x509: unknown authority after a
      # perfectly clean vet. CA_BUNDLE may be PEM text or a file variable path.
      if [ -n "${CA_BUNDLE:-}" ]; then
        if [ -f "$CA_BUNDLE" ]; then cp "$CA_BUNDLE" /usr/local/share/ca-certificates/internal-ca.crt
        else printf '%s\n' "$CA_BUNDLE" > /usr/local/share/ca-certificates/internal-ca.crt; fi
        update-ca-certificates >/dev/null 2>&1
        echo "trusted: $(grep -c 'BEGIN CERTIFICATE' /usr/local/share/ca-certificates/internal-ca.crt) internal CA certificate(s)"
      else
        echo "trusted: public roots only (CA_BUNDLE unset)"
      fi
    - |
      base="https://github.com/anchore"
      curl -sfL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
        -o /usr/local/bin/cosign && chmod +x /usr/local/bin/cosign
      curl -sfL "$base/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VERSION#v}_linux_amd64.tar.gz" \
        | tar -xz -C /usr/local/bin syft
      curl -sfL "$base/grype/releases/download/${GRYPE_VERSION}/grype_${GRYPE_VERSION#v}_linux_amd64.tar.gz" \
        | tar -xz -C /usr/local/bin grype
      cosign version --json >/dev/null && syft version >/dev/null && grype version >/dev/null
    - |
      # A key supplied as a CI file variable is placed where cosign expects it.
      # A KMS URI in COSIGN_KEY needs nothing here. Lengths only, never values.
      if [ -n "${COSIGN_KEY_FILE:-}" ]; then
        install -m 600 "$COSIGN_KEY_FILE" /tmp/cosign.key
        export COSIGN_KEY=/tmp/cosign.key
      fi
      echo "publish=${MIRROR_PUBLISH:-false} registry=${REGISTRY:-<unset>} cosign_key=${COSIGN_KEY:+set} token_length=${#REGISTRY_TOKEN}"
  script:
    - bash image-mirror/mirror.sh
  artifacts:
    paths:
      - out/images.txt
      - out/sbom/
      - out/scan/
      - out/digests.txt
      - out/vulns.json
      - out/manifest.json
    when: always
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables:
        MIRROR_PUBLISH: "true"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - image-mirror/**/*
      variables:
        MIRROR_PUBLISH: "false"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - image-mirror/**/*
      variables:
        MIRROR_PUBLISH: "true"
  allow_failure: false
