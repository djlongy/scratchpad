# Docs-as-code pipeline for a Markdown repo where docs/ is the only source.
#
#   merge request / branch -> lint: strict MkDocs build, markdownlint, link check
#   default branch         -> wiki: two-way sync with the project wiki (needs WIKI_TOKEN):
#                             wiki edits become repo commits by their author, then docs/
#                             is mirrored into the wiki (scripts/wiki-deploy.sh)
#                          -> pages: GitLab Pages, if the instance has it (delete otherwise)
#
# Copy this file, the scripts/ folder, requirements.txt, .markdownlint.yaml and mkdocs.yml
# into the docs repo. Everything is driven by predefined CI variables except WIKI_TOKEN.

# Runner tag every job uses; change or remove to match the instance's runners.
default:
  tags: [docker]

stages:
  - test
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # Point pip at an internal registry on an air-gapped instance; a project CI/CD variable
  # of the same name overrides this default.
  PIP_INDEX_URL: "https://pypi.org/simple"

cache:
  key: pip
  paths:
    - .cache/pip

.mkdocs:
  image: python:3.12
  before_script:
    - pip install -q -r requirements.txt

.checks:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

# Broken relative links and pages missing from the nav fail the build. Zensical reads
# mkdocs.yml; with the Material fallback pins use `mkdocs build --strict` instead.
lint:
  extends: [.mkdocs, .checks]
  script:
    - zensical build --clean --strict

# https://github.com/DavidAnson/markdownlint-cli2 (rules in .markdownlint.yaml)
markdownlint:
  extends: .checks
  image:
    name: davidanson/markdownlint-cli2
    entrypoint: [""]
  script:
    - markdownlint-cli2 "docs/**/*.md"

# https://github.com/lycheeverse/lychee. --offline checks only local file links, so
# private hosts the runner cannot reach do not fail the job.
links:
  extends: .checks
  image:
    name: lycheeverse/lychee
    entrypoint: [""]
  script:
    - lychee --offline --no-progress "docs/**/*.md"

# Mirror docs/ into the project wiki. WIKI_TOKEN is a project access token with the
# write_repository scope and the Developer role, stored as a masked CI variable.
# CI_JOB_TOKEN can clone a wiki but GitLab refuses its pushes, so the job is skipped
# by its rule until the variable exists rather than failing every pipeline.
# The scripts' own tests, in MR, branch and default-branch pipelines; coverage.xml is for a
# SonarQube job if the instance has one (a job with no rules is left out of MR pipelines).
scripts-test:
  stage: test
  image: python:3.12
  script:
    - pip install -q pyyaml pytest pytest-cov
    - python3 -m pytest -q scripts/ --cov=scripts --cov-report=xml:coverage.xml
  artifacts:
    paths: [coverage.xml]
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

wiki:
  stage: deploy
  image: python:3.12
  script:
    - pip install -q pyyaml
    # Two-way: wiki edits -> repo commits by their author (pushed with ci.skip), then
    # docs/ -> wiki as the CI author. Same command works from a shell with .env sourced.
    - bash scripts/wiki-deploy.sh docs wiki
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $WIKI_TOKEN

# GitLab Pages (17.9+ form: the job may have any name, `pages.publish` names the built dir).
# Remove this job on an instance without Pages; the wiki job is then the only publish step.
deploy-docs:
  extends: .mkdocs
  stage: deploy
  script:
    - zensical build --clean --strict
  pages:
    publish: site
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
