# GitLab: MRs get a strict build, main publishes GitLab Pages.
# Zensical (Material for MkDocs' successor) builds from the same mkdocs.yml and writes site/.
# Needs GitLab 17.9+ for the nested `pages:` keyword; older instances: see the comment at the end.
image: python:3.12-slim

stages: [test, deploy]

.build:
  before_script:
    - pip install -r requirements.txt

docs-build:
  extends: .build
  stage: test
  script:
    - zensical build --clean --strict
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

deploy-docs:
  extends: .build
  stage: deploy
  script:
    - zensical build --clean --strict
  pages:
    publish: site
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# GitLab older than 17.9: replace deploy-docs with
