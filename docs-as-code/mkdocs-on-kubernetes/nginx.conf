# Static site. MkDocs writes each page as <path>/index.html, so a request for /section/
# maps straight to a file; /section (no slash) is redirected by try_files' directory rule.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Directory redirects (/section -> /section/) must not carry the container's 8080 port
    # when the site is served through an ingress on 443.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    # The MkDocs 404 page, so a bad link shows the site's own error page.
    error_page 404 /404.html;

    # Fingerprinted assets can be cached hard; HTML should not be.
    location /assets/ {
        add_header Cache-Control "public, max-age=604800, immutable";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Liveness/readiness for Kubernetes.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
