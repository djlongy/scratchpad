---
# inventories/localhost/hosts.yml
#
# Minimal controller-only inventory for read-only, localhost-executed plays that
# just render/inspect variables — e.g. playbooks/net_show.yml, which prints the
# derived network catalog (group_vars/all/networks.yml) through its projections.
#
# Nothing here connects out: the single host is the Ansible controller itself.
#
#   source <your-ansible-venv>/bin/activate
#   ansible-playbook -i inventories/localhost/hosts.yml playbooks/net_show.yml
#
# The network vars come from the PLAYBOOK-adjacent group_vars/all (loaded by
# playbook location), not from this inventory — so this file stays tiny.

all:
  hosts:
    localhost:
      ansible_connection: local
      # Use the same interpreter that is running ansible-playbook (the venv),
      # so netaddr/jmespath are importable for ipaddr/json_query.
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
