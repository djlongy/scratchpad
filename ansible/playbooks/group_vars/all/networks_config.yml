---
# ── Network catalog — ENGINE CONFIGURATION ─────────────────────────────────
# What the estate-agnostic engine (filter_plugins/network_catalog.py) needs to
# know about US: which platforms exist, how names are built, what a well-formed
# segment must carry, what every segment inherits.
#
# You touch this file when the RULES change, not when a segment does.
#
# Every option below is documented in filter_plugins/docs/network_catalog.md
# Segments live in networks.yml; output shapes in networks_platforms.yml;
# the contract you read is _networks_derived.yml.

# The platform MEMBERSHIP labels allowed in a segment's platforms[]. Add a
# label here and it becomes selectable; give it a view in
# networks_platforms.yml and it becomes a list. (View namespaces like `switches`
# are free labels and do NOT need to appear here — see the doc's
# "Membership vs namespace" section.)
#
# `catalog_only` is a real label with no view, and it is the supported way to say
# "generate this segment but apply it nowhere". Reach for it instead of
# `platforms: []`: an empty list reads as an authoring mistake and the validator
# rejects it as a missing required field (tested — see
# test_empty_string_and_empty_list_count_as_missing), so a genuinely
# apply-nowhere segment has to name that intent rather than omit it.
network_platforms: [hypervisor, firewall, switches, wifi, edge, catalog_only]

# Fields every segment inherits unless it sets its own.
network_segment_defaults:
  hv_vswitch: "{{ hv_switch_name }}"
  hv_allow_promiscuous: false
  hv_allow_forged_transmits: false
  hv_allow_mac_change: false
  hv_num_ports: 0
  hv_port_binding: ephemeral
  tenancy: platform

# ── Name recipes ───────────────────────────────────────────────────────────
# Deliberately platform-NEUTRAL: a name recipe describes a shape, not a vendor.
# The platform words belong in the views below, which are vendor-specific by
# definition. Every segment gets one name per recipe.
#
#   name        the primary identity (network_primary_name_recipe). hypervisor uses it as
#               the port-group name, but nothing about the recipe says so.
#   short_name  the same name minus the VLAN part — the switch fabric wants the label
#               without VLANnn, and `from:` keeps the two in sync with no regex
#               and no second parts list.
#
# A segment can pin either by declaring a field of that name (`name: FOO`).
network_primary_name_recipe: name

network_name_recipes:
  name:
    parts: [vlan, env, role]
    case: upper
    sep: "-"
    vlan_prefix: "VLAN"
    # pad 2 renders VLAN0 as VLAN00 and VLAN1 as VLAN01, matching the names
    # already on the vDS; ids of 3+ digits are unaffected.
    vlan_pad: 2
  short_name:
    from: name
    drop_tokens: [vlan, vlan_label, vid]


# ── Required fields (what a well-formed segment must carry here) ───────────
# Checked against the segment AS WRITTEN — a field supplied only by
# network_segment_defaults still counts as missing, so required fields must
# be declared on every segment itself.
# L3 fields are required only where a device ROUTES the segment: L2-only
# isolation VLANs (pool-generated) legitimately have no subnet or gateway.
# Placement (site/zone) and identity (role) stay mandatory for everything.
network_required_fields:
  all: [vlan_id, platforms, site, zone, role]
  by_platform:
    firewall: [subnet, netmask, gateway, dns, fw_parent, fw_descr]
    edge: [subnet, gateway]
    wifi: [wifi_net_name, wifi_site]

# ── Partitions to build (_segments_by.<field> / _cidrs_by.<field>) ─────────
# `pool` groups every pool-generated segment under its pool name.
network_partition_fields: [site, zone, role, env, tenancy, pool]

# ── What makes two segments neighbours for uniqueness ──────────────────────
# A duplicate VLAN id or name is only a clash WITHIN one L2 domain. VLAN 10
# at site-a and VLAN 10 at site-b are two broadcast domains that happen
# to share a tag — ordinary multi-site practice, not a mistake — so the
# duplicate checks group by these fields before comparing.
#
# `site` suits this estate. Widen it if one site ever runs isolated fabrics
# that may each carry the same tag:
#
#   network_uniqueness_scope: [site, fabric]
#
# Empty list = compare across the whole estate (the old behaviour).
# Segments declaring none of these fields are compared against each other.
network_uniqueness_scope: [site]

# ── Where the pools live ───────────────────────────────────────────────────
# Pools are read from a plain file, not from group_vars, because they use
# `{{ }}` templates for their keys and names. Ansible renders a group_vars
# value the moment it is referenced — before any pool member exists — so those
# braces must never reach the templar. The catalog engine opens this path
# itself, which keeps them out of it. Point this elsewhere to swap pool sets
# per estate; a path that cannot be read becomes one line in _config_errors.
network_pools_file: "{{ playbook_dir }}/pools.yml"

# ── Where the views live ───────────────────────────────────────────────────
# Same constraint as pools, same solution: a view's fields are `{{ }}` and
# Ansible would render them the moment the variable is referenced — before any
# row exists to bind `seg` to. Read through lookup+from_yaml, whose output
# Ansible does not re-template. Point this elsewhere to swap view sets.
network_views_file: "{{ playbook_dir }}/networks_views.yml"

# Ceiling on what ONE pool may generate. instances x roles is a multiplication,
# so a typo in `instances` is not a slightly bigger catalog — it is thousands
# of segments built before anyone can object. Raise it deliberately if a pool
# genuinely needs to be that large.
#
# 0 (or unset) means "use the engine's built-in default of 2000" — there is no
# way to say "allow nothing". A negative value is refused and reported.
network_pool_max_segments: 2000
