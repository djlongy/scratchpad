---
# ── Network catalog — THE SEGMENTS ─────────────────────────────────────────
# Loaded for every play under playbooks/ (playbook-adjacent group_vars/all).
# Do NOT redeclare these roots in inventory group_vars/all — they drift.
#
# THIS FILE IS THE ONE YOU EDIT DAY TO DAY: add or change a network segment
# here and every platform list rebuilds itself. Its three companions:
#
#   networks_config.yml     the engine's knobs — platforms, name recipes,
#                           required fields, per-segment defaults
#   networks_platforms.yml  what each platform gets: the output row shapes,
#                           the hand-written extra rows, device metadata
#   _networks_derived.yml   the contract you READ (_net.*). Machine-owned.
#
# A leading underscore — on a var OR a filename — means machine-owned: derived
# by the engine, never edited by hand.
#
# FULL GUIDE (workflows, troubleshooting, every option): docs/network-catalog.md
# Browse the results instead of reading YAML:
#   ansible-playbook -i inventories/example playbooks/ops_net_facts.yml
#
# The ENGINE is plugins/filter/network_catalog.py — pure Python, unit-tested
# (tests/unit/roles/test_network_catalog.py), and estate-agnostic: it holds no
# value specific to any one site. _networks_derived.yml is the thin contract
# that calls it. Both lift and shift into any Ansible repo unchanged; if
# onboarding an estate seems to need an edit there, the missing knob belongs in
# the config files instead.
#
# NAMING TIERS — an underscore means "dynamically calculated, never set by a
# user"; the count says whether you may read it:
#   (none)  raw user config — this file and its config companions
#   _one    derived + EXPOSED — the contract in _networks_derived.yml.
#           The headline is `_net`, keyed by output NAMESPACE:
#             _net.esxi.port_groups            list of rows
#             _net.dell.vlans                  list of rows
#             _net.palo.zones                  list of rows
#             _net.pfsense.vlans['site-a']     grouped view → dict per site
#           plus _segments, _segments_by.<field>.<value>,
#           _cidrs_by.<field>.<value>, _operator_cidrs,
#           _vlan_ids_by_platform, and the validation vars.
#   __two   derived + INTERNAL — pipeline stages; never consume.
#
# Controller dependencies: none beyond ansible-core.
#
# Inventory only *selects* which segment is this env's primary:
#   network_gateway:    "{{ network_underlays.mgt.gateway }}"
#   vsphere_vm_network: "{{ _name_by_key.mgt }}"
#
# The object is `network_underlays` — plural, and the only name for it.
#
# ═══════════════════════════════════════════════════════════════════════════
# SCHEMA
#   Fabric:    vlan_id, subnet, netmask, gateway, dns[]
#   Platforms: platforms[]  ← which platforms this segment applies to
#   Identity:  tenancy, env, role, instance  (name tokens)
#   Naming:    name_parts / name_case / name_suffix / vlan_prefix / vlan_pad
#   Placement: site, zone
#   Ops:       description, operator_source (bool → _operator_cidrs)
#
# platforms[] — the allowed labels are network_platforms in networks_config.yml.
# A segment absent from a platform simply never appears in that list;
# platforms: [catalog_only] documents a segment that reaches no device.
#
# Naming is built from TOKENS, never typed as a literal — see the recipes in
# networks_config.yml. A field named after a recipe (`name:`) pins that name
# outright, which `--tags names` then flags with a `*`.
#
# NOTE: this is a DEMONSTRATION catalog with invented addressing. It exists to
# exercise every engine feature end to end, not to describe a real network.
# ═══════════════════════════════════════════════════════════════════════════

network_underlays:

  # ── Site infrastructure — untagged/native, repeats legitimately per site ──
  infra:
    vlan_id: 0
    subnet: "192.168.0.0/24"
    netmask: "255.255.255.0"
    gateway: "192.168.0.1"
    dns: ["192.168.0.1"]
    platforms: [esxi, switches]
    role: infra
    site: site-a
    zone: infra
    description: "site infrastructure — hypervisor management adjacency"
    operator_source: true
    esxi_num_ports: 15
    # A promiscuous-capable port group: the only rows that emit a `security`
    # block in the vCenter view (see emit_when_any in networks_platforms.yml).
    esxi_allow_promiscuous: true
    esxi_allow_forged_transmits: true
    esxi_allow_mac_change: true

  site_b_infra:
    vlan_id: 0
    subnet: "192.168.1.0/24"
    netmask: "255.255.255.0"
    gateway: "192.168.1.1"
    dns: ["192.168.1.1"]
    platforms: [switches]
    role: infra
    site: site-b
    zone: infra
    description: "second site LAN — untagged, same vlan_id 0 as site-a"
    # Without this the recipe [vlan, env, role] renders VLAN00-INFRA for BOTH
    # site-a and site-b infra (neither carries an env token), and the catalog
    # fails validation on _duplicate_names. An untagged segment that repeats
    # per site always needs a distinguishing token.
    name_suffix: sb

  # ── Management plane ──────────────────────────────────────────────────────
  mgt:
    vlan_id: 10
    subnet: "192.168.10.0/24"
    netmask: "255.255.255.0"
    gateway: "192.168.10.1"
    dns: ["192.168.10.1"]
    platforms: [esxi, firewall, switches, unifi, palo]
    env: mgt
    role: svc
    site: site-a
    zone: mgt
    description: "management services plane"
    operator_source: true
    pfsense_parent: vmx1
    pfsense_descr: "V10_MGT_SVC"
    unifi_name: "V10_MGT_SVC"
    unifi_site: sa

  mgt_cluster:
    vlan_id: 11
    subnet: "192.168.11.0/24"
    netmask: "255.255.255.0"
    gateway: "192.168.11.1"
    dns: ["192.168.11.1"]
    platforms: [esxi, firewall, switches, unifi, palo]
    env: mgt
    role: cluster
    site: site-a
    zone: mgt
    description: "management cluster plane"
    pfsense_parent: vmx1
    pfsense_descr: "V11_MGT_CLUSTER"
    unifi_name: "V11_MGT_CLUSTER"
    unifi_site: sa

  # ── Development plane ─────────────────────────────────────────────────────
  dev:
    vlan_id: 20
    subnet: "192.168.20.0/24"
    netmask: "255.255.255.0"
    gateway: "192.168.20.1"
    dns: ["192.168.20.1"]
    platforms: [esxi, firewall, switches, unifi, palo]
    env: dev
    role: svc
    site: site-a
    zone: dev
    description: "dev services plane"
    pfsense_parent: vmx1
    pfsense_descr: "V20_DEV_SVC"
    unifi_name: "V20_DEV_SVC"
    unifi_site: sa

  dev_cluster:
    vlan_id: 21
    subnet: "192.168.21.0/24"
    netmask: "255.255.255.0"
    gateway: "192.168.21.1"
    dns: ["192.168.21.1"]
    platforms: [esxi, firewall, switches, unifi, palo]
    env: dev
    role: cluster
    site: site-a
    zone: dev
    description: "dev cluster plane"
    pfsense_parent: vmx1
    pfsense_descr: "V21_DEV_CLUSTER"
    unifi_name: "V21_DEV_CLUSTER"
    unifi_site: sa

  # ── Production plane ──────────────────────────────────────────────────────
  prod:
    vlan_id: 30
    subnet: "192.168.30.0/24"
    netmask: "255.255.255.0"
    gateway: "192.168.30.1"
    dns: ["192.168.30.1"]
    platforms: [esxi, firewall, switches, unifi, palo]
    env: prod
    role: svc
    site: site-a
    zone: prod
    description: "production services plane"
    pfsense_parent: vmx1
    pfsense_descr: "V30_PROD_SVC"
    unifi_name: "V30_PROD_SVC"
    unifi_site: sa

  prod_cluster:
    vlan_id: 31
    subnet: "192.168.31.0/24"
    netmask: "255.255.255.0"
    gateway: "192.168.31.1"
    dns: ["192.168.31.1"]
    platforms: [esxi, firewall, switches, unifi, palo]
    env: prod
    role: cluster
    site: site-a
    zone: prod
    description: "production cluster plane"
    pfsense_parent: vmx1
    pfsense_descr: "V31_PROD_CLUSTER"
    unifi_name: "V31_PROD_CLUSTER"
    unifi_site: sa

  # ── DMZ ───────────────────────────────────────────────────────────────────
  dmz:
    vlan_id: 9
    subnet: "192.168.9.0/24"
    netmask: "255.255.255.0"
    gateway: "192.168.9.1"
    dns: ["192.168.9.1"]
    platforms: [esxi, firewall, switches, unifi, palo]
    role: dmz
    site: site-a
    zone: dmz
    description: "internet-facing DMZ"
    pfsense_parent: vmx1
    pfsense_descr: "V09_DMZ"
    unifi_name: "V09_DMZ"
    unifi_site: sa

  # ── Per-tenant segments — the `tenancy` token drives the name ────────────
  tenant_acme:
    vlan_id: 2
    subnet: "192.168.2.0/24"
    netmask: "255.255.255.0"
    gateway: "192.168.2.1"
    dns: ["192.168.2.1"]
    platforms: [esxi, firewall, switches, unifi, palo]
    tenancy: acme
    role: tenant
    site: site-a
    zone: tenant
    description: "tenant segment — the name comes from the tenancy token"
    # name_parts overrides the estate default recipe for this segment only.
    name_parts: [vlan, tenancy]
    pfsense_parent: vmx1
    pfsense_descr: "V02_ACME"
    unifi_name: "V02_ACME"
    unifi_site: sa

  tenant_globex:
    vlan_id: 3
    subnet: "192.168.3.0/24"
    netmask: "255.255.255.0"
    gateway: "192.168.3.1"
    dns: ["192.168.3.1"]
    platforms: [esxi, firewall, switches, unifi, palo]
    tenancy: globex
    role: tenant
    site: site-a
    zone: tenant
    description: "second tenant segment"
    name_parts: [vlan, tenancy]
    pfsense_parent: vmx1
    pfsense_descr: "V03_GLOBEX"
    unifi_name: "V03_GLOBEX"
    unifi_site: sa

  # ── Second-site lab — produces a site-b row in the grouped views ─────────
  site_b_lab:
    vlan_id: 100
    subnet: "192.168.100.0/24"
    netmask: "255.255.255.0"
    gateway: "192.168.100.1"
    dns: ["192.168.100.1"]
    platforms: [firewall, unifi, palo]
    role: lab
    site: site-b
    zone: lab
    description: "remote-site lab — appears under _net.pfsense.vlans['site-b']"
    name_suffix: sb
    pfsense_parent: vmx1
    pfsense_descr: "V100_LAB_SB"
    unifi_name: "V100_LAB_SB"
    unifi_site: sb

  # ── A pinned name — the escape hatch no token set can express ────────────
  # `--tags names` stars this and _names_pinned lists it, so a pin stays
  # visible instead of becoming invisible drift.
  legacy_storage:
    vlan_id: 50
    subnet: "192.168.50.0/24"
    netmask: "255.255.255.0"
    gateway: "192.168.50.1"
    dns: ["192.168.50.1"]
    platforms: [esxi, switches]
    role: storage
    site: site-a
    zone: infra
    description: "pre-existing port group — renaming it on the vDS is not free"
    name: "VLAN50-LEGACY-STORAGE-DO-NOT-RENAME"

  # ── Documented but applied nowhere ───────────────────────────────────────
  future_wan:
    vlan_id: 120
    subnet: "192.168.120.0/24"
    netmask: "255.255.255.0"
    gateway: "192.168.120.1"
    dns: ["192.168.120.1"]
    platforms: [catalog_only]
    role: wan
    site: site-b
    zone: wan
    description: "planned segment — reaches no device until platforms[] is set"

# ── Generated segments ─────────────────────────────────────────────────────
# One pool emits instances x roles segments. This is where a catalog earns its
# keep: 4 instances x 5 roles = 20 segments from ~15 lines, each with a
# computed VLAN and subnet, none of them typed by hand.
#
#   vlan = vlan_base + (n - 1) * vlan_stride + role_offset
#
# subnet_base carves the Nth network of that size, stepped by subnet_stride,
# with the gateway at gateway_offset.
#
# platforms: [catalog_only] keeps the demo from queueing 20 port groups onto a
# real vDS. Set it to [esxi, switches] to actually reconcile them.
network_segment_pools:
  acme_lab:
    tenant: acme
    env: lab
    site: site-a
    zone: tenant
    vlan_base: 2000
    vlan_stride: 10
    instances: 4
    roles: [app, db, web, cache, mgmt]
    platforms: [catalog_only]
    key_parts: [pool, instance_nn, role]
    name_parts: [vlan, tenant, env, instance_nn, role]
    subnet_base: "10.20.0.0/26"
    subnet_stride: 1
    gateway_offset: 1
    name_case: lower

# ── Fallbacks ──────────────────────────────────────────────────────────────
# Inventory should pick a segment netmask; these exist so a play that forgets
# still renders something obvious rather than an undefined-variable error.
network_underlay_netmask: "255.255.255.0"
network_netmask: "{{ network_underlay_netmask }}"

# ── Convenience maps used by inventories to pick "this env's segment" ──────
network_underlay_env_primaries:
  mgt: mgt
  dev: dev
  prod: prod

network_underlay_env_clusters:
  mgt: mgt_cluster
  dev: dev_cluster
  prod: prod_cluster
