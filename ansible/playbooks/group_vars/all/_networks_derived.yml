---
# ── Network catalog — the CONTRACT (do not edit per-estate) ─────────────────
#
# Engine: filter_plugins/network_catalog.py (estate-agnostic, unit-tested).
# This file calls it once and names the results. Estate specifics live next
# door: networks.yml (segments) · pools.yml (generators) · networks_config.yml
# (rules) · networks_platforms.yml (output shapes).
#
# Full reference: filter_plugins/docs/network_catalog.md
#
# ── What you read, 99% of the time ─────────────────────────────────────────
#
#   _net.<namespace>.<list>
#
#     _net.hypervisor.port_groups          hypervisor port groups
#     _net.hypervisor.hv_mgr_portgroups   the same, shaped for a distributed-switch portgroup module
#     _net.switches.vlans                the switch fabric VLANs
#     _net.edge.interfaces           edge L3 subinterfaces
#     _net.edge.zones                edge zones
#     _net.firewall.vlans.<site>      firewall 802.1q VLANs, per site
#     _net.firewall.interfaces.<site> firewall SVIs, per site
#     _net.wifi.vlans.<site>        Wi-Fi vlan-only networks, per site
#
#   Wire one into a host:
#     firewall_network_vlans: "{{ _net.firewall.vlans.site-a }}"
#     hypervisor manager_config.portgroups: "{{ _net.hypervisor.hv_mgr_portgroups }}"
#
#   Concatenate with a hand-maintained list — same shape, one loop:
#     loop: "{{ my_existing_rows + _net.hypervisor.port_groups }}"
#
#   Browse without reading YAML:
#     ops_net_show.yml --tags views        every list
#     ops_net_facts.yml --tags validate    is the catalog well-formed
#     ops_net_views.yml                    the network_views engine's lists
#
# ── Everything else ────────────────────────────────────────────────────────
#   _segments                  every segment as a flat row (your fields plus
#                              built names, platforms, tagged, prefixlen,
#                              gateway_cidr, on_<platform>)
#   _segments_by.<field>.<v>   partition by any field — _segments_by.role.svc
#   _cidrs_by.<field>.<v>      the same as subnet lists — firewall rule fodder
#   _vlan_ids_by_platform      platform → sorted unique tagged VLAN ids
#   _vlan_ranges_by_platform   those ids compressed — ['10','2000-2004', …]:
#     {% for c in _vlan_ranges_by_platform.hypervisor | batch(6) %}
#     switchport trunk allowed vlan {{ 'add ' if not loop.first }}{{ c | join(',') }}
#   _operator_cidrs            subnets flagged operator_source (allow-lists)
#   *_by_key / _key_by_vlan    lookup maps
#   _segment_keys / _segment_names / _vlan_ids / _tagged_vlan_ids   columns
#   _names_from_recipes / _names_pinned    recipe output vs pinned names
#   _config_errors / _missing_required_fields / _duplicate_names /
#   _duplicate_vlans           validation — all want to be empty, and the
#                              network_facts role asserts them before it hands
#                              you any list.
#
# Naming tiers: no underscore = your config · _one = derived, safe to consume ·
# __two = internal. A role's vars/main.yml outranks playbook group_vars, so a
# role declaring its own `_net` would shadow this inside that role. Nothing
# does; grep before adding one.

# One call. Everything below is a slice of its result.
#
# `pools_file` is a PATH, not the pools themselves: the engine opens it. Pool
# specs carry `{{ }}` for their keys and names, and Ansible renders a
# group_vars value the moment it is referenced — before any member exists to
# render against — so those braces must never pass through the templar. Reading
# the file inside the engine keeps them out of it, and turns a misspelled path
# into one line in _config_errors instead of a lookup traceback thrown from the
# middle of templating this variable.
__catalog: >-
  {{ network_underlays | default({}, true) | network_catalog({
       'pools_file': network_pools_file | default('', true),
       'names': network_name_recipes | default({}, true),
       'name_default': network_primary_name_recipe | default('', true),
       'platforms': network_platforms | default([], true),
       'required': network_required_fields | default({}, true),
       'defaults': network_segment_defaults | default({}, true),
       'partition_fields': network_partition_fields | default([], true),
       'uniqueness_scope': network_uniqueness_scope | default([], true),
       'pool_max_segments': network_pool_max_segments | default(0, true),
     }) }}

# ── The headline: per-platform lists ───────────────────────────────────────
# Built by the VIEWS engine (filter_plugins/network_views.py) from the
# catalog's segments. `_net` is the contract every consumer reads — inventory
# host_vars, group_vars and the device plays all index it — so the engine
# behind it can change without any of them changing, and did.
#
# The lookup+from_yaml chain is load-bearing, not style: Ansible does not
# re-template a filter chain's output, which is the only reason the
# `{{ seg.x }}` in the views file survives to be rendered against a row.
_net: >-
  {{ __catalog.segments
     | network_views(lookup('file', network_views_file) | from_yaml) }}

# ── Segments and partitions ────────────────────────────────────────────────
_segments: "{{ __catalog.segments }}"
_segments_by: "{{ __catalog.by }}"
_cidrs_by: "{{ __catalog.cidrs_by }}"
_vlan_ids_by_platform: "{{ __catalog.vlan_ids_by_platform }}"
_vlan_ranges_by_platform: "{{ __catalog.vlan_ranges_by_platform }}"

# ── Columns and lookups ────────────────────────────────────────────────────
# Subscript, NOT dot: Jinja resolves `foo.bar` by trying getattr(foo, 'bar')
# first and only falling back to foo['bar']. `keys` is a real dict method, so
# `__catalog.keys` hands back the bound method instead of the return key —
# _segment_keys became a builtin_function_or_method, and the first task that
# printed it crashed the YAML callback with "cannot represent an object".
# Any return key colliding with a dict attribute (keys/values/items/get/copy)
# must use the subscript form.
_segment_keys: "{{ __catalog['keys'] }}"
_segment_names: "{{ __catalog.names }}"
_vlan_ids: "{{ __catalog.vlan_ids }}"
_tagged_vlan_ids: "{{ __catalog.tagged_vlan_ids }}"
_segment_by_key: "{{ __catalog.by_key }}"
_vlan_by_key: "{{ __catalog.vlan_by_key }}"
_name_by_key: "{{ __catalog.name_by_key }}"
_subnet_by_key: "{{ __catalog.subnet_by_key }}"
_gateway_by_key: "{{ __catalog.gateway_by_key }}"
_key_by_vlan: "{{ __catalog.key_by_vlan }}"

# ── Operator source subnets (bastion SSH, proxy allow-lists) ───────────────
_operator_cidrs: "{{ __catalog.operator_cidrs }}"

# ── Naming diagnostics ─────────────────────────────────────────────────────
_names_from_recipes: "{{ __catalog.derived_names }}"
_names_pinned: "{{ __catalog.name_overrides }}"

# ── Validation (assert these before consuming anything) ────────────────────
_config_errors: "{{ __catalog.errors }}"
_missing_required_fields: "{{ __catalog.missing }}"
_duplicate_names: "{{ __catalog.duplicate_names }}"
_duplicate_vlans: "{{ __catalog.duplicate_vlans }}"
