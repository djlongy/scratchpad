---
# ── Network catalog — PER-PLATFORM OUTPUT ──────────────────────────────────
# One section per platform: the row shape its modules loop over, the
# hand-written rows appended to the generated ones, and its device metadata.
#
# Read the results as `_net.<platform>.<list>` — see _networks_derived.yml.
# Add a SEGMENT in networks.yml; add a PLATFORM or change a row SHAPE here.
#
# Every option below is documented in docs/network-catalog.md
#
# VIEWS — one section per platform. This is the index: find your platform,
# read its lists. Consume them as `_net.<namespace>.<list>`.
# ═══════════════════════════════════════════════════════════════════════════
# The OUTER key is the output NAMESPACE (a free label — `dell`); the
# `platform:` key inside a view is the segment MEMBERSHIP filter
# (`switches`). They need not match — see the doc's "Membership vs
# namespace" section.
#
# Each view names its own OUTPUT fields, so the engine bends to whatever the
# module expects rather than forcing our vocabulary on it. A view with
# `group_by` becomes a dict keyed by that field's values.
#
# Field spec forms:
#   out: field                a field on the segment, copied (skipped if absent)
#   out: "{a}.{b}"            str.format over the row + consts + index/index0
#   out: {const: v}           a literal
#   out: {group: {...}, emit_when_any: [f]}   nested dict, only when one of f
#                                             is truthy on the row
# View knobs: source · platform · where · consts · group_by · sort_by ·
#             unique_by · omit_if_falsy · append
#
# BROWNFIELD: `append:` bolts an existing hand-maintained list onto the
# generated rows — their shape, passed through untouched. Equivalent at the
# call site:  loop: "{{ their_static_list + _net.esxi.port_groups }}"

network_platform_lists:

  # ── vSphere / ESXi ───────────────────────────────────────────────────────
  esxi:
    # _net.esxi.port_groups — every esxi-targeted segment + our hand-written
    # extras (the trunk, legacy vDS rows).
    port_groups:
      platform: esxi
      fields:
        name: name
        switch: esxi_vswitch
        vlan: vlan_id
        allow_promiscuous: esxi_allow_promiscuous
        allow_forged_transmits: esxi_allow_forged_transmits
        allow_mac_change: esxi_allow_mac_change
        num_ports: esxi_num_ports
        port_binding: esxi_port_binding
      append: "{{ esxi_port_groups_extra }}"

    # _net.esxi.vcenter_portgroups — the same rows reshaped for
    # community.vmware.vmware_dvs_portgroup. security is emitted only for a row
    # that relaxes something, so every other port group keeps
    # network_policy.inherited=true.
    vcenter_portgroups:
      source: port_groups
      fields:
        name: name
        vds: switch
        vlan_id: vlan
        num_ports: num_ports
        port_binding: port_binding
        vlan_trunk: trunk
        security:
          emit_when_any:
            [allow_promiscuous, allow_forged_transmits, allow_mac_change]
          group:
            allow_promiscuous: allow_promiscuous
            allow_forged_transmits: allow_forged_transmits
            allow_mac_change: allow_mac_change
      omit_if_falsy: [vlan_trunk]

  # ── Dell OS10 ────────────────────────────────────────────────────────────
  dell:
    # _net.dell.vlans
    vlans:
      platform: switches
      # Field ORDER here is the display order — `name` first so a dumped list
      # reads `- name: …` rather than being alphabetised. Modules do not care
      # about dict key order, so this is purely for humans.
      fields:
        name: short_name
        id: vlan_id
        key: key
        site: site

  # ── Palo Alto ────────────────────────────────────────────────────────────
  palo:
    # _net.palo.interfaces — ip is the segment gateway, because the
    # subinterface IS the gateway.
    interfaces:
      platform: palo
      where: {tagged: true}
      consts:
        parent: "{{ palo_parent_interface }}"
        vr: "{{ palo_virtual_router }}"
      fields:
        name: "{parent}.{vlan_id}"
        parent: "{parent}"
        tag: vlan_id
        ip: gateway_cidr
        comment: pfsense_descr
        zone: "z-{zone}"
        virtual_router: "{vr}"
        key: key
        site: site

    # _net.palo.zones — the distinct zones the subinterfaces landed on.
    zones:
      source: interfaces
      unique_by: name
      fields:
        name: zone
        mode: {const: layer3}
        enable_user_identification: {const: false}

  # ── pfSense ──────────────────────────────────────────────────────────────
  pfsense:
    # _net.pfsense.vlans.<site> — one firewall consumes one site:
    #   pfsense_network_vlans: "{{ _net.pfsense.vlans.site-a }}"
    vlans:
      platform: firewall
      where: {tagged: true}
      group_by: site
      fields:
        interface: pfsense_parent
        vlan_id: vlan_id
        descr: pfsense_descr
        priority: pfsense_priority

    # _net.pfsense.interfaces.<site>
    interfaces:
      platform: firewall
      where: {tagged: true}
      group_by: site
      fields:
        descr: pfsense_descr
        interface: "{pfsense_parent}.{vlan_id}"
        ipv4_address: gateway
        ipv4_prefixlen: prefixlen

  # ── UniFi ────────────────────────────────────────────────────────────────
  unifi:
    # _net.unifi.vlans.<site> — the append list carries the legacy rows we drive
    # to state: absent.
    vlans:
      platform: unifi
      group_by: unifi_site
      fields:
        name: unifi_name
        vlan_id: vlan_id
        purpose: {const: vlan-only}
      append: "{{ unifi_vlans_extra }}"


# ═══════════════════════════════════════════════════════════════════════════
# Hand-curated custom / static rows (no matrix pattern)
# ═══════════════════════════════════════════════════════════════════════════

# These are the `append:` lists the views bolt onto their generated rows. They
# are passed through AS-IS — their shape is whatever the target module wants,
# which is exactly how a brownfield estate keeps a list it already maintains.
# Keep names/VLANs here OUTSIDE the matrix, so the combined list needs no
# dedupe. A row that has a matrix pattern belongs in network_underlays instead.

# ── ESXi / vDS rows with no matrix pattern (trunk, legacy vDS leftovers) ───
# Same shape as the esxi_port_groups view emits.
# NOTE the field names: an `append:` row is added to the view's OUTPUT, so it
# uses the view's output keys (name/switch/vlan/allow_*), NOT the segment field
# names (esxi_vswitch/esxi_allow_*). That is the point — your existing list
# keeps its own shape.
esxi_port_groups_extra:
  - name: TRUNK
    switch: "{{ esxi_vds_name }}"
    vlan: "0-4094"
    trunk: true
    allow_promiscuous: true
    allow_forged_transmits: true
    allow_mac_change: true
    num_ports: 1
    port_binding: ephemeral

  # Legacy lab port groups that exist on the vDS but have no matrix pattern.
  # They are declared here for one reason: `--tags reconcile` prunes UNDECLARED
  # in-scope port groups, so dropping them from the list would queue them for
  # deletion. Declaring them keeps them out of the orphan set until someone
  # decides to retire them. Retire by deleting the row and running reconcile —
  # not by leaving it out.
  #
  # VLAN50-LEGACY-STORAGE-DO-NOT-RENAME is deliberately NOT here: it is a real
  # matrix segment (legacy_storage) carrying a pinned name, so the matrix
  # already emits it. Listing it here too would emit it twice.
  - {name: VLAN0-POC-LAB-INSIDE, switch: "{{ esxi_vds_name }}", vlan: "0", num_ports: 0, port_binding: ephemeral}
  - {name: VLAN501-LAB-MGMT, switch: "{{ esxi_vds_name }}", vlan: "501", num_ports: 0, port_binding: ephemeral}
  - {name: VLAN502-LAB-ACCESS, switch: "{{ esxi_vds_name }}", vlan: "502", num_ports: 0, port_binding: ephemeral}

# ── UniFi rows with no matrix pattern, keyed by UniFi site ────────────────
# The legacy VLANs we drive to state: absent.
unifi_vlans_extra:
  sa:
    - {name: VLAN40, vlan_id: 40, state: absent}
    - {name: VLAN50, vlan_id: 50, state: absent}


# ═══════════════════════════════════════════════════════════════════════════
# Non-derivable platform data (kept as-is)
# ═══════════════════════════════════════════════════════════════════════════

# ── vCenter device metadata ────────────────────────────────────────────────
# portgroups is WIRED to the derived list — add segments above, not here.
#
# esxi_vds_name is a PLAIN SCALAR on purpose: the derived port-group rows need
# the switch name, and reading `vcenter.vds_name` from them would make Ansible
# template the whole `vcenter` dict (including portgroups) to get one key —
# a recursive-loop error. Every default switch reference resolves this scalar.
esxi_vds_name: "vDS-Lab"

vcenter:
  vds_name: "{{ esxi_vds_name }}"
  portgroups: "{{ _net.esxi.vcenter_portgroups }}"

# ── Palo Alto PoC device metadata ──────────────────────────────────────────
# Subinterfaces and zones are DERIVED (_net.palo.interfaces / .zones).
palo_parent_interface: "ethernet1/1"
palo_virtual_router: "default"
palo_vsys: "vsys1"

palo_alto_config:
  device_group: "lab"
  vsys: "{{ palo_vsys }}"
  template: "lab-template"
  zones: "{{ _net.palo.zones }}"

# ── Dell OS10 ──────────────────────────────────────────────────────────────
# vlans is DERIVED (_net.dell.vlans). Trunks = physical cabling — not derivable,
# so they stay hand-curated on purpose.
dell_os10_config:
  vlans: "{{ _net.dell.vlans }}"
  trunks:
    - name: esxi-01
      description: "esxi-01 uplink(s) to vDS-Lab"
      interfaces: []
      mode: trunk
      native_vlan: 0
      allowed_vlans: all
      peer: "192.168.0.11"
    - name: esxi-02
      description: "esxi-02 uplink(s) to vDS-Lab"
      interfaces: []
      mode: trunk
      native_vlan: 0
      allowed_vlans: all
      peer: "192.168.0.12"
    - name: esxi-03
      description: "esxi-03 uplink(s) to vDS-Lab"
      interfaces: []
      mode: trunk
      native_vlan: 0
      allowed_vlans: all
      peer: "192.168.0.13"
    - name: pfsense-trunk
      description: "pfSense VLAN trunk (vmx1)"
      interfaces: []
      mode: trunk
      native_vlan: 0
      allowed_vlans: all
      peer: pfsense1
    - name: esxi-lab-extra-range
      description: "Extra allowed VLAN range on the ESXi uplinks"
      interfaces: []
      mode: trunk
      native_vlan: 0
      allowed_vlans: "500-599"
      peer: esxi-all
