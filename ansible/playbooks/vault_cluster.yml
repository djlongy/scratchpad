---
# Deploy containerised Vault HA against the `vault` inventory group.
#
# Prerequisites on each host (compose at playbook level — role asserts both):
#   - Docker engine + compose plugin (docker role or equivalent)
#   - Persistent disk mounted at hashicorp_vault_data_mount (default /opt/vault)
#
# Auth: inventories/vault/group_vars/vault/main.yml is Path A shaped.
# Read roles/hashicorp_vault_container/README.md → "Auth & RBAC map" before
# enabling LDAP/Identity/JWT.
#
# Usage:
#   export ANSIBLE_VAULT_PASSWORD=$(cat ~/secrets/vault-password.txt)  # if vault.yml encrypted
#   ansible-playbook -i inventories/vault/hosts.yml playbooks/vault_cluster.yml
#
# Iterate on auth only (after cluster is up):
#   ... --tags policies,ldap
#   ... --tags identity          # Path B only
#   ... --tags gitlab_jwt        # CI only

- name: Deploy containerised HashiCorp Vault cluster
  hosts: vault
  gather_facts: true
  roles:
    - role: hashicorp_vault_container
