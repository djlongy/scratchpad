---
galaxy_info:
  role_name: hashicorp_vault
  author: lab
  description: >-
    Install and configure HashiCorp Vault as a native (package or Docker)
    Raft HA cluster — firewall, TLS, cluster init/unseal, policies, auth
    methods (userpass/LDAP/AppRole/Kubernetes), audit, Transit/cosign,
    auto-unseal, and backups. GitLab OIDC UI SSO and CI JWT auth are opt-in.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: EL
      versions:
        - "8"
        - "9"
  galaxy_tags:
    - vault
    - hashicorp
    - secrets
    - raft
    - security

# Collections (install via repo requirements.yml):
#   ansible.posix           — always (firewalld rules)
#   community.hashi_vault   — always (Vault API reads/writes)
dependencies: []
