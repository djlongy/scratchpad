---
# Public contract for defaults/main.yml only. Cluster/port/policy constants
# live in vars/main.yml and are not role inputs.
argument_specs:
  main:
    short_description: >-
      Install and configure HashiCorp Vault (package or Docker) as a Raft HA
      cluster with policies, auth methods, audit, Transit, auto-unseal, and backups.
    description:
      - >-
        Installs Vault (RPM package or Docker image plus host CLI), opens
        firewall ports, issues TLS via certbot, initialises the Raft cluster,
        and applies post-setup (policies, userpass, AppRole, optional LDAP /
        GitLab OIDC / GitLab CI JWT, audit, Transit/cosign, auto-unseal, backup).
      - >-
        Environment-specific values (domain, HA nodes, cert SANs, LDAP URL,
        GitLab base URL) come from inventory — nothing in defaults hardcodes a
        live estate FQDN as a required constant.
    options:
      # ── Install backend ────────────────────────────────────────────────
      vault_install_method:
        type: str
        default: package
        description: >-
          Server install backend. `package` uses the HashiCorp RPM; `docker`
          runs the server in Docker but still installs a host Vault CLI for
          backup and operational scripts.
        choices:
          - package
          - docker

      vault_docker_image:
        type: str
        default: "hashicorp/vault:1.19"
        description: Container image when vault_install_method is docker.

      vault_container_name:
        type: str
        default: vault
        description: Docker container name when install method is docker.

      vault_container_restart_policy:
        type: str
        default: unless-stopped
        description: Docker restart policy for the Vault container.

      vault_container_extra_args:
        type: list
        elements: str
        default: []
        description: Extra docker run/compose args for the Vault container.

      vault_cli_arch:
        type: str
        default: amd64
        description: Architecture suffix for the host Vault CLI zip (linux_<arch>).

      vault_cli_install_dir:
        type: str
        default: /opt/vault-cli
        description: Host path for the extracted Vault CLI binary (container mode).

      vault_cli_zip_url:
        type: str
        default: "https://releases.hashicorp.com/vault/{{ vault_version }}/vault_{{ vault_version }}_linux_{{ vault_cli_arch }}.zip"
        description: >-
          Download URL for the host Vault CLI zip. vault_version comes from
          vars/main.yml.

      # ── Cluster identity (inventory) ───────────────────────────────────
      vault_ha_nodes:
        type: list
        elements: raw
        required: true
        default: []
        description: >-
          Raft HA cluster node definitions for the environment. Required —
          set in group_vars per estate. Empty list is not a runnable cluster.

      vault_domain:
        type: str
        required: true
        default: ""
        description: >-
          Cluster service FQDN (e.g. vault.mgmt.example.com). Drives vault_addr,
          TLS SAN construction, and OIDC redirect URIs.

      vault_addr:
        type: str
        default: "https://{{ vault_domain }}:8200"
        description: Base HTTPS URL for the Vault API/UI used by API modules.

      # ── TLS / certbot ──────────────────────────────────────────────────
      vault_cert_domains:
        type: list
        elements: str
        required: true
        default: []
        description: >-
          Names on the TLS certificate. First entry is the Let's Encrypt
          lineage name under /etc/letsencrypt/live/<first>/.

      vault_cert_email:
        type: str
        required: true
        default: ""
        description: ACME registration email for certbot.

      # ── Extra mounts ───────────────────────────────────────────────────
      vault_additional_kv_mounts:
        type: list
        elements: str
        default: []
        description: Extra KV v2 mount paths beyond the role's standard set.

      # ── LDAP auth ──────────────────────────────────────────────────────
      vault_ldap_auth_enabled:
        type: bool
        default: false
        description: Enable and configure the LDAP auth method (e.g. FreeIPA).

      vault_ldap_url:
        type: str
        default: ""
        description: LDAP(S) server URL when vault_ldap_auth_enabled is true.

      vault_ldap_binddn:
        type: str
        default: ""
        description: Bind DN used to search the directory.

      vault_ldap_bindpass_vault_path:
        type: str
        default: ""
        description: >-
          HashiCorp Vault KV path for the LDAP bind password (must exist before
          LDAP setup when enabled).

      vault_ldap_bindpass_vault_field:
        type: str
        default: bindpass
        description: Field name of the bind password secret.

      vault_ldap_userdn:
        type: str
        default: ""
        description: Base DN for user search.

      vault_ldap_userattr:
        type: str
        default: uid
        description: LDAP attribute that maps to the Vault username.

      vault_ldap_groupdn:
        type: str
        default: ""
        description: Base DN for group search.

      vault_ldap_groupattr:
        type: str
        default: cn
        description: LDAP attribute used as the group name.

      vault_ldap_groupfilter:
        type: str
        default: "(&(objectClass=groupOfNames)(member={{.UserDN}}))"
        description: >-
          LDAP group filter template (Vault Go template placeholders). Stored
          with Ansible unsafe markers in defaults so Jinja does not expand
          Vault's {{.UserDN}}.

      vault_ldap_starttls:
        type: bool
        default: false
        description: Issue StartTLS on the LDAP connection.

      vault_ldap_insecure_tls:
        type: bool
        default: false
        description: Skip LDAP TLS certificate verification.

      vault_ldap_tls_min_version:
        type: str
        default: tls12
        description: Minimum TLS version for LDAPS/StartTLS.

      vault_ldap_tls_max_version:
        type: str
        default: tls12
        description: Maximum TLS version for LDAPS/StartTLS.

      vault_ldap_certificate:
        type: str
        default: ""
        description: Optional PEM CA certificate for LDAP TLS verification.

      vault_ldap_case_sensitive_names:
        type: bool
        default: false
        description: Treat LDAP usernames/group names as case-sensitive.

      vault_ldap_request_timeout:
        type: int
        default: 90
        description: LDAP request timeout in seconds.

      vault_ldap_groups:
        type: list
        elements: dict
        default: []
        description: >-
          LDAP group → policy mappings. Each entry:
          {name, policies: [..]} written to auth/ldap/groups/<name>.

      # ── GitLab OIDC (Vault UI SSO) ──────────────────────────────────────
      vault_gitlab_oidc_enabled:
        type: bool
        default: false
        description: Enable GitLab OIDC SSO for human Vault UI login.

      vault_gitlab_oidc_force_reconfigure:
        type: bool
        default: false
        description: Rewrite OIDC mount config/role even when already present.

      vault_gitlab_oauth_manage_app:
        type: bool
        default: true
        description: >-
          Auto-create/update the GitLab OAuth application via GitLab admin API
          when OIDC is enabled.

      vault_gitlab_base_url:
        type: str
        default: ""
        description: GitLab base URL (issuer/discovery root) when OIDC or JWT is used.

      vault_gitlab_oidc_mount_path:
        type: str
        default: oidc
        description: Auth mount path for the OIDC method.

      vault_gitlab_oidc_discovery_url:
        type: str
        default: "{{ vault_gitlab_base_url }}"
        description: OIDC discovery URL (defaults to vault_gitlab_base_url).

      vault_gitlab_oauth_app_name:
        type: str
        default: "Vault OIDC"
        description: Display name of the GitLab OAuth application.

      vault_gitlab_oauth_scopes:
        type: list
        elements: str
        default:
          - openid
          - profile
          - email
        description: Scopes requested when managing the GitLab OAuth app.

      vault_gitlab_oauth_confidential:
        type: bool
        default: true
        description: Mark the GitLab OAuth application as confidential.

      vault_gitlab_oauth_require_redirect_match:
        type: bool
        default: true
        description: Require exact redirect URI match on the GitLab OAuth app.

      vault_gitlab_oauth_renew_secret_when_missing:
        type: bool
        default: true
        description: Renew/store client secret when it is missing from Vault KV.

      vault_gitlab_root_api_token_secret_path:
        type: str
        default: ""
        description: Vault KV path to the GitLab admin API token for OAuth app management.

      vault_gitlab_oidc_app_id_secret_kv_path:
        type: str
        default: ""
        description: Vault KV path where the OAuth application ID is stored.

      vault_gitlab_oidc_client_secret_kv_path:
        type: str
        default: ""
        description: Vault KV path where the OAuth client secret is stored.

      vault_gitlab_oidc_client_id:
        type: str
        default: ""
        description: OIDC client ID (inventory/vaulted). Required when OIDC is enabled.

      vault_gitlab_oidc_client_secret:
        type: str
        default: ""
        description: OIDC client secret (inventory/vaulted). Required when OIDC is enabled.

      vault_gitlab_oidc_role_name:
        type: str
        default: gitlab
        description: Vault OIDC role name.

      vault_gitlab_oidc_default_role:
        type: str
        default: "{{ vault_gitlab_oidc_role_name }}"
        description: Default OIDC role on the auth mount.

      vault_gitlab_oidc_user_claim:
        type: str
        default: sub
        description: JWT claim used as the Vault username.

      vault_gitlab_oidc_groups_claim:
        type: str
        default: groups_direct
        description: JWT claim listing group memberships.

      vault_gitlab_oidc_scopes:
        type: list
        elements: str
        default:
          - openid
          - profile
          - email
        description: Scopes requested by the Vault OIDC role.

      vault_gitlab_oidc_policies:
        type: list
        elements: str
        default:
          - ops-admin
        description: Policies attached to successful OIDC logins.

      vault_gitlab_oidc_bound_claims:
        type: dict
        default: {}
        description: Bound claims map for the OIDC role (empty = no bound claims).

      vault_gitlab_oidc_bound_claims_type:
        type: str
        default: string
        description: Bound claims match type (Vault string|glob).

      vault_gitlab_oidc_ttl:
        type: str
        default: 1h
        description: Token TTL for OIDC logins.

      vault_gitlab_oidc_max_ttl:
        type: str
        default: 8h
        description: Max token TTL for OIDC logins.

      vault_gitlab_oidc_allowed_redirect_uris:
        type: list
        elements: str
        default:
          - "https://{{ vault_domain }}/ui/vault/auth/{{ vault_gitlab_oidc_mount_path }}/oidc/callback"
          - "https://{{ vault_domain }}:{{ vault_api_port }}/ui/vault/auth/{{ vault_gitlab_oidc_mount_path }}/oidc/callback"
          - "http://localhost:8250/oidc/callback"
        description: Allowed OIDC redirect URIs for UI and CLI callback flows.

      vault_gitlab_oauth_redirect_uris:
        type: list
        elements: str
        default: "{{ vault_gitlab_oidc_allowed_redirect_uris }}"
        description: Redirect URIs written to the GitLab OAuth application.

      # ── GitLab CI JWT ──────────────────────────────────────────────────
      vault_gitlab_jwt_enabled:
        type: bool
        default: false
        description: Enable GitLab CI JWT auth for pipeline Vault access.

      vault_gitlab_jwt_force_reconfigure:
        type: bool
        default: false
        description: Rewrite JWT auth config/roles even when already present.

      vault_gitlab_jwt_roles:
        type: list
        elements: dict
        description: >-
          JWT roles written under auth/jwt. Defaults cover gitlab-ci,
          gitlab-ci-terraform, and per-env gitlab-ci-{mgt,dev,prod} with
          bound claims and policies. Override in inventory to reshape CI access.
