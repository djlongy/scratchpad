---
# handlers/main.yml for hashicorp_vault role

- name: Reload systemd
  become: true  # root: systemd daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reload Vault
  become: true  # root: manages the vault systemd unit
  ansible.builtin.systemd:
    name: vault
    state: reloaded

- name: Restart unseal-vault service
  become: true  # root: manages the unseal-vault systemd unit
  ansible.builtin.systemd:
    name: unseal-vault.service
    state: restarted
    daemon_reload: true
  failed_when: false # Don't fail if service hasn't run yet
