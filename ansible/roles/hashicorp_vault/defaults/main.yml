---
# Role enable gate — set false in host/group_vars to no-op this role
hashicorp_vault_enabled: true

# Vault server install backend. Package mode preserves the existing RPM install.
# Container mode runs the server with Docker but still installs a host Vault CLI
# for backup and operational scripts that call `vault` directly.
vault_install_method: package
vault_docker_image: "hashicorp/vault:1.19"
vault_container_name: vault
vault_container_restart_policy: unless-stopped
vault_container_extra_args: []
vault_cli_arch: amd64
vault_cli_install_dir: /opt/vault-cli
vault_cli_zip_url: "https://releases.hashicorp.com/vault/{{ vault_version }}/vault_{{ vault_version }}_linux_{{ vault_cli_arch }}.zip"

# HA cluster node definitions — required, set in group_vars per environment
vault_ha_nodes: []
# Vault domain and address — required, set in group_vars per environment
vault_domain: ""
vault_addr: "https://{{ vault_domain }}:8200"

# TLS cert config — passed through to certbot (included from
# tasks/configure.yml). vault_cert_domains is the list of names that
# go on the cert; first entry drives the LE lineage path
# (/etc/letsencrypt/live/<first>/). vault_cert_email is the ACME
# registration address.
#
# Override per-cluster in group_vars or per-host in host_vars when a
# cluster needs a different cert (e.g. mgt vs prod Vault clusters).
#
# Examples:
#   vault_cert_domains: ["vault.mgmt.example.com", "*.mgmt.example.com"]
#   vault_cert_email: "ops@example.com"
vault_cert_domains: []
vault_cert_email: ""

# DEPRECATED — old shape kept commented so legacy inventories surface
# the migration warning in --check runs instead of silently breaking.
# Remove once every inventory uses the list-shaped vars above.
# vault_cert_domain: ""        # was: lineage name, now derived from vault_cert_domains[0]
# vault_certbot_domains: ""    # was: "-d a -d b" string, now list
# cloudflare_email: ""         # was: ACME email, now vault_cert_email

# Additional KV v2 mounts — set in group_vars to scope to the environment
vault_additional_kv_mounts: []
# LDAP authentication — env-specific (URL, bind DN, group filter, group->policy map).
# Leave disabled by default; opt in per environment via group_vars.
vault_ldap_auth_enabled: false
vault_ldap_url: ""
vault_ldap_binddn: ""
vault_ldap_bindpass_vault_path: ""
vault_ldap_bindpass_vault_field: "bindpass"
vault_ldap_userdn: ""
vault_ldap_userattr: "uid"
vault_ldap_groupdn: ""
vault_ldap_groupattr: "cn"
vault_ldap_groupfilter: !unsafe "(&(objectClass=groupOfNames)(member={{.UserDN}}))"
vault_ldap_starttls: false
vault_ldap_insecure_tls: false
vault_ldap_tls_min_version: "tls12"
vault_ldap_tls_max_version: "tls12"
vault_ldap_certificate: ""
vault_ldap_case_sensitive_names: false
vault_ldap_request_timeout: 90
# List of {name, policies: [..]} — each entry creates auth/ldap/groups/<name>
vault_ldap_groups: []
# GitLab OIDC SSO for Vault human login
vault_gitlab_oidc_enabled: false
vault_gitlab_oidc_force_reconfigure: false
vault_gitlab_oauth_manage_app: true
vault_gitlab_base_url: ""

vault_gitlab_oidc_mount_path: "oidc"
vault_gitlab_oidc_discovery_url: "{{ vault_gitlab_base_url }}"

vault_gitlab_oauth_app_name: "Vault OIDC"
vault_gitlab_oauth_scopes:
  - openid
  - profile
  - email
vault_gitlab_oauth_confidential: true
vault_gitlab_oauth_require_redirect_match: true
vault_gitlab_oauth_renew_secret_when_missing: true

vault_gitlab_root_api_token_secret_path: ""
vault_gitlab_oidc_app_id_secret_kv_path: ""
vault_gitlab_oidc_client_secret_kv_path: ""

# Set these in inventory or vaulted vars when enabling OIDC
vault_gitlab_oidc_client_id: ""
vault_gitlab_oidc_client_secret: ""

vault_gitlab_oidc_role_name: "gitlab"
vault_gitlab_oidc_default_role: "{{ vault_gitlab_oidc_role_name }}"

vault_gitlab_oidc_user_claim: "sub"
vault_gitlab_oidc_groups_claim: "groups_direct"
vault_gitlab_oidc_scopes:
  - openid
  - profile
  - email

vault_gitlab_oidc_policies:
  - ops-admin

vault_gitlab_oidc_bound_claims: {}
vault_gitlab_oidc_bound_claims_type: "string"

vault_gitlab_oidc_ttl: "1h"
vault_gitlab_oidc_max_ttl: "8h"

vault_gitlab_oidc_allowed_redirect_uris:
  - "https://{{ vault_domain }}/ui/vault/auth/{{ vault_gitlab_oidc_mount_path }}/oidc/callback"
  - "https://{{ vault_domain }}:{{ vault_api_port }}/ui/vault/auth/{{ vault_gitlab_oidc_mount_path }}/oidc/callback"
  - "http://localhost:8250/oidc/callback"

vault_gitlab_oauth_redirect_uris: "{{ vault_gitlab_oidc_allowed_redirect_uris }}"

# GitLab CI JWT auth for pipeline Vault access
vault_gitlab_jwt_enabled: false
vault_gitlab_jwt_force_reconfigure: false

vault_gitlab_jwt_roles:
  - name: gitlab-ci
    user_claim: user_login
    bound_claims:
      namespace_path: "infra"
    bound_audiences:
      - "{{ vault_addr }}"
    policies:
      - svc-ansible-ci
      - svc-cosign-sign
    token_ttl: "1h"
    token_max_ttl: "4h"
  - name: gitlab-ci-terraform
    user_claim: user_login
    bound_claims:
      namespace_path: "infra"
    bound_audiences:
      - "{{ vault_addr }}"
    policies:
      - svc-terraform-ci
    token_ttl: "1h"
    token_max_ttl: "4h"
  # Per-environment scoped roles — tokens limited to a single KV mount
  - name: gitlab-ci-mgt
    user_claim: user_login
    bound_claims:
      namespace_path: "infra"
      ci_runner_tags: "mgt"
    bound_audiences:
      - "{{ vault_addr }}"
    policies:
      - svc-ci-mgt
    token_ttl: "30m"
    token_max_ttl: "2h"
  - name: gitlab-ci-dev
    user_claim: user_login
    bound_claims:
      namespace_path: "infra"
      ci_runner_tags: "dev"
    bound_audiences:
      - "{{ vault_addr }}"
    policies:
      - svc-ci-dev
    token_ttl: "30m"
    token_max_ttl: "2h"
  - name: gitlab-ci-prod
    user_claim: user_login
    bound_claims:
      namespace_path: "infra"
      ci_runner_tags: "prod"
    bound_audiences:
      - "{{ vault_addr }}"
    policies:
      - svc-ci-prod
    token_ttl: "30m"
    token_max_ttl: "2h"
