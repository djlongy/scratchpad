---
# tasks/audit.yml — Enable Vault file audit device
# Idempotent: checks if already enabled before attempting to enable.
# Run on the leader node only (audit devices are cluster-wide in Raft).

- name: Create Vault audit log directory
  become: true  # root: creates the vault-owned audit log dir
  ansible.builtin.file:
    path: "{{ vault_audit_log_dir | default('/opt/vault/audit') }}"
    state: directory
    owner: vault
    group: vault
    mode: "0750"

- name: Check if file audit device is already enabled
  ansible.builtin.command:
    cmd: >
      vault audit list -format=json
  environment:
    VAULT_ADDR: "https://{{ vault_domain }}:{{ vault_api_port }}"
    VAULT_TOKEN: "{{ lookup('file', vault_token_file) }}"
  register: _vault_audit_list
  changed_when: false
  failed_when: false
  delegate_to: localhost
  become: false

- name: Enable file audit device
  ansible.builtin.command:
    cmd: >
      vault audit enable file
      file_path={{ vault_audit_log_dir | default('/opt/vault/audit') }}/vault-audit.log
  environment:
    VAULT_ADDR: "https://{{ vault_domain }}:{{ vault_api_port }}"
    VAULT_TOKEN: "{{ lookup('file', vault_token_file) }}"
  delegate_to: localhost
  become: false
  when: >
    _vault_audit_list.rc != 0 or
    'file/' not in (_vault_audit_list.stdout | default(''))

- name: Deploy audit log rotation config
  become: true  # root: writes /etc/logrotate.d
  ansible.builtin.copy:
    dest: /etc/logrotate.d/vault-audit
    owner: root
    group: root
    mode: "0644"
    content: |
      {{ vault_audit_log_dir | default('/opt/vault/audit') }}/vault-audit.log {
          daily
          rotate 14
          compress
          delaycompress
          missingok
          notifempty
          copytruncate
      }
