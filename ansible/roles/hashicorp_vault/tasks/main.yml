# roles/hashicorp_vault/tasks/main.yml
---
# vault_leader_node must always be defined — it is used by always-tagged tasks
# inside cluster_init.yml and is required before any include runs.
- name: Skip hashicorp_vault (hashicorp_vault_enabled is false)
  ansible.builtin.debug:
    msg: "hashicorp_vault_enabled is false — skipping hashicorp_vault"
  when: not (hashicorp_vault_enabled | bool)
  tags: [always]

- name: Configure hashicorp_vault
  when: hashicorp_vault_enabled | bool
  block:

    - name: Set initial vault_leader_node for bootstrap
      ansible.builtin.set_fact:
        vault_leader_node: "{{ groups['vault'][0] }}"
      tags: always

    # When the playbook is run with a tag filter that skips cluster_init
    # (e.g. --tags ldap, --tags policies), vault_root_token is never set as
    # a fact. Load it lazily from the leader's persisted file so any
    # post_setup subtask can authenticate to Vault.
    - name: Lazy-load vault_root_token from leader for tagged-subset runs
      when: vault_root_token is not defined
      run_once: true
      tags: always
      block:
        # root_token.txt is mode 400 root:vault — slurp needs become:true to read.
        # Without this, tagged-subset runs from environments without a cached
        # vault_root_token fact (e.g. Rundeck container, fresh control nodes)
        # silently fail to set the fact and the next vault_write task errors
        # with "'vault_root_token' is undefined".
        - name: Slurp root token from leader
          ansible.builtin.slurp:
            src: "{{ vault_host_data_dir }}/keys/root_token.txt"
          delegate_to: "{{ vault_leader_node }}"
          become: true
          register: _vault_root_token_slurp
          no_log: true

        - name: Set vault_root_token fact
          ansible.builtin.set_fact:
            vault_root_token: "{{ _vault_root_token_slurp.content | b64decode | trim }}"
          no_log: true

    - name: Install Vault (firewall, packages, Docker, RPM, directories, service)
      include_tasks:
        file: install.yml
        apply:
          tags: [install, firewall, service]
      tags: [install, firewall, service]

    - name: Configure Vault (HCL, TLS certificates, renewal timers)
      include_tasks:
        file: configure.yml
        apply:
          tags: [config, tls]
      tags: [config, tls]

    - name: Initialise and bootstrap Vault cluster
      include_tasks:
        file: cluster_init.yml
        apply:
          tags: cluster_init
      tags: [cluster_init, post_setup]

    - name: Post setup (policies, auth, users, legacy cleanup — run once from leader)
      include_tasks:
        file: post_setup.yml
        apply:
          tags: [post_setup]
      tags: [post_setup, policies, users, ldap, approle, eso, gitlab_sso, gitlab_jwt, legacy_cleanup]
      run_once: true

    - name: Enable Vault audit logging (run once from leader)
      include_tasks:
        file: audit.yml
        apply:
          tags: [audit]
      tags: [audit, post_setup]
      run_once: true

    - name: Configure Transit engine and Cosign signing key (run once from leader)
      include_tasks:
        file: setup_transit_cosign.yml
        apply:
          tags: [transit, cosign]
      tags: [transit, cosign, post_setup]
      run_once: true

    - name: Configure auto-unseal on all nodes
      include_tasks:
        file: post_setup_nodes.yml
        apply:
          tags: [post_setup, auto_unseal, backup]
      tags: [post_setup, auto_unseal, backup]
