---
galaxy_info:
  role_name: storage
  author: lab
  description: >-
    Universal, hardware/name-agnostic disk role — provisions, grows,
    formats, and mounts LVM or plain storage on any Linux host.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: EL
      versions:
        - "8"
        - "9"
    - name: Debian
      versions:
        - bookworm
    - name: Ubuntu
      versions:
        - jammy
        - noble
  galaxy_tags:
    - storage
    - lvm
    - disk
    - filesystem
    - mount

# Collections this role calls (mirrors the README Requirements table).
# Install them from the repo requirements.yml, or ad-hoc:
#   ansible-galaxy collection install -r requirements.yml
#
#   community.general  When storage_provision      parted / lvg / lvol / filesystem
#   community.general  When storage_manage_selinux sefcontext
#   ansible.posix      When storage_manage_fstab   mount (local and network)
dependencies: []
