---
# storage/tasks/mount_one.yml — mount one volume by UUID with nofail.
# `vol` is the resolved volume entry.

- name: "{{ vol.name }} | select filesystem device"
  ansible.builtin.set_fact:
    _m_dev: "{{ vol._dm_dev if vol.lvm | bool else vol._part_dev }}"
    _m_opts: "{{ vol.opts if 'nofail' in (vol.opts | split(',')) else vol.opts ~ ',nofail' }}"

- name: "{{ vol.name }} | ensure mount point {{ vol.mount }} exists"
  become: true  # root: creates the mount-point directory
  ansible.builtin.file:
    path: "{{ vol.mount }}"
    state: directory
    owner: "{{ vol.owner }}"
    group: "{{ vol.group }}"
    mode: "{{ vol.mode }}"

- name: "{{ vol.name }} | resolve filesystem UUID"
  become: true  # root: blkid reads the device
  ansible.builtin.command:
    argv: [blkid, -s, UUID, -o, value, "{{ _m_dev }}"]
  register: _m_uuid
  changed_when: false
  failed_when: false
  check_mode: false

# An unformatted device here is normal mid-build, but it is ALSO what you see when
# the volume asked to be created and the role-level opt-in was never passed — the
# provision phase is skipped, nothing formats the disk, and the only trace is this
# message. Name that case explicitly instead of leaving a bare "not formatted".
- name: "{{ vol.name }} | refuse to skip a declared mount with no filesystem"
  ansible.builtin.assert:
    that:
      - _m_uuid.stdout | trim | length > 0
    fail_msg: >-
      {{ _m_dev }} has no UUID (not formatted) — cannot mount {{ vol.mount }}.
      {{ 'This volume declares provision: true but role-level storage_provision
      is FALSE, so nothing created the filesystem. Pass storage_provision: true.'
      if (vol.provision | bool and not (storage_provision | bool))
      else (
        'An LVM LV appears present without a filesystem (partial provision). '
        'Re-run with storage_provision: true so the incomplete stack can finish mkfs, '
        'or inspect the host stack manually.'
        if (vol.lvm | bool and (vol._lv_exists | default(false) | bool))
        else 'Provisioning is enabled but no filesystem was created — check the provision phase output for this volume.'
      ) }}
    quiet: true
  when:
    - vol.mount | default('') | length > 0
    - _m_uuid.stdout | trim | length == 0

- name: "{{ vol.name }} | manage mount + fstab"
  when: _m_uuid.stdout | trim | length > 0
  block:
    - name: "{{ vol.name }} | mount {{ vol.mount }} by UUID (nofail)"
      become: true  # root: mounts filesystem + writes /etc/fstab
      ansible.posix.mount:
        path: "{{ vol.mount }}"
        src: "UUID={{ _m_uuid.stdout | trim }}"
        fstype: "{{ vol.fstype }}"
        opts: "{{ _m_opts }}"
        state: mounted

    # Pre-mount file: applies owner/mode to the bare directory on the parent
    # filesystem, which is then hidden under the mount. Re-apply on the live
    # mount so the first provisioning run actually sets the declared owner on
    # the volume root (not only on a second converge).
    - name: "{{ vol.name }} | apply owner/group/mode on the mounted filesystem root"
      become: true  # root: chowns the mounted volume root
      ansible.builtin.file:
        path: "{{ vol.mount }}"
        state: directory
        owner: "{{ vol.owner }}"
        group: "{{ vol.group }}"
        mode: "{{ vol.mode }}"

    - name: "{{ vol.name }} | read fstab entries for {{ vol.mount }}"
      ansible.builtin.shell:
        cmd: "grep -E '^\\S+\\s+{{ vol.mount | regex_escape }}\\s' /etc/fstab || true"
        executable: /bin/bash
      register: _m_fstab
      changed_when: false
      check_mode: false

    - name: "{{ vol.name }} | assert single canonical UUID + nofail entry"
      ansible.builtin.assert:
        that:
          - _m_fstab.stdout_lines | length == 1
          - _m_fstab.stdout is match('^UUID=[0-9a-fA-F-]+\s')
          - "'nofail' in _m_fstab.stdout"
          - _m_fstab.stdout is not search('/dev/')
        fail_msg: >-
          {{ vol.mount }} must have exactly one UUID-based fstab entry with
          nofail. Found: {{ _m_fstab.stdout | default('') }}
