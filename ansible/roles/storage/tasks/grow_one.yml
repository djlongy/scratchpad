---
# storage/tasks/grow_one.yml — resize one existing volume. `vol` is the
# resolved volume entry. Each step is idempotent and only reports changed
# when it actually enlarged something.

- name: "{{ vol.name }} | select backing device"
  ansible.builtin.set_fact:
    _g_dev: "{{ vol._pv if vol.lvm | bool else vol._part_dev }}"
    _g_has_part: "{{ (not vol.lvm | bool) or (vol.lvm | bool and vol.partition | bool) }}"

- name: "{{ vol.name }} | find parent disk of {{ _g_dev }}"
  become: true  # root: inspects block device
  ansible.builtin.command: "lsblk -ndo PKNAME {{ _g_dev }}"
  register: _g_pk
  changed_when: false
  failed_when: false
  check_mode: false

- name: "{{ vol.name }} | resolve disk to rescan"
  ansible.builtin.set_fact:
    _g_disk_name: "{{ _g_pk.stdout | trim if (_g_pk.stdout | trim | length > 0) else (_g_dev | basename) }}"

- name: "{{ vol.name }} | rescan disk for size change"
  become: true  # root: writes /sys/class/block rescan trigger
  ansible.builtin.shell: "echo 1 > /sys/class/block/{{ _g_disk_name }}/device/rescan"
  changed_when: false
  failed_when: false

- name: "{{ vol.name }} | grow partition {{ vol.partition_number }}"
  become: true  # root: growpart rewrites the partition table
  ansible.builtin.command: "growpart /dev/{{ _g_disk_name }} {{ vol.partition_number }}"
  register: _g_growpart
  changed_when: "'CHANGED' in _g_growpart.stdout"
  failed_when:
    - _g_growpart.rc != 0
    - "'NOCHANGE' not in (_g_growpart.stdout + _g_growpart.stderr)"
  when: _g_has_part | bool

# EVERY PV in the VG, not just vol._pv (which is `| first` of the VG's PV list). pvresize is
# a no-op on a PV that has not grown, so this is safe and idempotent.
#
# SCOPE — read before trusting this on a multi-PV VG. The rescan and growpart above still
# act on ONE disk only (the parent of vol._pv), because vol.partition_number is a single
# per-volume value that cannot be correct for several disks at once. So on a VG spanning
# several disks this claims new capacity only from PVs whose larger size the kernel ALREADY
# sees — a whole-disk PV after a reboot or an external rescan. A partition-backed PV on a
# second disk is still neither rescanned nor grown, and pvresize on it remains a no-op.
# Completing that needs per-PV rescan + per-PV growpart, deriving each PV's parent disk and
# its own partition index from the PV path; no multi-PV VG exists in this estate to test
# against, so it is logged as tech debt rather than written blind. Single-PV VGs — every
# volume the estate actually declares — are fully handled.
#
# Falls back to vol._pv when the PV map has no entry for this VG, which happens when the
# `pvs` probe in discover.yml failed (all its LVM probes are failed_when: false), not on a
# tag-limited run — discover.yml carries the `grow` tag, so --tags grow does run the probe.
- name: "{{ vol.name }} | resize physical volume(s)"
  # pvresize always reports "resized or updated" even on a no-op, so it is
  # not a reliable change signal; actual growth surfaces via lvextend below.
  become: true  # root: LVM pvresize
  ansible.builtin.command: "pvresize {{ item }}"
  register: _g_pvresize
  changed_when: false
  loop: "{{ _g_vg_pvs if (_g_vg_pvs | length > 0) else ([vol._pv] | select | list) }}"
  loop_control:
    label: "{{ item }}"
  vars:
    _g_vg_pvs: >-
      {{ _storage_pv_map | default([])
         | selectattr('vg', 'equalto', vol.vg)
         | map(attribute='pv') | unique | list }}
  when: vol.lvm | bool

# An empty loop makes Ansible skip the task silently, so the one state that produces it —
# no PV map entry for this VG AND an empty vol._pv, i.e. the `pvs` probe came back empty for
# a volume whose VG supposedly exists — would otherwise pass unremarked, leaving growth to
# rely on lvextend alone. Say it out loud. (Before the loop this state ran a bare `pvresize`
# and failed with a usage error; a silent skip is better, but silence is not.)
- name: "{{ vol.name }} | warn that no physical volume could be resolved for resize"
  ansible.builtin.debug:
    msg: >-
      WARNING — no PV resolved for vg '{{ vol.vg }}', so pvresize was skipped entirely.
      discover.yml's `pvs` probe returned nothing for this VG (its LVM probes are
      failed_when: false, so a broken/absent lvm2 is silent). Any capacity added to the
      underlying disk will NOT be visible to LVM and the lvextend below can only claim
      extents that are already free. Check `pvs` and `vgs` on the host.
  when:
    - vol.lvm | bool
    - (_storage_pv_map | default([]) | selectattr('vg', 'equalto', vol.vg) | list | length) == 0
    - (vol._pv | default('') | length) == 0

# LVM resolves percentage sizes differently by suffix, so grow must match:
#   *FREE (100%FREE, 50%FREE) → free-relative, ADD with `-l +<size>`
#   *VG/*PVS (50%VG, 100%VG)  → absolute target with `-l <size>` (grows to it)
#   absolute (40G, 500M)      → absolute target with `-L <size>`
# All only grow (lvextend refuses to shrink → rc 3/5 = no-op).
- name: "{{ vol.name }} | extend logical volume (free-relative +{{ vol.size }})"
  become: true  # root: LVM lvextend
  ansible.builtin.command: "lvextend -l +{{ vol.size }} {{ vol.vg }}/{{ vol.lv }}"
  register: _g_lvextend_free
  changed_when: _g_lvextend_free.rc == 0
  failed_when: _g_lvextend_free.rc not in [0, 3, 5]
  when:
    - vol.lvm | bool
    - "'%' in vol.size"
    - vol.size | upper is search('FREE$')

- name: "{{ vol.name }} | extend logical volume to {{ vol.size }}"
  become: true  # root: LVM lvextend
  ansible.builtin.command: "lvextend -l {{ vol.size }} {{ vol.vg }}/{{ vol.lv }}"
  register: _g_lvextend_vg
  changed_when: _g_lvextend_vg.rc == 0
  failed_when: _g_lvextend_vg.rc not in [0, 3, 5]
  when:
    - vol.lvm | bool
    - "'%' in vol.size"
    - not (vol.size | upper is search('FREE$'))

- name: "{{ vol.name }} | extend logical volume to {{ vol.size }}"
  become: true  # root: LVM lvextend
  ansible.builtin.command: "lvextend -L {{ vol.size }} {{ vol.vg }}/{{ vol.lv }}"
  register: _g_lvextend_abs
  changed_when: _g_lvextend_abs.rc == 0
  failed_when: _g_lvextend_abs.rc not in [0, 3, 5]
  when:
    - vol.lvm | bool
    - "'%' not in vol.size"

# Filesystem grow. Commands come from storage_fs_grow (vars) so a new fstype
# can be added without forking this file. xfs_growfs requires a live mount —
# grow runs before the mount phase, and nofail can leave a volume unmounted
# after boot, so we probe first and SKIP (never hard-fail) when the path is
# not mounted. LV/PV extension above still runs; the next converge after the
# volume is mounted finishes the FS grow (lvextend is then a no-op).
- name: "{{ vol.name }} | check whether {{ vol.mount }} is mounted (xfs grow needs it)"
  ansible.builtin.command:
    argv: [findmnt, --noheadings, --output, SOURCE, --mountpoint, "{{ vol.mount }}"]
  register: _g_mnt
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - vol.fstype == 'xfs'
    - vol.mount | default('') | length > 0
    - vol.fstype in storage_fs_grow

- name: "{{ vol.name }} | skip xfs filesystem grow — {{ vol.mount }} is not mounted"
  ansible.builtin.debug:
    msg: >-
      WARNING — volume '{{ vol.name }}' has an xfs filesystem but {{ vol.mount }}
      is not currently a mount point (findmnt rc={{ _g_mnt.rc | default('n/a') }}).
      LV/PV extension above still ran if needed; xfs_growfs was skipped so this
      play does not abort before the mount phase. Re-run the role after the
      volume is mounted (or rely on the next converge) to finish the FS grow.
  when:
    - vol.fstype == 'xfs'
    - vol.mount | default('') | length > 0
    - vol.fstype in storage_fs_grow
    - (_g_mnt.rc | default(1)) != 0

- name: "{{ vol.name }} | grow {{ vol.fstype }} filesystem"
  become: true  # root: xfs_growfs / resize2fs
  ansible.builtin.command: >-
    {{ storage_fs_grow[vol.fstype]
       | replace('{mount}', vol.mount | default(''))
       | replace('{dev}', vol._dm_dev | default('')) }}
  register: _g_fs
  vars:
    _g_fs_out: "{{ (_g_fs.stdout | default('')) ~ (_g_fs.stderr | default('')) }}"
  changed_when: >-
    (
      vol.fstype in storage_fs_grow_noop_token
      and storage_fs_grow_noop_token[vol.fstype] not in _g_fs_out
    ) or (
      vol.fstype not in storage_fs_grow_noop_token
      and (storage_fs_grow_changed_token[vol.fstype] | default('__never__')) in _g_fs_out
    )
  when:
    - vol.fstype in storage_fs_grow
    # xfs: only when the mount path is live; ext4 (device-based) always
    - vol.fstype != 'xfs' or ((vol.mount | default('') | length > 0) and (_g_mnt.rc | default(1)) == 0)
