---
# storage/tasks/main.yml
#
# A no-tags run is a full idempotent reconcile:
#   resolve -> validate -> packages -> discover -> grow -> provision -> mount -> selinux
#                                                                   -> mount_net
# Refinement tags narrow it (--tags grow / provision / mount / selinux);
# discover runs under every acting tag because those phases consume its facts.
#
# The resolve and validate imports carry the union of every phase tag below, so
# selecting any phase normalises and validates the declaration first — no tag
# selection can act on an unvalidated one — while a tag this role does not own
# selects nothing here. Adding a phase tag means adding it to both imports;
# tests/unit/roles/test_storage_validate.py enforces that.
#
# Volumes are split by `kind` before any phase acts: local volumes drive the
# block stack (discover/grow/provision/mount), network volumes (nfs/cifs)
# bypass it entirely and are only mounted.

- name: Skip storage (storage_enabled is false)
  ansible.builtin.debug:
    msg: "storage_enabled is false — skipping storage"
  when: not (storage_enabled | bool)
  tags: [storage, packages, discover, grow, provision, mount, selinux]

- name: Configure storage
  when: storage_enabled | bool
  block:

    - name: Normalise the declared volume list
      ansible.builtin.import_tasks: resolve.yml
      tags: [storage, packages, discover, grow, provision, mount, selinux]

    - name: Validate the declared volume list
      ansible.builtin.import_tasks: validate.yml
      tags: [storage, packages, discover, grow, provision, mount, selinux]

    # ── Phases ───────────────────────────────────────────────────────────────
    - name: Install prerequisite packages
      ansible.builtin.import_tasks: packages.yml
      when:
        - storage_manage_packages | bool
        - _storage_local_declared or (_storage_net_active | length > 0)
      tags: [storage, packages]

    - name: Discover devices and resolve selectors
      ansible.builtin.import_tasks: discover.yml
      when: _storage_local_declared
      tags: [storage, discover, grow, provision, mount, selinux]

    - name: Grow existing volumes (auto, non-destructive)
      ansible.builtin.import_tasks: grow.yml
      when:
        - storage_grow | bool
        - _storage_local_declared
      tags: [storage, grow]

    - name: Provision new volumes (opt-in, FRESH-guarded)
      ansible.builtin.import_tasks: provision.yml
      when:
        - storage_provision | bool
        - _storage_local_declared
      tags: [storage, provision]

    - name: Mount volumes (UUID + nofail)
      ansible.builtin.import_tasks: mount.yml
      when:
        - storage_manage_fstab | bool
        - _storage_local_declared
      tags: [storage, mount]

    - name: Mount network volumes (_netdev + nofail)
      ansible.builtin.import_tasks: mount_net.yml
      when:
        - storage_manage_fstab | bool
        - _storage_net_active | length > 0
      tags: [storage, mount]

    - name: Apply SELinux file contexts (EL)
      ansible.builtin.import_tasks: selinux.yml
      when:
        - storage_manage_selinux | bool
        - _storage_local_declared
        - ansible_os_family == "RedHat"
        # Skip when SELinux is disabled — managing fcontext there is a no-op the
        # sefcontext module refuses anyway. Runs under enforcing OR permissive.
        - (ansible_selinux.status | default('disabled')) != 'disabled'
      tags: [storage, selinux]
