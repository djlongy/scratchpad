---
role_name_check: 1
dependency:
  name: galaxy
  options:
    ignore-errors: true
driver:
  name: docker
platforms:
  - name: alma9-storage
    image: "geerlingguy/docker-rockylinux9-ansible:latest"
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
    # Image has root:!locked shadow; sudo PAM fails ("cannot retrieve authentication
    # info"). Role tasks use become: true; su works as root→root without PAM shadow.
    ANSIBLE_BECOME_METHOD: su
  inventory:
    host_vars:
      alma9-storage:
        ansible_become_method: su
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
