---
argument_specs:
  main:
    short_description: "Configure firewalld via XML templates and runtime bindings"
    description:
      - "Installs firewalld, renders custom service/zone XML, applies source/interface bindings."
      - "Back-compat: accepts the legacy `firewall_rules` variable in both string and dict shapes."
    options:
      firewalld_enabled:
        description: "Master toggle. Set false to skip the role entirely."
        type: bool
        default: true
      firewalld_service_state:
        description: "systemd state of the firewalld unit."
        type: str
        choices: [started, stopped, restarted]
        default: started
      firewalld_service_enabled:
        description: "Whether firewalld is enabled at boot."
        type: bool
        default: true
      firewalld_default_zone:
        description: "Default zone for unclassified traffic. Empty string = leave unchanged."
        type: str
        default: ""
      firewalld_allow_icmp:
        description: >-
          Keep ICMP (ping) answerable on the default zone even when that zone is
          drop/block, so reachability probes still work without opening any
          TCP/UDP port. False black-holes ICMP on unclassified traffic.
        type: bool
        default: true
      firewalld_reload:
        description: "Reload firewalld after XML changes."
        type: bool
        default: true
      firewalld_allow_no_ssh:
        description: "Permit a drop/block default with no ssh-opening activated zone (out-of-band-managed hosts only; dangerous)."
        type: bool
        default: false
      firewalld_skip_controller_check:
        description: "Skip the pre-flight controller-containment check for a drop/block default."
        type: bool
        default: false
      firewalld_strict_interface_audit:
        description: "Treat interface-audit warnings (NM-owned binds, unset NM zone) as hard failures."
        type: bool
        default: false
      firewalld_lockout_guard:
        description: "Arm a transient systemd revert timer around the reload + restrictive default-zone switch."
        type: bool
        default: true
      firewalld_lockout_guard_seconds:
        description: "Seconds the revert timer waits before restoring the pre-change default zone."
        type: int
        default: 180
      firewalld_lockout_guard_snapshot:
        description: >-
          Path the revert guard writes its tar.gz of the pre-change permanent
          firewalld config (/etc/firewalld) to, and restores from if the timer
          fires. Deliberately under /run so a reboot discards it — a host that
          has rebooted is already past the risky window. This archive is what
          lets the guard recover a host whose default zone was drop/block
          before the run.
        type: str
        default: /run/firewalld-lockout-guard.tar.gz
      firewall_rules:
        description: >-
          LEGACY, unprefixed, back-compat only — kept so historical inventory
          still parses; new code declares ports on a zone via firewalld_zones
          and binds sources via firewalld_source_zone_bindings. Accepts
          "PORT/PROTO/COMMENT" strings or {port, protocol, service} dicts and
          opens each port in firewalld_default_zone (falling back to "public"
          when that is unset); the service/comment field is only a loop label
          and is discarded. REFUSED — the role fails the play — when the
          effective default zone is drop or block, because the default zone is
          where every unclassified interface lands, and a built-in zone is
          never re-templated, verified, or cleaned up by this role.
        type: list
        elements: raw
        default: []
      firewalld_packages:
        description: "Packages to install."
        type: list
        elements: str
        default: [firewalld]
      firewalld_services:
        description: "Custom service definitions. See defaults/main.yml for schema."
        type: list
        elements: dict
        default: []
      firewalld_services_remove:
        description: "Service short names to delete from /etc/firewalld/services/."
        type: list
        elements: str
        default: []
      firewalld_zones:
        description: "Custom zone definitions. See defaults/main.yml for schema."
        type: list
        elements: dict
        default: []
      firewalld_zones_remove:
        description: "Zone short names to delete from /etc/firewalld/zones/."
        type: list
        elements: str
        default: []
      firewalld_source_zone_bindings:
        description: "Source-CIDR -> zone bindings (L3 segregation pattern)."
        type: list
        elements: dict
        default: []
        options:
          zone:
            type: str
            required: true
            description: Zone the matching traffic is classified into.
          source:
            type: str
            required: true
            description: Source CIDR or address bound to that zone.
      firewalld_interface_zone_bindings:
        description: "Interface -> zone bindings (L2 segregation; use sparingly)."
        type: list
        elements: dict
        default: []
        options:
          zone:
            type: str
            required: true
            description: Zone the interface's traffic is classified into.
          interface:
            type: str
            required: true
            description: Kernel interface name bound to that zone.
