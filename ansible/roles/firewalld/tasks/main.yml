---
# firewalld — permanent XML is the single source of truth.
#
# Critical invariant: zone XML must include sources/interfaces from
# firewalld_*_zone_bindings at template time. Runtime-only permanent binds
# are rewritten into the same zone files; re-templating without those
# elements + reload wipes them and, with default=drop, locks out SSH.
#
# Order:
#   1. validate inventory contract (exclusive CIDRs, drop+ssh safety)
#   2. install firewalld and start the service
#   3. audit interface→zone classification (read-only, before any write)
#   4. ARM the revert guard (snapshots /etc/firewalld) — before the first write
#   5. service XML + zone XML (atomic sources/ifaces), prune orphans
#   6. reload (handlers) — permanent state already complete
#   7. reconcile runtime bindings (idempotent; belt-and-suspenders)
#   8. RE-ARM the guard so the switch gets a full timer budget
#   9. set default zone LAST (drop only after sources exist)
#  10. prove a fresh SSH connection, then disarm
#  11. verify permanent state matches inventory
#
# Runtime phases are gated on `firewalld_daemon_expected_up` (vars/main.yml):
# firewalld_service_state=stopped is a documented config-only mode where the
# permanent XML still renders but nothing talks to the stopped daemon.

- name: Skip firewalld (firewalld_enabled is false)
  ansible.builtin.debug:
    msg: "firewalld_enabled is false — skipping firewalld"
  when: not (firewalld_enabled | bool)
  tags: [always]

- name: Configure firewalld
  when: firewalld_enabled | bool
  block:

    # Self-heal network facts so `{{ primary_interface }}` (and any other
    # ansible_default_ipv4 / interface fact this role reads) resolves even under
    # a `gather_facts: false` play or a tag-isolated `--tags firewalld` run.
    - name: Ensure network facts are present (gather_facts:false / tag-isolated runs)
      ansible.builtin.setup:
        gather_subset: ['!all', '!min', 'network']
      when: ansible_default_ipv4 is not defined
      tags: [always]

    # [always]: the contract must run even under partial tag selections (e.g.
    # --tags zones,reload or --tags cleanup) that re-template zone XML or delete
    # zones — otherwise inventory drift could wipe an SSH source with no gate in
    # the way. Mostly inventory logic, but NOT host-contact-free: it also probes
    # the live default zone (root, via firewall-cmd) so the lockout gates cannot
    # be fooled by a host already running drop while inventory leaves the default
    # unset. The probe tolerates firewalld being absent, so it stays safe pre-install.
    # It also publishes _firewalld_guard_expected, which default_zone.yml uses to
    # fail closed when a tag selection drops the guard.
    #
    # import_tasks, NOT include_tasks — this is what makes the [always] above
    # real. Tags on a DYNAMIC include apply to the include statement only: the
    # include expands and then every untagged task inside it is filtered out. So
    # under `--tags default_zone` this contract expanded and ran NOTHING, while
    # the directly-tagged ICMP task further down still modified the firewall.
    # A static import propagates `always` to every child (verified on
    # ansible-core 2.18), so the contract really does survive tag selection.
    - name: Validate firewalld inventory contract
      ansible.builtin.import_tasks: validate.yml
      tags: [always]

    # include_tasks is dynamic: tags on the include only select the include
    # statement. Under `--tags firewalld` the children would otherwise be
    # filtered out (untagged), so zone XML never re-templates and source
    # bindings never reconcile. `apply.tags` stamps every child so a
    # tag-isolated run actually writes permanent state. import_tasks (validate)
    # already propagates tags — includes need apply.
    - name: Install firewalld and start the service
      ansible.builtin.include_tasks:
        file: install.yml
        apply:
          tags: [install, firewalld]
      tags: [install, firewalld]

    # Audit interface→zone classification (NICs in the default zone, NM-owned
    # binds, zone drifting) BEFORE anything is written, so a silent lockout path
    # fails while permanent state is still the operator's own. Needs a live
    # daemon: with firewalld stopped every --get-zone-of-interface fails, every
    # NIC looks unbound, and the lockout gate would fire on nothing.
    - name: Audit interface-to-zone bindings
      ansible.builtin.include_tasks:
        file: interface_audit.yml
        apply:
          tags: [interface_audit, firewalld]
      when: firewalld_daemon_expected_up | bool
      tags: [interface_audit, firewalld]

    # ── Risky window opens here ──────────────────────────────────────────────
    # Arm the revert guard before the FIRST permanent write, not merely before
    # the reload: the snapshot is what the revert extracts, so it has to capture
    # zone XML as it was BEFORE this run re-templates it. Arming after the XML
    # phases would snapshot the new state and the revert would restore the very
    # change it exists to undo. This also covers the case the default-zone
    # rollback cannot: a host whose default was ALREADY drop/block.
    #
    # The tag list is shared by anchor with the re-arm and the disarm below.
    # Arming under a tag set that does not also disarm would leave a live timer
    # to revert a good change minutes later — `--skip-tags guard` must take out
    # all three or none. One list, three sites. apply.tags stamps include children.
    - name: Arm the lockout revert guard (covers every permanent write)
      ansible.builtin.include_tasks:
        file: guard_arm.yml
        apply:
          tags: &fw_guard_tags [guard, firewalld]
      when: firewalld_daemon_expected_up | bool
      tags: *fw_guard_tags

    - name: Render custom service XML definitions
      ansible.builtin.include_tasks:
        file: services.yml
        apply:
          tags: [services, firewalld]
      tags: [services, firewalld]

    - name: Render custom zone XML definitions (sources/interfaces inlined)
      ansible.builtin.include_tasks:
        file: zones.yml
        apply:
          tags: [zones, firewalld]
      tags: [zones, firewalld]

    - name: Remove orphaned service/zone XML definitions
      ansible.builtin.include_tasks:
        file: cleanup.yml
        apply:
          tags: [cleanup, firewalld]
      when:
        - firewalld_services_remove | length > 0
          or firewalld_zones_remove | length > 0
      tags: [cleanup, firewalld]

    # Flush here: zone XML already contains sources/interfaces, so reload
    # cannot drop the SSH path for default=drop hosts.
    - name: Reload firewalld before runtime reconcile and default-zone switch
      ansible.builtin.meta: flush_handlers
      tags: [reload, firewalld]

    # Reconcile via the firewalld module. No-op when XML already has the
    # elements; repairs drift if someone hand-edited permanent state.
    # Still runs AFTER reload so zones exist as named objects.
    - name: Reconcile source CIDRs to zones (L3)
      ansible.builtin.include_tasks:
        file: bindings_sources.yml
        apply:
          tags: [bindings, firewalld]
      when:
        - firewalld_daemon_expected_up | bool
        - firewalld_source_zone_bindings | length > 0
      tags: [bindings, firewalld]

    - name: Reconcile interfaces to zones (L2 — use sparingly)
      ansible.builtin.include_tasks:
        file: bindings_interfaces.yml
        apply:
          tags: [bindings, firewalld]
      when:
        - firewalld_daemon_expected_up | bool
        - firewalld_interface_zone_bindings | length > 0
      tags: [bindings, firewalld]

    # Reload + reconnect after the runtime binding reconcile. Included (not inlined)
    # because it ends in meta: reset_connection, which cannot carry a `when:` — see
    # bindings_reload.yml for why the reconnect is needed at all.
    - name: Reload firewalld after runtime binding reconcile
      ansible.builtin.include_tasks:
        file: bindings_reload.yml
        apply:
          tags: [bindings, reload, firewalld]
      when:
        - firewalld_daemon_expected_up | bool
        - firewalld_reload | bool
        - (firewalld_source_zone_bindings | length > 0) or (firewalld_interface_zone_bindings | length > 0)
      tags: [bindings, reload, firewalld]

    # Re-arm immediately BEFORE the switch so a long reload/reconcile cannot burn
    # the whole timer window and leave the switch unguarded. The snapshot and the
    # captured pre-change default are NOT retaken — guard_arm.yml keeps the ones
    # from the first arm, or the revert would restore post-reload state, i.e. the
    # very change the guard exists to undo.
    - name: Re-arm the lockout revert guard (full budget for the switch)
      ansible.builtin.include_tasks:
        file: guard_arm.yml
        apply:
          tags: *fw_guard_tags
      when: firewalld_daemon_expected_up | bool
      tags: *fw_guard_tags

    # Default zone LAST. Switching to drop parks the primary NIC in drop;
    # safe only once source-activated zones are permanent AND the revert guard
    # is proven pending (asserted inside default_zone.yml).
    - name: Set the default zone
      ansible.builtin.include_tasks:
        file: default_zone.yml
        apply:
          tags: [default_zone, firewalld]
      when:
        - firewalld_daemon_expected_up | bool
        - firewalld_default_zone | length > 0
      tags: [default_zone, firewalld]

    # When no default zone is managed, ICMP must target the firewall's ACTUAL
    # current default (queried), not a hardcoded 'public' that may not be it.
    - name: Query the effective default zone for ICMP (no managed default)
      become: true  # root: firewall-cmd talks to firewalld over privileged D-Bus
      ansible.builtin.command: firewall-cmd --get-default-zone
      register: _firewalld_effective_default
      changed_when: false
      check_mode: false
      when:
        - firewalld_daemon_expected_up | bool
        - firewalld_allow_icmp | bool
        - firewalld_default_zone | length == 0
      tags: [default_zone, icmp, firewalld]

    # Ping on the default zone (including drop) for reachability probes.
    # Source-bound service zones should also list icmp in protocols.
    - name: Allow ICMP (ping) on the default zone
      become: true  # root: firewalld
      ansible.posix.firewalld:
        zone: "{{ firewalld_default_zone if (firewalld_default_zone | length) > 0 else (_firewalld_effective_default.stdout | trim) }}"
        protocol: icmp
        permanent: true
        immediate: true
        state: enabled
      when:
        - firewalld_daemon_expected_up | bool
        - firewalld_allow_icmp | bool
      tags: [default_zone, icmp, firewalld]

    # Prove a FRESH SSH connection survives the new default, THEN disarm the
    # revert timer. Included only when the guard was armed — meta:reset_connection
    # inside cannot itself be gated by 'when'. Shares the arm's tag list so no tag
    # selection can arm without disarming.
    - name: Disarm the lockout revert guard (after fresh-connection proof)
      ansible.builtin.include_tasks:
        file: guard_disarm.yml
        apply:
          tags: *fw_guard_tags
      when: _firewalld_guard_active | default(false) | bool
      tags: *fw_guard_tags

    - name: Verify permanent firewalld state matches inventory
      ansible.builtin.include_tasks:
        file: verify.yml
        apply:
          tags: [verify, firewalld]
      when: firewalld_daemon_expected_up | bool
      tags: [verify, firewalld]
