---
# Pre-flight contract checks. Fail BEFORE rewriting permanent zone XML so a
# bad inventory never lands a half-applied drop-default ruleset. Runnable
# standalone via tasks_from, so every fact it consumes is computed here,
# not upstream.

# FIRST, before anything reads these. Each is documented as a list, and each is
# routinely supplied through Jinja from another var — an inventory group may
# build firewalld_source_zone_bindings as an expression — so a typo that renders
# a STRING is a live possibility, not a hypothetical.
#
# It has to be checked HERE, on the raw inventory value. Everything downstream
# consumes these through builders whose results go through set_fact, and set_fact
# hands back a real list whatever went in: with firewalld_zones set to the string
# "not-a-list", the _firewalld_ssh_zones builder iterates its CHARACTERS, finds no
# services on any of them, and yields []. A type check placed after that point
# cannot fail — it inspects the coerced result, never the input. Worse, the empty
# result silently means "no zone opens ssh", which is a claim about the firewall
# rather than a report about the inventory.
- name: Assert the firewalld list contracts are lists
  vars:
    _fw_list_vars:
      firewalld_zones: "{{ firewalld_zones }}"
      firewalld_zones_remove: "{{ firewalld_zones_remove }}"
      firewalld_services: "{{ firewalld_services }}"
      firewalld_services_remove: "{{ firewalld_services_remove }}"
      firewalld_source_zone_bindings: "{{ firewalld_source_zone_bindings }}"
      firewalld_interface_zone_bindings: "{{ firewalld_interface_zone_bindings }}"
  ansible.builtin.assert:
    that:
      - item.value is not string
      - item.value is not mapping
      - item.value is sequence
    fail_msg: >-
      {{ item.key }} must be a list, but it is a
      {{ item.value | type_debug }} ({{ item.value }}). Every consumer of this
      variable iterates it, so a string is silently walked one CHARACTER at a time
      and the run then reports on a contract nobody wrote. Check the inventory
      value — most often a Jinja expression that rendered a scalar.
    quiet: true
  loop: "{{ _fw_list_vars | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Validate firewalld_source_zone_bindings schema
  ansible.builtin.assert:
    that:
      - item.zone is defined
      - item.zone | length > 0
      - item.source is defined
      - item.source | length > 0
    fail_msg: >-
      Each firewalld_source_zone_bindings entry needs zone+source.
      Offending entry: {{ item }}
    quiet: true
  loop: "{{ firewalld_source_zone_bindings }}"
  loop_control:
    label: "{{ item.source | default('?') }} -> {{ item.zone | default('?') }}"

- name: Validate firewalld_interface_zone_bindings schema
  ansible.builtin.assert:
    that:
      - item.zone is defined
      - item.zone | length > 0
      - item.interface is defined
      - item.interface | length > 0
    fail_msg: >-
      Each firewalld_interface_zone_bindings entry needs zone+interface.
      Offending entry: {{ item }}
    quiet: true
  loop: "{{ firewalld_interface_zone_bindings }}"
  loop_control:
    label: "{{ item.interface | default('?') }} -> {{ item.zone | default('?') }}"

# firewalld source→zone is exclusive: one CIDR can only belong to one zone.
# Binding the same CIDR twice (e.g. mgt.subnet → mgmt AND → lgtm) produces
# undefined permanent state and is the classic dual-bind lockout.
#
# A CIDR reaches a zone by TWO routes and this check must cover both, because
# templates/zone.xml.j2 merges them into one <source> list per zone:
#   1. firewalld_source_zone_bindings  (zone + source pairs)
#   2. firewalld_zones[].sources       (inline on the zone dict)
# Inspecting only route 1 let "inline on zone A + bound to zone B" pass
# validation and be written into both zone files — precisely the dual-bind this
# assert exists to stop. Flattening both into one (source, zone) list first is
# what keeps the two routes in lockstep.
- name: Build the full source→zone map (bindings plus inline zone sources)
  ansible.builtin.set_fact:
    _firewalld_source_zone_pairs: >-
      {% set out = [] %}
      {%- for b in firewalld_source_zone_bindings | default([]) -%}
      {%- set _ = out.append({'source': b.source, 'zone': b.zone, 'via': 'firewalld_source_zone_bindings'}) -%}
      {%- endfor -%}
      {%- for z in firewalld_zones | default([]) -%}
      {%- for s in (z.sources | default([], true)) -%}
      {%- set _ = out.append({'source': s, 'zone': z.name, 'via': 'firewalld_zones[' ~ z.name ~ '].sources'}) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ out }}

- name: Assert each source CIDR binds to exactly one zone
  vars:
    _zones_for_source: >-
      {{ _firewalld_source_zone_pairs
         | selectattr('source', 'equalto', item)
         | map(attribute='zone')
         | list
         | unique }}
    _routes_for_source: >-
      {{ _firewalld_source_zone_pairs
         | selectattr('source', 'equalto', item)
         | map(attribute='via')
         | list
         | unique }}
  ansible.builtin.assert:
    that:
      - _zones_for_source | length == 1
    fail_msg: >-
      Source CIDR {{ item }} is bound to multiple zones: {{ _zones_for_source }}
      (declared via {{ _routes_for_source }}). firewalld allows a source in only
      ONE zone, and this role writes both routes into the same zone XML. Put host
      services needed by that CIDR on that single zone (e.g. mgt.subnet → mgmt
      with ssh+apps; peers → service zone without ssh).
  loop: "{{ _firewalld_source_zone_pairs | map(attribute='source') | list | unique }}"
  loop_control:
    label: "{{ item }}"

# rich_rules cannot be rendered into zone XML from rich-LANGUAGE strings (zone XML wants
# structured <rule> children — see the note in templates/zone.xml.j2). Emitting them as
# text content produces a zone file firewalld cannot parse; that zone then
# fails to load and, under a drop default, strands SSH. Fail here instead — a loud stop
# before anything is written beats an unloadable zone discovered at the next reload.
- name: Reject rich_rules — not renderable into zone XML
  ansible.builtin.assert:
    # default([], true) — a bare `rich_rules:` key is YAML null, and plain default()
    # replaces only UNDEFINED, so `| length` on None raises a NoneType error and the
    # operator loses this whole message.
    that: (item.rich_rules | default([], true)) | length == 0
    fail_msg: >-
      Zone '{{ item.name }}' declares rich_rules, which this role cannot render into
      permanent zone XML: zone XML represents a rich rule as structured <rule> child
      elements, not as a rich-language string. Express the intent with this zone's
      `services:` / `ports:` / `protocols:` / `source_ports:` plus a source binding
      (firewalld_source_zone_bindings) — a source-bound zone is how this role scopes
      access by CIDR. If a rule genuinely has no equivalent, apply it out of band with
      ansible.posix.firewalld (rich_rule:, permanent: true) from a separate task AND
      exclude this zone from firewalld_zones, since re-templating would wipe it.
    quiet: true
  loop: "{{ firewalld_zones }}"
  loop_control:
    label: "{{ item.name | default('?') }}"

# ── Shared safety facts (consumed by the checks below and by later phases) ───

# LIVE default zone. The lockout gates below must not key off the INVENTORY default
# alone, which would silently disarm them in a real and dangerous case: a host already
# running default=drop while firewalld_default_zone is "" (the default — "leave the
# default zone unchanged"). The run would then re-template zone XML and reload with
# NO ssh-path assert and NO controller-containment assert, because inventory said
# "not locked down" while the firewall said otherwise.
#
# Tolerates firewalld being absent: this file runs (tags: always) BEFORE install.yml,
# so on a fresh host firewall-cmd may not exist. rc != 0 → treated as no live
# lockdown, which is correct — an uninstalled/stopped firewalld is dropping nothing.
#
# HONEST LIMIT: failed_when: false cannot distinguish "firewalld absent, safe to ignore"
# from "probe failed for another reason (become denied, D-Bus timeout) and the live state is
# UNKNOWN". Both land on rc != 0 → no live lockdown → the gates fall back to inventory-only,
# which is exactly the pre-fix blind spot on a host that may already be running drop. The
# probe narrows that window; it does not close it. The task below names the unknown case out
# loud so it is not silent, and check_mode: false keeps --check from manufacturing it.
- name: Query the live default zone (may not exist yet — pre-install)
  become: true  # root: firewall-cmd talks to firewalld over privileged D-Bus
  ansible.builtin.command: firewall-cmd --get-default-zone
  register: _firewalld_live_default_running
  changed_when: false
  failed_when: false
  check_mode: false

# firewall-cmd needs the RUNNING daemon, so an installed-but-STOPPED firewalld whose PERMANENT
# config already carries default=drop reads as "no live lockdown" — the gates stay disarmed,
# and install.yml then STARTS the service, making drop live moments after the gate that should
# have vetted it. firewall-offline-cmd reads the permanent config directly and needs no daemon,
# which is exactly the state to inspect here. Also keeps the warning below from firing on this
# benign case.
- name: Query the permanent default zone when the daemon is not answering
  become: true  # root: firewall-offline-cmd reads /etc/firewalld directly
  ansible.builtin.command: firewall-offline-cmd --get-default-zone
  register: _firewalld_offline_default
  changed_when: false
  failed_when: false
  check_mode: false
  when: (_firewalld_live_default_running.rc | default(1)) != 0

# One fact for everything downstream: the running answer if the daemon replied, else the
# permanent one. Whichever it came from, a non-zero rc here means "could not determine".
- name: Resolve the effective pre-change default zone
  ansible.builtin.set_fact:
    _firewalld_live_default: >-
      {{ _firewalld_live_default_running
         if ((_firewalld_live_default_running.rc | default(1)) == 0)
         else (_firewalld_offline_default | default({'rc': 1, 'stdout': ''})) }}

# A missing binary is expected pre-install and silent. Anything else means the live default
# could not be read, so a host already at drop/block would keep the lockout gates disarmed —
# say so, because the operator is the only one who can tell which case this is.
- name: Warn that the live default zone could not be determined
  ansible.builtin.debug:
    msg: >-
      WARNING — could not read the default zone by EITHER route: the daemon
      (firewall-cmd, rc={{ _firewalld_live_default_running.rc | default('n/a') }}) nor the
      permanent config (firewall-offline-cmd,
      rc={{ _firewalld_offline_default.rc | default('n/a') }}:
      {{ (_firewalld_offline_default.stderr | default('') | trim)
         | default(_firewalld_offline_default.msg | default('no detail'), true) }}).
      This is NOT the expected "firewalld not installed yet" case. The lockout gates below
      therefore fall back to the INVENTORY default only — if this host is already set to
      default=drop/block, they are disarmed for this run and a bad zone/binding could strand
      SSH. Confirm by hand (firewall-cmd --get-default-zone, or firewall-offline-cmd
      --get-default-zone if the service is stopped) before trusting a green run.
  when:
    - (_firewalld_live_default.rc | default(0)) != 0
    - >-
      'No such file or directory' not in (_firewalld_offline_default.msg | default(''))
      and 'command not found' not in (_firewalld_offline_default.stderr | default(''))

- name: Compute firewalld safety facts (inventory + live)
  ansible.builtin.set_fact:
    # A restrictive default silently drops everything unclassified — the state
    # every lockout guard in this role keys off. True when the default is restrictive
    # EITHER because inventory is about to set it, OR because the firewall is already
    # running it. guard_arm.yml already reasons from the live value; this brings the
    # pre-flight asserts in line with it.
    _firewalld_lockdown: >-
      {{ (firewalld_default_zone in ['drop', 'block'])
         or (((_firewalld_live_default.rc | default(1)) == 0)
             and ((_firewalld_live_default.stdout | default('') | trim) in ['drop', 'block'])) }}
    # firewalld ships these zones without a firewalld_zones entry; a binding may
    # legitimately target them.
    _firewalld_builtin_zones:
      - block
      - dmz
      - drop
      - external
      - home
      - internal
      - nm-shared
      - public
      - trusted
      - work
    # This controller's client IP (first field of SSH_CONNECTION). Empty when
    # the play runs locally or facts carry no SSH_CONNECTION — the controller
    # containment check then skips cleanly.
    _firewalld_controller_ip: >-
      {{ ((ansible_env | default({})).get('SSH_CONNECTION', '') | string).split()[0]
         if (((ansible_env | default({})).get('SSH_CONNECTION', '') | string) | length > 0)
         else '' }}
    # Zones that open ssh — custom zone with service 'ssh', a tcp/22 port, or a
    # rich rule allowing ssh; PLUS a bound built-in that ships ssh by default
    # (internal, home). A built-in only counts when a binding targets it.
    _firewalld_ssh_zones: >-
      {% set ns = namespace(z=[]) %}
      {%- set bound = (firewalld_source_zone_bindings | map(attribute='zone') | list) + (firewalld_interface_zone_bindings | map(attribute='zone') | list) -%}
      {%- for z in firewalld_zones -%}
      {%- set svc = z.services | default([]) -%}
      {%- set p22 = (z.ports | default([]) | selectattr('protocol', 'defined') | selectattr('protocol', 'equalto', 'tcp') | map(attribute='port') | map('string') | select('equalto', '22') | list | length) > 0 -%}
      {%- set rr = z.rich_rules | default([]) -%}
      {%- set rr_ssh = ((rr | select('search', 'service name="ssh"') | list | length) > 0) or ((rr | select('search', 'port="22"') | select('search', 'protocol="tcp"') | list | length) > 0) -%}
      {%- if ('ssh' in svc) or p22 or rr_ssh -%}{%- set ns.z = ns.z + [z.name] -%}{%- endif -%}
      {%- endfor -%}
      {%- set builtins = ['internal', 'home'] | select('in', bound) | list -%}
      {{ (ns.z + builtins) | unique | list }}
    # Zones with any activation path (source bind, interface bind, or inline
    # sources/interfaces in the zone dict). Empty lists do NOT count — a zone
    # with sources: [] / interfaces: [] (or sources: "{{ admin_cidrs }}" that
    # rendered empty) has zero classifying traffic and must not pass the
    # drop/block ssh-path gate as "activated".
    _firewalld_activated_zones: >-
      {{ (
           (firewalld_source_zone_bindings | map(attribute='zone') | list)
           + (firewalld_interface_zone_bindings | map(attribute='zone') | list)
           + (firewalld_zones
              | selectattr('sources', 'defined')
              | selectattr('sources')
              | map(attribute='name') | list)
           + (firewalld_zones
              | selectattr('interfaces', 'defined')
              | selectattr('interfaces')
              | map(attribute='name') | list)
         ) | unique | list }}

- name: Compute firewalld ssh-path facts (depend on the sets above)
  ansible.builtin.set_fact:
    # ssh-opening zones that actually have an activation — the proven admin path.
    _firewalld_ssh_activated_zones: >-
      {{ _firewalld_ssh_zones | select('in', _firewalld_activated_zones) | list }}
    # Source CIDRs whose zone opens ssh (bindings + inline zone sources).
    _firewalld_ssh_source_cidrs: >-
      {{ (
           (firewalld_source_zone_bindings | selectattr('zone', 'in', _firewalld_ssh_zones) | map(attribute='source') | list)
           + (firewalld_zones | selectattr('name', 'in', _firewalld_ssh_zones) | selectattr('sources', 'defined') | map(attribute='sources') | flatten | list)
         ) | unique | list }}
    # True when an ssh-opening zone is interface-activated — source containment
    # is then inapplicable and the controller check skips.
    _firewalld_ssh_zone_iface_activated: >-
      {{ (
           (firewalld_interface_zone_bindings | selectattr('zone', 'in', _firewalld_ssh_zones) | list)
           + (firewalld_zones | selectattr('name', 'in', _firewalld_ssh_zones) | selectattr('interfaces', 'defined') | map(attribute='interfaces') | flatten | list)
         ) | length > 0 }}

- name: Compute controller containment fact
  ansible.builtin.set_fact:
    # True when this controller's IP falls inside a source CIDR bound to an
    # ssh-opening zone — i.e. the operator's return path survives default=drop.
    _firewalld_controller_source_covered: >-
      {{ (_firewalld_controller_ip | length > 0)
         and (_firewalld_ssh_source_cidrs | length > 0)
         and (_firewalld_controller_ip is ansible.utils.in_any_network(_firewalld_ssh_source_cidrs)) }}

# The revert timer must leave headroom for the post-switch connection probe
# (wait_for_connection timeout = seconds-60), or the probe races its own revert.
- name: Assert the lockout-guard delay leaves room for the connection probe
  when: firewalld_lockout_guard | bool
  ansible.builtin.assert:
    that:
      - (firewalld_lockout_guard_seconds | int) >= 120
    fail_msg: >-
      firewalld_lockout_guard_seconds ({{ firewalld_lockout_guard_seconds }}) is
      below 120. The post-switch fresh-connection probe needs comfortable
      headroom under the revert timer, or the probe races its own revert. Use a
      value >= 120, or disable the guard with firewalld_lockout_guard=false.

# A bind to an undefined, non-built-in zone silently lands nowhere, leaving the
# CIDR it was meant to classify exposed to the default zone.
- name: Assert every binding zone exists in firewalld_zones or is a built-in
  vars:
    _known_zones: >-
      {{ (firewalld_zones | map(attribute='name') | list) + _firewalld_builtin_zones }}
  ansible.builtin.assert:
    that:
      - item in _known_zones
    fail_msg: >-
      Binding references zone '{{ item }}' which is neither defined in
      firewalld_zones nor a firewalld built-in
      ({{ _firewalld_builtin_zones | join(', ') }}). Define the zone or fix the
      binding.
  loop: >-
    {{ ((firewalld_source_zone_bindings | map(attribute='zone') | list)
        + (firewalld_interface_zone_bindings | map(attribute='zone') | list)) | unique }}
  loop_control:
    label: "{{ item }}"

# firewalld_zones_remove must not collide with active config.
- name: Assert no zone is both defined and removed
  vars:
    _both: >-
      {{ (firewalld_zones | map(attribute='name') | list) | intersect(firewalld_zones_remove) }}
  ansible.builtin.assert:
    that:
      - _both | length == 0
    fail_msg: >-
      Zone(s) {{ _both }} appear in both firewalld_zones and
      firewalld_zones_remove. A zone cannot be created and removed in one run.

- name: Assert firewalld_zones_remove does not target a bound or default zone
  vars:
    _protected: >-
      {{ ((firewalld_source_zone_bindings | map(attribute='zone') | list)
          + (firewalld_interface_zone_bindings | map(attribute='zone') | list)
          + ([firewalld_default_zone] if firewalld_default_zone | length > 0 else [])) | unique }}
    _bad_removes: >-
      {{ firewalld_zones_remove | select('in', _protected) | list }}
  ansible.builtin.assert:
    that:
      - _bad_removes | length == 0
    fail_msg: >-
      firewalld_zones_remove targets zone(s) {{ _bad_removes }} that are still
      referenced by a binding or are the default zone. Removing them strands the
      binding or the default. Drop the reference first.

# A restrictive default must keep a usable SSH path. Fail when default is
# drop/block and no zone both opens ssh AND is activated — including the
# guaranteed-lockout case where nothing opens ssh at all.
- name: Assert a drop/block default keeps an activated ssh path
  when:
    - _firewalld_lockdown | bool
    - not (firewalld_allow_no_ssh | bool)
  ansible.builtin.assert:
    that:
      - _firewalld_ssh_activated_zones | length > 0
    fail_msg: >-
      The effective default zone is restrictive
      ({% if firewalld_default_zone in ['drop', 'block'] %}firewalld_default_zone
      is '{{ firewalld_default_zone }}'{% elif (_firewalld_live_default_running.rc | default(1)) == 0
      %}firewalld_default_zone is unset, but this host is ALREADY RUNNING default
      '{{ _firewalld_live_default.stdout | default('') | trim }}'{% else %}firewalld_default_zone
      is unset, but this host's PERMANENT config already sets default
      '{{ _firewalld_live_default.stdout | default('') | trim }}' and firewalld is not
      running — starting or reloading it makes that live{% endif %}) but no zone
      both opens ssh (service ssh or tcp/22) AND has an activation (source binding,
      interface binding, or inline sources/interfaces). This locks out SSH after
      reload. Bind an admin CIDR to an ssh-opening zone via
      firewalld_source_zone_bindings, or set firewalld_allow_no_ssh=true only for
      a genuinely SSH-less host administered out-of-band (dangerous).

# This controller must be inside an ssh source CIDR. Skips when the connection
# is local/non-SSH (no controller IP) or an ssh zone is interface-activated
# (source containment does not apply).
- name: Assert this controller's IP is covered by an ssh source CIDR
  when:
    - _firewalld_lockdown | bool
    - not (firewalld_skip_controller_check | bool)
    - _firewalld_controller_ip | length > 0
    - not (_firewalld_ssh_zone_iface_activated | bool)
  ansible.builtin.assert:
    that:
      - _firewalld_controller_source_covered | bool
    fail_msg: >-
      Controller client IP {{ _firewalld_controller_ip }} is not inside any
      source CIDR bound to an ssh-opening zone ({{ _firewalld_ssh_source_cidrs }}).
      The restrictive default
      '{{ firewalld_default_zone if (firewalld_default_zone in ['drop', 'block'])
      else (_firewalld_live_default.stdout | default('') | trim) }}'
      would drop THIS session's return path
      {%- if firewalld_default_zone not in ['drop', 'block'] %} (firewalld_default_zone is
      unset, so this default comes from the host itself —
      {% if (_firewalld_live_default_running.rc | default(1)) == 0 %}it is already live, and the
      reload alone is enough to strand you{% else %}it is in the permanent config with firewalld
      stopped, so starting or reloading the service is enough to strand you{% endif %}){%- endif %}.
      Add {{ _firewalld_controller_ip }}'s network to an ssh zone
      binding, or set firewalld_skip_controller_check=true if you administer via
      a path this check cannot see.

# Whether a lockout guard SHOULD exist for this run, computed here because this
# file is tags:[always] and therefore survives every tag selection.
#
# This is what lets default_zone.yml tell two very different situations apart:
#   - guard legitimately OFF (firewalld_lockout_guard=false, deferred reload,
#     check mode, config-only mode) → proceeding unguarded is the operator's
#     explicit choice;
#   - guard SKIPPED because a tag selection dropped guard_arm.yml → the switch
#     would silently proceed with no revert timer and no fresh-connection proof.
# Without this fact the second case is indistinguishable from the first, because
# every consumer of _firewalld_guard_active reads it as `| default(false)`.
- name: Determine whether a lockout guard is expected for this run
  ansible.builtin.set_fact:
    _firewalld_guard_expected: >-
      {{ (firewalld_lockout_guard | bool)
         and (firewalld_reload | bool)
         and (firewalld_daemon_expected_up | bool)
         and (not ansible_check_mode)
         and (
               (firewalld_default_zone in ['drop', 'block'])
               or (_firewalld_lockdown | bool)
             ) }}
