---
# Zone XML is permanent SoT. Template merges firewalld_source_zone_bindings
# and firewalld_interface_zone_bindings into each zone so a later reload
# cannot wipe runtime-only permanent binds (SSH lockout under default=drop).

- name: Validate firewalld_zones entries
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name | length > 0
    fail_msg: "Each firewalld_zones entry requires a 'name' field. Offending entry: {{ item }}"
    quiet: true
  loop: "{{ firewalld_zones }}"
  loop_control:
    label: "{{ item.name | default('(missing name)') }}"

- name: Render firewalld zone XML files (atomic sources + interfaces)
  become: true  # root: writes /etc/firewalld/zones/
  ansible.builtin.template:
    src: zone.xml.j2
    dest: "/etc/firewalld/zones/{{ item.name }}.xml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ firewalld_zones }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload firewalld
