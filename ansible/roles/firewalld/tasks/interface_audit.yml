---
# Interface-binding audit. Runs before the risky window (reload + default-zone
# switch) so a NIC silently parked in the default zone, or an NM-owned binding
# that will not survive an NM restart, is surfaced before drop takes effect.
# Read-only: every command is changed_when:false + check_mode:false.

# Restrictive-default flag must match validate.yml: inventory OR live. The live
# half is load-bearing on its own — a host already sitting at drop/block while
# firewalld_default_zone is "" ("leave unchanged") is still locked down, and an
# inventory-only test would disarm this audit on exactly those hosts.
# Re-probe live/offline so tag isolation (--tags interface_audit) still holds.
- name: Query the live default zone for the interface audit
  become: true  # root: firewall-cmd talks to firewalld over privileged D-Bus
  ansible.builtin.command: firewall-cmd --get-default-zone
  register: _fw_audit_live_default_running
  changed_when: false
  failed_when: false
  check_mode: false
  when: _firewalld_live_default is not defined

- name: Query the permanent default zone when the daemon is not answering (audit)
  become: true  # root: firewall-offline-cmd reads /etc/firewalld directly
  ansible.builtin.command: firewall-offline-cmd --get-default-zone
  register: _fw_audit_offline_default
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - _firewalld_live_default is not defined
    - (_fw_audit_live_default_running.rc | default(1)) != 0

- name: Resolve the effective default zone for the audit
  ansible.builtin.set_fact:
    _fw_audit_effective_default: >-
      {{ _firewalld_live_default
         if (_firewalld_live_default is defined)
         else (_fw_audit_live_default_running
               if ((_fw_audit_live_default_running.rc | default(1)) == 0)
               else (_fw_audit_offline_default | default({'rc': 1, 'stdout': ''}))) }}

- name: Determine restrictive-default flag for the audit
  ansible.builtin.set_fact:
    _fw_audit_lockdown: >-
      {{ (firewalld_default_zone in ['drop', 'block'])
         or (((_fw_audit_effective_default.rc | default(1)) == 0)
             and ((_fw_audit_effective_default.stdout | default('') | trim) in ['drop', 'block'])) }}
    # Restrictive default name(s) for messaging / diagnostics. Inventory
    # drop|block wins as the post-switch target when set; else live.
    _fw_audit_restrictive_default: >-
      {{ firewalld_default_zone
         if (firewalld_default_zone in ['drop', 'block'])
         else (
           (_fw_audit_effective_default.stdout | default('') | trim)
           if (((_fw_audit_effective_default.rc | default(1)) == 0)
               and ((_fw_audit_effective_default.stdout | default('') | trim)
                    in ['drop', 'block']))
           else ''
         ) }}
    _fw_audit_live_default_name: >-
      {{ (_fw_audit_effective_default.stdout | default('') | trim)
         if ((_fw_audit_effective_default.rc | default(1)) == 0)
         else '' }}
    # Physical/relevant interfaces only — drop loopback and container/bridge veth
    # noise that never carries host management traffic.
    _fw_audit_ifaces: >-
      {{ ansible_interfaces | default([])
         | reject('equalto', 'lo')
         | reject('match', '^(veth|docker|br-|virbr|cni|flannel|cali|kube|tunl|nodelocaldns|vnet|tap|ip6tnl|sit)')
         | list }}

- name: Get the runtime zone of each relevant interface
  become: true  # root: firewall-cmd talks to firewalld over privileged D-Bus
  ansible.builtin.command: "firewall-cmd --get-zone-of-interface={{ item }}"
  register: _fw_iface_zone
  changed_when: false
  check_mode: false
  failed_when: false  # rc!=0 / "no zone" for an unbound iface is expected
  loop: "{{ _fw_audit_ifaces }}"
  loop_control:
    label: "{{ item }}"

- name: Build the interface-audit summary
  ansible.builtin.set_fact:
    # [{interface, zone}] — empty zone means the NIC falls to the default zone.
    _firewalld_interface_audit: >-
      {% set out = [] %}
      {%- for r in _fw_iface_zone.results -%}
      {%- set _ = out.append({'interface': r.item, 'zone': (r.stdout | default('') | trim)}) -%}
      {%- endfor -%}
      {{ out }}

# ── The operator's own NIC must be classified out of a drop default ──────────
- name: Determine the interface carrying this SSH session
  ansible.builtin.set_fact:
    _fw_ssh_local_ip: >-
      {{ ((ansible_env | default({})).get('SSH_CONNECTION', '') | string).split()[2]
         if (((ansible_env | default({})).get('SSH_CONNECTION', '') | string).split() | length >= 3)
         else '' }}

# The SSH session's own local IP is the ONLY authoritative signal for which NIC
# carries this admin session. The default route is a fallback for when
# SSH_CONNECTION is unreadable (no ssh env under some become/fact-gathering
# combinations) — never a preference.
#
# The precedence below is load-bearing. ansible_default_ipv4.interface is
# effectively always defined (main.yml self-heals the network fact subset), so
# preferring it would discard via_local on every run. On a multi-homed host whose
# admin session arrives on a NIC other than the default-route NIC, every gate
# below would then audit the wrong interface and could pass while the operator's
# real NIC falls to drop.
- name: Resolve the SSH ingress interface (SSH session first, else default route)
  ansible.builtin.set_fact:
    _fw_ssh_iface: >-
      {% set via_local = [] %}
      {%- if _fw_ssh_local_ip | length > 0 -%}
      {%- for i in _fw_audit_ifaces -%}
      {%- if (ansible_facts[i] | default({})).get('ipv4', {}).get('address', '') == _fw_ssh_local_ip -%}
      {%- set _ = via_local.append(i) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {{ (via_local | first) if (via_local | length > 0) else (ansible_default_ipv4.interface | default('')) }}

# Surface which signal won, so an operator reading the run can tell whether the
# gate below judged the real session NIC or only the default-route fallback.
- name: Report how the SSH ingress interface was resolved
  ansible.builtin.debug:
    msg: >-
      firewalld interface audit: SSH ingress NIC '{{ _fw_ssh_iface }}' resolved
      from {{ 'the SSH session (SSH_CONNECTION local IP ' ~ _fw_ssh_local_ip ~ ')'
              if (_fw_ssh_local_ip | length > 0
                  and _fw_ssh_iface != (ansible_default_ipv4.interface | default('')))
              else ('the SSH session' if (_fw_ssh_local_ip | length > 0)
                    else 'the DEFAULT ROUTE (SSH_CONNECTION unreadable — on a
                          multi-homed host confirm this is really your session NIC)') }}.

- name: Resolve the runtime zone of the SSH ingress interface
  ansible.builtin.set_fact:
    _fw_ssh_iface_zone: >-
      {{ (_firewalld_interface_audit
          | selectattr('interface', 'equalto', _fw_ssh_iface)
          | map(attribute='zone') | first | default('')) if (_fw_ssh_iface | length > 0) else '' }}

# `--get-zone-of-interface` cannot answer "is this NIC explicitly bound?". It
# reports a zone NAME either way: for a NIC bound to that zone, and for one that
# merely inherits the current default. Probed on a two-NIC and a three-NIC host,
# both at default=drop: an unbound NIC and a NIC permanently bound to another
# zone BOTH answered `drop` (the bound one because NetworkManager had pulled it
# back at runtime). Only the PERMANENT interface lists distinguish the two.
#
# This matters because an inheriting NIC follows the default wherever it goes.
# With a non-restrictive live default and inventory switching to drop, the NIC
# reports the live default's name, matches no restrictive zone, and the gate
# below skips — then the switch parks it in drop.
- name: List every permanently defined zone
  become: true  # root: firewall-cmd talks to firewalld over privileged D-Bus
  ansible.builtin.command: firewall-cmd --permanent --get-zones
  register: _fw_perm_zones
  changed_when: false
  failed_when: false
  check_mode: false
  when: _fw_ssh_iface | length > 0

- name: List permanently bound interfaces per zone
  become: true  # root: firewall-cmd talks to firewalld over privileged D-Bus
  ansible.builtin.command: >-
    firewall-cmd --permanent --zone={{ item }} --list-interfaces
  register: _fw_perm_ifaces
  changed_when: false
  failed_when: false
  check_mode: false
  loop: >-
    {{ (_fw_perm_zones.stdout | default('') | split)
       if ((_fw_perm_zones.rc | default(1)) == 0) else [] }}
  loop_control:
    label: "{{ item }}"
  when: _fw_ssh_iface | length > 0

- name: Decide whether the SSH ingress NIC is explicitly bound or inherits
  ansible.builtin.set_fact:
    # Fail CLOSED: when the probe could not run (no zones resolved, firewalld
    # unreachable) treat the NIC as inheriting, so the gate errs toward warning.
    _fw_ssh_iface_explicit: >-
      {{ (_fw_perm_ifaces.results | default([])
          | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0)
          | map(attribute='stdout') | map('default', '', true)
          | map('split') | flatten | list) is contains(_fw_ssh_iface) }}

# Empty zone inherits the current default (and, pre-switch, the inventory
# drop/block target after default_zone). Explicit zone equals a *restrictive*
# name only — inventory drop|block and/or live drop|block. Never compare to a
# non-restrictive inventory value: with inventory=public and live=drop, a NIC
# explicitly bound to public would match the inventory value and be reported as
# falling to a restrictive default (false fail).
- name: Classify whether the SSH ingress NIC falls onto a restrictive default
  ansible.builtin.set_fact:
    _fw_ssh_falls_to_restrictive_default: >-
      {{ (_fw_ssh_iface_zone | length == 0)
         or (
           (firewalld_default_zone in ['drop', 'block'])
           and (_fw_ssh_iface_zone == firewalld_default_zone)
         )
         or (
           (_fw_audit_live_default_name in ['drop', 'block'])
           and (_fw_ssh_iface_zone == _fw_audit_live_default_name)
         )
         or (
           not (_fw_ssh_iface_explicit | default(false) | bool)
           and (
             (firewalld_default_zone in ['drop', 'block'])
             or (_fw_audit_live_default_name in ['drop', 'block'])
           )
         ) }}

# Fail only when lockdown is on, the NIC falls onto that restrictive default,
# AND no source binding covers this controller (source classification beats
# interface, so a covered controller is still safe). The containment fact comes
# from validate.yml (always-run); it is only absent under a hand-rolled tag/skip
# that drops validate — then degrade to a loud warn.
#
# `_firewalld_controller_source_covered` is false in TWO different situations, and only
# one of them is a lockout: the controller is genuinely outside every ssh source CIDR,
# or its IP could not be read at all (empty `_firewalld_controller_ip`) so containment
# is UNPROVEN. Requiring a known IP here keeps those apart. An unknown IP is the normal
# case whenever the calling play sets play-level `become: true` — facts are then gathered
# as root and `ansible_env` carries no SSH_CONNECTION — so conflating the two hard-fails
# the role on every such play, including on configurations that open ssh to 0.0.0.0/0.
# validate.yml's sibling assert already gates on a known IP for exactly this reason; the
# unknown case falls through to the warn below instead of blocking the run.
- name: Fail when the SSH ingress NIC falls to a restrictive default with no source cover
  when:
    - _fw_audit_lockdown | bool
    - _fw_ssh_iface | length > 0
    - _fw_ssh_falls_to_restrictive_default | bool
    - _firewalld_controller_source_covered is defined
    - (_firewalld_controller_ip | default('')) | length > 0
    - not (_firewalld_controller_source_covered | bool)
  ansible.builtin.fail:
    msg: >-
      The interface carrying this SSH session ({{ _fw_ssh_iface }}) resolves to
      the restrictive default zone '{{ _fw_audit_restrictive_default }}'
      (iface zone='{{ _fw_ssh_iface_zone | default('') or '(unbound→inherit)' }}',
      inventory default='{{ firewalld_default_zone | default('') or '(unset)' }}')
      and no source binding covers this controller
      ({{ _firewalld_controller_ip | default('unknown') }}). The operator's packet
      path would be dropped. Bind the admin CIDR to an ssh-opening zone, or
      interface-zone {{ _fw_ssh_iface }} explicitly.

- name: Warn when SSH NIC classification cannot be proven (containment fact absent)
  when:
    - _fw_audit_lockdown | bool
    - _fw_ssh_iface | length > 0
    - _fw_ssh_falls_to_restrictive_default | bool
    - _firewalld_controller_source_covered is not defined
  ansible.builtin.debug:
    msg: >-
      WARNING firewalld interface audit: SSH ingress NIC {{ _fw_ssh_iface }}
      resolves to the restrictive default zone
      '{{ _fw_audit_restrictive_default }}', and the controller-containment fact
      is unavailable (validate.yml did not run — a tag/skip selection dropped
      it), so source-path coverage cannot be proven here. Run the full role (or
      validate) to enforce this gate.

# The other unproven case: validate.yml ran, but could not read this controller's IP.
# Loud rather than fatal — see the fail task above for why. Name the ssh source CIDRs so
# the operator can eyeball coverage, since that is the check this run could not make.
- name: Warn when SSH NIC classification cannot be proven (controller IP unknown)
  when:
    - _fw_audit_lockdown | bool
    - _fw_ssh_iface | length > 0
    - _fw_ssh_falls_to_restrictive_default | bool
    - _firewalld_controller_source_covered is defined
    - (_firewalld_controller_ip | default('')) | length == 0
  ansible.builtin.debug:
    msg: >-
      WARNING firewalld interface audit: SSH ingress NIC {{ _fw_ssh_iface }}
      resolves to the restrictive default zone
      '{{ _fw_audit_restrictive_default }}', and this controller's client IP
      could not be read (no SSH_CONNECTION in the gathered environment — usual
      when the play gathers facts under become), so source-path coverage is
      UNPROVEN, not proven absent. The ssh-opening source CIDRs are
      {{ _firewalld_ssh_source_cidrs | default([]) }} — confirm your admin path
      falls inside one before trusting this run.

# NetworkManager owns interface→zone assignment where it manages the device.
- name: Check for nmcli (NetworkManager present)
  ansible.builtin.command: which nmcli
  register: _fw_nmcli
  changed_when: false
  check_mode: false
  failed_when: false

- name: List active NetworkManager connections and devices
  become: true  # root: reads NM connection state
  ansible.builtin.command: nmcli -t -f NAME,DEVICE connection show --active
  register: _fw_nm_active
  changed_when: false
  check_mode: false
  failed_when: false
  when: _fw_nmcli.rc == 0

- name: Read the firewalld zone of each active NM connection
  become: true  # root: reads NM connection properties
  ansible.builtin.command: "nmcli -t -f connection.zone connection show {{ (item.split(':')[0]) | quote }}"
  register: _fw_nm_zone
  changed_when: false
  check_mode: false
  failed_when: false
  loop: "{{ _fw_nm_active.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when: _fw_nmcli.rc == 0

- name: Build the NM device→zone map
  ansible.builtin.set_fact:
    # [{name, device, zone}] — zone '' or '--' means NM leaves it to the default.
    _fw_nm_map: >-
      {% set out = [] %}
      {%- for r in (_fw_nm_zone.results | default([])) -%}
      {%- set parts = r.item.split(':') -%}
      {%- set zval = (r.stdout | default('') | trim | regex_replace('^connection.zone:', '')) -%}
      {%- set _ = out.append({'name': parts[0], 'device': (parts[1] if parts | length > 1 else ''), 'zone': ('' if zval in ['', '--'] else zval)}) -%}
      {%- endfor -%}
      {{ out }}
  when: _fw_nmcli.rc == 0

- name: Compute NM audit warnings
  ansible.builtin.set_fact:
    # Interfaces we zone via zone-XML that NM also manages — NM silently
    # overrides the XML interface bind and loses it on NM restart.
    _fw_nm_xml_override: >-
      {{ _fw_nm_map | default([])
         | selectattr('device', 'in', firewalld_interface_zone_bindings | map(attribute='interface') | list)
         | map(attribute='device') | select('string') | list }}
    # NM-managed interfaces we interface-zone but whose NM connection has no
    # zone set — the boot race can dump them into the default zone.
    _fw_nm_unset_zone: >-
      {{ (_fw_nm_map | default([])
          | selectattr('device', 'in', firewalld_interface_zone_bindings | map(attribute='interface') | list)
          | selectattr('zone', 'equalto', '')
          | map(attribute='device') | select('string') | list)
         if (firewalld_interface_zone_bindings | length > 0) else [] }}
  when: _fw_nmcli.rc == 0

- name: Warn on NM-owned interface bindings (loud — zone-XML binds are fragile)
  ansible.builtin.debug:
    msg: >-
      WARNING firewalld interface audit:
      NM-managed devices bound via zone XML (overridden by NM, lost on NM
      restart — firewalld#195): {{ _fw_nm_xml_override | default([]) }};
      NM connections with unset connection.zone on interface-zoned devices
      (boot race can drop them to the default zone): {{ _fw_nm_unset_zone | default([]) }}.
      Set the zone on the NM connection (nmcli connection modify <con>
      connection.zone <zone>) or prefer source-based zoning.
  when:
    - _fw_nmcli.rc == 0
    - (_fw_nm_xml_override | default([]) | length > 0) or (_fw_nm_unset_zone | default([]) | length > 0)

- name: Fail on NM interface-binding warnings under strict audit
  when:
    - firewalld_strict_interface_audit | bool
    - _fw_nmcli.rc == 0
    - (_fw_nm_xml_override | default([]) | length > 0) or (_fw_nm_unset_zone | default([]) | length > 0)
  ansible.builtin.fail:
    msg: >-
      firewalld_strict_interface_audit is true and NM interface-binding issues
      were found: xml_overridden={{ _fw_nm_xml_override | default([]) }},
      unset_zone={{ _fw_nm_unset_zone | default([]) }}. Fix the NM connection
      zones or switch to source-based zoning.

# ── Zone drifting must be off (it leaks around a restrictive default) ────────
- name: Read /etc/firewalld/firewalld.conf
  become: true  # root: reads firewalld's main config
  ansible.builtin.slurp:
    src: /etc/firewalld/firewalld.conf
  register: _fw_conf
  check_mode: false
  failed_when: false

- name: Assert AllowZoneDrifting is disabled or absent
  vars:
    _drifting: >-
      {{ (_fw_conf.content | default('') | b64decode).splitlines()
         | map('trim')
         | select('match', '^AllowZoneDrifting=')
         | map('regex_replace', '^AllowZoneDrifting=', '')
         | map('lower') | list }}
  ansible.builtin.assert:
    that:
      - _drifting | reject('equalto', 'no') | list | length == 0
    fail_msg: >-
      AllowZoneDrifting is enabled in /etc/firewalld/firewalld.conf
      (value(s): {{ _drifting }}). Zone drifting leaks unclassified traffic
      around a drop/block default. Set AllowZoneDrifting=no (EL8 may ship it on).

- name: Report the interface-audit summary
  ansible.builtin.debug:
    msg:
      - "interfaces={{ _firewalld_interface_audit | default([]) }}"
      - "ssh_ingress_iface={{ _fw_ssh_iface | default('') }} zone={{ _fw_ssh_iface_zone | default('') }}"
      - "nm_present={{ (_fw_nmcli.rc | default(1)) == 0 }}"
