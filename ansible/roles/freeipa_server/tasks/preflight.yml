---
# roles/freeipa_server/tasks/preflight.yml
# Dependency-ordering guards. ASSERT prerequisites; never reboot or destructively
# mutate. Runs on every host before install. Skipped cheaply if already installed.

- name: Check whether FreeIPA is already configured
  ansible.builtin.stat:
    path: /etc/ipa/default.conf
  register: _freeipa_server_configured

- name: Assert the FreeIPA domain is set before any hostname mutation
  ansible.builtin.assert:
    that:
      - (freeipa_server_domain | default('') | trim | length) > 0
    fail_msg: >-
      freeipa_server_domain is empty, so freeipa_server_fqdn would be an
      incomplete "{{ inventory_hostname }}." with a trailing dot. Set
      freeipa_server_domain (via the inventory-wide domain var or an explicit
      override) before this play mutates the hostname and /etc/hosts.
    quiet: true

- name: Assert an offline install declares its package repository
  ansible.builtin.assert:
    that:
      - freeipa_server_package_repo is defined
    fail_msg: >-
      freeipa_server_offline is true but freeipa_server_package_repo is
      undefined. Define freeipa_server_package_repo (name/baseurl/gpgcheck) so
      the offline repo can be configured — otherwise package install has no
      source and fails later with unresolved dependencies.
    quiet: true
  when: freeipa_server_offline | bool

- name: Configure offline package repository
  ansible.builtin.yum_repository:
    name: "{{ freeipa_server_package_repo.name }}"
    description: "FreeIPA offline repo"
    baseurl: "{{ freeipa_server_package_repo.baseurl }}"
    gpgcheck: "{{ freeipa_server_package_repo.gpgcheck | default(true) }}"
    state: present
  when:
    - freeipa_server_offline | bool
    - freeipa_server_package_repo is defined
    - ansible_os_family == "RedHat"

- name: Detect FIPS mode
  ansible.builtin.slurp:
    src: /proc/sys/crypto/fips_enabled
  register: _freeipa_server_fips
  failed_when: false
  changed_when: false

- name: Assert FIPS is enabled before install when required
  ansible.builtin.assert:
    that:
      - (_freeipa_server_fips.content | default('MA==') | b64decode | trim) == "1"
    fail_msg: >-
      freeipa_server_fips_required is true but the host is not in FIPS mode.
      Enable FIPS (fips-mode-setup --enable) and reboot BEFORE installing
      FreeIPA — it cannot be migrated into FIPS after install.
  when:
    - freeipa_server_fips_required | bool
    - not _freeipa_server_configured.stat.exists

# Fail FAST with an actionable message — upstream otherwise dies mid-install
# with "You must specify at least one of --forwarder, --auto-forwarders, or
# --no-forwarders options" only after several setup phases have already run.
- name: Assert DNS forwarder inputs are coherent for an integrated-DNS install
  ansible.builtin.assert:
    that:
      - (freeipa_server_forwarders | length > 0)
        or (freeipa_server_no_forwarders | bool)
      - not ((freeipa_server_forwarders | default([]) | length > 0)
        and (freeipa_server_no_forwarders | default(false) | bool))
    fail_msg: >-
      freeipa_server_setup_dns is true but the forwarder choice is invalid.
      Declare EXACTLY ONE of: freeipa_server_forwarders (e.g. ["192.0.2.1"]) OR
      freeipa_server_no_forwarders: true (root servers only). Declaring neither
      leaves the installer without a choice; declaring BOTH is rejected upstream
      ("You cannot specify forwarders together with no-forwarders"). Or disable
      integrated DNS with freeipa_server_setup_dns: false.
    quiet: true
  # Not gated on "already configured": upstream validates these options before
  # its own configured-check, so an incoherent re-run fails there too.
  when: freeipa_server_setup_dns | bool

- name: Ensure chrony time synchronisation is active
  ansible.builtin.command: chronyc tracking
  register: _freeipa_server_chrony
  changed_when: false
  failed_when: false
  when: not _freeipa_server_configured.stat.exists

- name: Assert clock skew is within Kerberos tolerance
  ansible.builtin.assert:
    that:
      - _freeipa_server_chrony.rc == 0
      - >-
        _freeipa_server_chrony.rc != 0
        or (_freeipa_server_chrony.stdout
        | regex_search('System time *: *([0-9.]+)', '\\1') | first | float)
        < (freeipa_server_preflight_time_tolerance_sec | float)
    fail_msg: >-
      Chrony is not tracking or system clock skew exceeds
      {{ freeipa_server_preflight_time_tolerance_sec }}s. Kerberos auth fails
      above 300s skew. Fix NTP before installing.
  when:
    - not _freeipa_server_configured.stat.exists

- name: Set the system hostname to the FreeIPA FQDN
  ansible.builtin.hostname:
    name: "{{ freeipa_server_fqdn }}"
  when: not _freeipa_server_configured.stat.exists

- name: Ensure this host's FQDN resolves via /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^{{ ansible_host | regex_escape }}\s'
    line: "{{ ansible_host }} {{ freeipa_server_fqdn }} {{ inventory_hostname }}"
    state: present
    mode: "0644"
  when: not _freeipa_server_configured.stat.exists

- name: Wait for the primary FreeIPA LDAP port before replica enrolment
  ansible.builtin.wait_for:
    host: "{{ freeipa_server_primary_ip }}"
    port: 389
    timeout: "{{ freeipa_server_preflight_wait_primary_timeout }}"
  when:
    - not (freeipa_server_is_primary | bool)
    - not _freeipa_server_configured.stat.exists

# ── Replica prerequisites in the REVERSE direction (primary → replica) ───────
# The wait_for above only proves replica → primary. ipa-replica-install's conncheck also
# requires the PRIMARY to resolve and reach the REPLICA, and neither of those is created
# by the install. Unchecked, both surface late as an opaque
#   "Connection check failed! See /var/log/ipareplica-conncheck.log"
# with the real cause only in that log ON the replica. Asserting here fails in seconds,
# on the controller, with the exact remediation. Live-proven necessary 2026-08-07: a
# replica join failed on both of these in turn.
- name: Preflight | Resolve this replica's FQDN from the primary
  ansible.builtin.command:
    argv: [dig, +short, +time=3, +tries=1, "{{ freeipa_server_fqdn }}", A]
  delegate_to: "{{ freeipa_server_primary_host_name }}"
  become: false
  changed_when: false
  failed_when: false
  register: _freeipa_replica_fqdn_lookup
  when:
    - not (freeipa_server_is_primary | bool)
    - not _freeipa_server_configured.stat.exists

- name: Preflight | Assert the primary resolves this replica to its inventory address
  ansible.builtin.assert:
    that:
      - (_freeipa_replica_fqdn_lookup.stdout | default('') | trim) == ansible_host
    fail_msg: >-
      The primary ({{ freeipa_server_primary_host_name }}) resolves
      {{ freeipa_server_fqdn }} to
      '{{ _freeipa_replica_fqdn_lookup.stdout | default('') | trim | default('NOTHING', true) }}'
      but inventory says {{ ansible_host }}. ipa-replica-install's conncheck will fail
      with "Port check failed! Unable to resolve host name". The realm zone is
      dynamic_update:false, so an enrolling host cannot self-register — declare an A
      record for this host in freeipa_server_dns_records under the realm zone
      ({{ freeipa_server_domain }}.) and apply it on the PRIMARY with
      `--tags dns --limit {{ freeipa_server_primary_host_name }}`.
      NOTE `ipa host-del <fqdn> --updatedns` REMOVES that record — re-apply --tags dns
      after any such cleanup.
    quiet: true
  when:
    - not (freeipa_server_is_primary | bool)
    - not _freeipa_server_configured.stat.exists

# Port reachability cannot be probed before install (nothing is listening yet), so assert
# the FIREWALL CONTRACT instead — that is knowable now and is the thing that is missing on
# a freshly provisioned guest, which allows only ssh/cockpit/dhcpv6 until the estate
# firewalld role has run.
# Deliberately simple: list the services of every ACTIVE zone. If the estate firewalld
# contract has been applied this host will expose freeipa-ldap somewhere; a fresh guest
# will not expose it anywhere. Resolving which specific zone the primary's source maps to
# is more fragile than the signal is worth, and firewalld is not guaranteed to be running
# at all on a bare guest — hence the `|| true`.
- name: Preflight | Read the firewalld services active on this replica
  ansible.builtin.shell:
    cmd: firewall-cmd --list-all-zones 2>/dev/null | grep -E '^\s+services:' || true
    executable: /bin/bash
  become: true  # root: firewall-cmd queries need privilege
  changed_when: false
  failed_when: false
  register: _freeipa_replica_fw_services
  when:
    - not (freeipa_server_is_primary | bool)
    - not _freeipa_server_configured.stat.exists

- name: Preflight | Assert the replica's firewall admits FreeIPA from the primary
  ansible.builtin.assert:
    that:
      - "'freeipa-ldap' in (_freeipa_replica_fw_services.stdout | default(''))"
    fail_msg: >-
      This replica's firewalld does not admit freeipa-ldap from the primary
      ({{ freeipa_server_primary_ip }}); it currently allows:
      '{{ _freeipa_replica_fw_services.stdout | default('') | trim }}'.
      A freshly provisioned guest allows only ssh/cockpit/dhcpv6 —
      freeipa_server_setup_firewalld is false estate-wide because the firewalld role owns
      the contract. Apply it BEFORE the replica install (not merely before any DNS
      cutover): run whichever playbook applies your firewalld contract, limited to
      {{ inventory_hostname }}.
    quiet: true
  when:
    - not (freeipa_server_is_primary | bool)
    - not _freeipa_server_configured.stat.exists

- name: Assert external CA cert files are provided when ca_mode is external-ca
  ansible.builtin.assert:
    that:
      - freeipa_server_external_cert_files | length > 0
    fail_msg: >-
      freeipa_server_ca_mode is external-ca but freeipa_server_external_cert_files
      is empty. external-ca is two-phase: the first run emits a CSR
      (/root/ipa.csr), which must be signed by your external CA; supply the
      signed cert chain via freeipa_server_external_cert_files and re-run.
  when:
    - freeipa_server_ca_mode == "external-ca"
    - freeipa_server_is_primary | bool
    - not _freeipa_server_configured.stat.exists
    # opt-in escape hatch: skip this assert ONLY when the operator has explicitly
    # allowed phase 1 (CSR-emitting) to run with cert files still empty.
    - not (freeipa_server_external_ca_allow_csr_phase | bool and
      freeipa_server_external_cert_files | length == 0)
