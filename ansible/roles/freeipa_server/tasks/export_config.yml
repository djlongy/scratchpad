---
# roles/freeipa_server/tasks/export_config.yml
#
# Snapshot the LIVE FreeIPA configuration into this role's flat declarative
# contract (freeipa_iam_* / freeipa_server_*), written as a YAML group_vars
# file on the control node. Lets you adopt an existing instance — capture it
# once, then reapply idempotently with this role instead of rebuilding from
# scratch.
#
# Read-only against FreeIPA (only *_find/*_show via the on-server ipalib). Opt-in:
# gated behind the `export` tag (main.yml tags it [never, export]), primary only.
# Auth reuses the IAM admin credential from Vault, same as iam.yml.

- name: Export | Assert this is the primary
  ansible.builtin.assert:
    that:
      - freeipa_server_is_primary | bool
    fail_msg: "Config export runs on the FreeIPA primary only."

- name: Export | Assert a credential source is available
  ansible.builtin.assert:
    that:
      - (freeipa_server_admin_password | default('') | length > 0) or
        (freeipa_server_vault_secret | default('') | length > 0)
    fail_msg: >-
      No admin credential available. Either set freeipa_server_admin_password
      (no HashiCorp Vault needed), or configure freeipa_server_vault_secret for the
      Vault fallback.

- name: Export | Resolve admin password (shared resolver)
  ansible.builtin.include_tasks: resolve_credentials.yml
  vars:
    _freeipa_resolve: [admin]

- name: Export | Acquire Kerberos ticket
  ansible.builtin.command: "kinit {{ freeipa_server_admin_principal }}@{{ freeipa_server_realm }}"
  args:
    stdin: "{{ _freeipa_admin_password }}"
  changed_when: false
  no_log: true

- name: Export | Capture live configuration via ipalib
  ansible.builtin.script: >-
    freeipa_config_export.py
    {{ '--include-host-membership' if freeipa_server_export_include_host_membership | bool else '' }}
    {{ '--include-sshkeys' if freeipa_server_export_include_sshkeys | bool else '' }}
    {{ '--exclude-gids' if not (freeipa_server_export_include_gids | bool) else '' }}
    {{ '--include-stock-hbacsvcgroups' if freeipa_server_export_stock_hbacsvcgroups | bool else '' }}
    --stock-hbacsvc {{ freeipa_server_export_stock_hbacsvcs | to_json | quote }}
    --skip-groups {{ [freeipa_iam_managed_group, freeipa_iam_managed_groups_group] | to_json | quote }}
  args:
    executable: /usr/bin/python3
  register: _freeipa_export_raw
  changed_when: false

- name: Export | Destroy Kerberos ticket
  ansible.builtin.command: kdestroy
  changed_when: false
  failed_when: false
  no_log: true

- name: Export | Parse captured configuration
  ansible.builtin.set_fact:
    # Slice from the first '{' so any stray preamble on stdout (e.g. a library warning)
    # can never break from_json — the script emits one JSON object as its real output.
    _freeipa_export: "{{ _freeipa_export_raw.stdout[_freeipa_export_raw.stdout.find('{'):] | from_json }}"

- name: Export | Scope the snapshot to a tenant/env slice (optional)
  ansible.builtin.set_fact:
    _freeipa_export: "{{ _freeipa_export | freeipa_export_scope(freeipa_server_export_scope, freeipa_server_export_scope_mode) }}"
  when: freeipa_server_export_scope | default([]) | length > 0

- name: Export | Assert the output path is set
  ansible.builtin.assert:
    that:
      - freeipa_server_export_output | default('') | length > 0
    fail_msg: freeipa_server_export_output must not be empty.
    quiet: true

# The template action resolves a relative dest against the PLAYBOOK directory — never
# what a human means by "./snapshot.yml". Instead of refusing relative paths (the old
# behaviour), resolve them explicitly against the directory ansible-playbook was
# INVOKED from ($PWD), falling back to the playbook directory when $PWD is unset
# (cron/CI). '~' passes through — the template action expands it on localhost.
- name: Export | Resolve the output path (relative = invocation cwd)
  vars:
    # Hoisted so the unit harness can replay the set_fact expression without a
    # live lookup plugin: the env read happens here, the arithmetic below.
    _freeipa_export_cwd: "{{ lookup('ansible.builtin.env', 'PWD') | default(playbook_dir, true) }}"
  ansible.builtin.set_fact:
    _freeipa_export_output: >-
      {{ freeipa_server_export_output
         if freeipa_server_export_output is match('^[/~]')
         else _freeipa_export_cwd.rstrip('/') ~ '/' ~ freeipa_server_export_output }}

# The old absolute-only assert existed for one reason: a snapshot inside the repo is a
# commit risk (only the default filename pattern is gitignored). That concern survives
# as a loud warning instead of a refusal — the path is now explicit and predictable,
# so where it lands is the operator's call, but never a silent one.
- name: Export | Warn when the snapshot lands inside the repository tree
  ansible.builtin.debug:
    msg: >-
      WARNING: resolved export path '{{ _freeipa_export_output }}' is INSIDE the
      repository tree. Only the default snapshot filename pattern
      (freeipa.config.snapshot*.yml) is gitignored — a custom filename here is one
      broad `git add` away from committing the realm's full user/group/rule
      inventory. Move it out of the repo or confirm it stays untracked.
  when: (playbook_dir | dirname | dirname) in _freeipa_export_output

- name: Export | Render the snapshot group_vars file on the control node
  ansible.builtin.template:
    src: freeipa.config.snapshot.yml.j2
    dest: "{{ _freeipa_export_output }}"
    mode: "0640"
  delegate_to: localhost
  become: false

- name: Export | Report
  ansible.builtin.debug:
    msg: >-
      Captured {{ _freeipa_export.meta.realm }} from {{ _freeipa_export.meta.source }}
      → {{ _freeipa_export_output }} ({{ _freeipa_export.meta.counts | to_json }}).
      Move it into an inventory group_vars to reapply with this role.
