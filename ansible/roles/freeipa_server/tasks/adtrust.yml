---
# roles/freeipa_server/tasks/adtrust.yml
# Establish cross-forest trust(s) with Active Directory via the upstream ipatrust
# module. Requires the AD trust controller (freeipa_server_setup_adtrust -> the
# install runs with --setup-adtrust) and reachable AD DCs + two-way DNS. Primary
# only. The IPA admin password and each AD admin password come from Vault.
# Idempotent (ipatrust reconciles).
#
# NOTE: not live-tested in this estate (no AD); shipped as a capability.

- name: AD trust | Resolve admin password (shared resolver)
  ansible.builtin.include_tasks: resolve_credentials.yml
  vars:
    _freeipa_resolve: [admin]

- name: AD trust | Establish trust(s) with Active Directory
  freeipa.ansible_freeipa.ipatrust:
    realm: "{{ item.realm }}"
    trust_type: "{{ item.trust_type | default('ad') }}"
    admin: "{{ item.admin }}"
    password: >-
      {{ item.password
         if (item.password | default('') | length > 0)
         else lookup('community.hashi_vault.hashi_vault',
            'secret=' + freeipa_server_vault_secret + ':' + item.password_field) }}
    two_way: "{{ item.two_way | default(omit) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ freeipa_server_ad_trusts }}"
  loop_control:
    label: "{{ item.realm }}"
  # Defence in depth. ipatrust already declares `password` no_log=True, so the module ARGS
  # are masked — but that does not cover the loop `item`, which is echoed verbatim in the
  # task result. An entry using the inline `password:` form (rather than the intended
  # password_field + Vault lookup) would otherwise land in the transcript. The label above
  # keeps the realm visible so the loop is still readable.
  no_log: true
