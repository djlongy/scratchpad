---
# roles/freeipa_client/tasks/enroll.yml
# Wrap freeipa.ansible_freeipa.ipaclient to enrol the host. Idempotent: on an
# already-enrolled healthy host the upstream role no-ops; preflight will have
# uninstalled a stale enrolment so this re-joins cleanly.
#
# `omit` does NOT work for include_role vars (it leaks the placeholder string),
# so required inputs are set via set_fact and optional ones only when provided.

# detect.yml is imported with `always`, so these facts exist under every tag selection.
# Asserting it makes that contract load-bearing instead of implicit: the force_join gate
# below reads _freeipa_client_healthy with `| default(false)`, which fails OPEN (force
# applies). If a future refactor stops detect.yml from running, that silently restores the
# every-converge keytab purge this gate exists to prevent. Fail loudly instead.
- name: Assert enrolment detection ran (detect.yml facts present)
  ansible.builtin.assert:
    that:
      - _freeipa_client_healthy is defined
      - _freeipa_client_stale is defined
    fail_msg: >-
      detect.yml did not run — _freeipa_client_healthy/_freeipa_client_stale are missing.
      enroll.yml derives ipaclient_force_join from them; without them a host with
      freeipa_client_force_join=true would purge /etc/krb5.keytab and re-join on EVERY
      converge. main.yml must import detect.yml with `tags: [always]` before this phase.
    quiet: true

- name: Validate enrolment inputs
  ansible.builtin.assert:
    that:
      - freeipa_client_domain | length > 0
      - freeipa_client_realm | length > 0
      - >-
          (freeipa_client_use_otp | bool)
          or (freeipa_client_admin_password | default('') | length > 0)
          or (freeipa_client_vault_secret | default('') | length > 0)
      - (not (freeipa_client_use_otp | bool)) or (freeipa_client_otp | default('') | length > 0)
    fail_msg: >-
      Need freeipa_client_domain + freeipa_client_realm, and either an admin
      password for admin-join (freeipa_client_admin_password declared, or
      freeipa_client_vault_secret for the HashiCorp Vault fallback) or
      freeipa_client_use_otp=true with freeipa_client_otp set.

- name: Resolve admin password for enrolment (admin-join only)
  ansible.builtin.include_tasks: resolve_admin_password.yml
  when: not (freeipa_client_use_otp | bool)

- name: Map required ipaclient inputs
  ansible.builtin.set_fact:
    ipaclient_domain: "{{ freeipa_client_domain }}"
    ipaclient_realm: "{{ freeipa_client_realm }}"
    ipaclient_hostname: "{{ freeipa_client_fqdn }}"
    ipaclient_servers: "{{ freeipa_client_servers }}"
    # NEVER force-join a host that is already healthily enrolled. Upstream reads
    # force_join as "purge the realm's principals from /etc/krb5.keytab
    # (ipa-rmkeytab -r REALM) and re-join" — see ipaclient/tasks/install.yml, the
    # rmkeytab task gated on `ipaclient_use_otp or ipaclient_force_join`, and the
    # Join task gated on `not krb5_keytab_ok or ipaclient_force_join`. It also
    # defeats the already-configured short-circuit at the top of that file. Left
    # unconditional, a permanent `freeipa_client_force_join: true` in host_vars
    # re-keyed the host on EVERY converge, churning SSSD/GSSAPI/certmonger.
    #
    # The flag stays meaningful where it was actually needed: a guest rebuilt under
    # the SAME FQDN, whose server-side host entry survives but whose keytab does not
    # ("krb5.keytab missing! Retry with ipaclient_force_join=yes"). That host is not
    # healthy — no /etc/ipa/default.conf — so the force still applies on that first
    # join, and stops applying once enrolment succeeds.
    #
    # _freeipa_client_stale still forces unconditionally: preflight has just
    # uninstalled that enrolment, so a clean re-join is exactly what is wanted.
    # _freeipa_client_healthy comes from detect.yml, which runs under `always` so this
    # gate holds under --tags enroll too.
    ipaclient_force_join: >-
      {{ (_freeipa_client_stale | default(false) | bool)
         or ((freeipa_client_force_join | bool)
             and not (_freeipa_client_healthy | default(false) | bool)) }}
    ipaclient_allow_repair: "{{ freeipa_client_allow_repair | bool }}"
    ipaclient_kinit_attempts: "{{ freeipa_client_kinit_attempts | int }}"
    ipaclient_no_dns_lookup: "{{ freeipa_client_no_dns_lookup }}"
    ipaclient_on_master: "{{ freeipa_client_on_master }}"
    ipaclient_mkhomedir: "{{ freeipa_client_mkhomedir }}"
    ipaclient_no_sudo: "{{ freeipa_client_no_sudo }}"
    ipaclient_subid: "{{ freeipa_client_subid }}"
    ipaclient_all_ip_addresses: "{{ freeipa_client_all_ip_addresses }}"
    ipasssd_enable_dns_updates: "{{ freeipa_client_enable_dns_updates }}"
    ipaclient_no_dns_sshfp: "{{ freeipa_client_no_dns_sshfp }}"
    ipaclient_ssh_trust_dns: "{{ freeipa_client_ssh_trust_dns }}"
    ipaclient_no_ssh: "{{ freeipa_client_no_ssh }}"
    ipaclient_no_sshd: "{{ freeipa_client_no_sshd }}"
    ipaclient_no_dnssec_validation: "{{ freeipa_client_no_dnssec_validation }}"
    ipaclient_configure_dns_resolver: "{{ freeipa_client_configure_dns_resolver }}"
    ipaclient_no_ntp: "{{ freeipa_client_no_ntp }}"
    ipaclient_ntp_servers: "{{ freeipa_client_ntp_servers }}"
  no_log: true

- name: Map admin-join credentials
  ansible.builtin.set_fact:
    ipaadmin_principal: "{{ freeipa_client_admin_principal }}"
    ipaadmin_password: "{{ _freeipa_client_admin_pw }}"
  no_log: true
  when: not (freeipa_client_use_otp | bool)

- name: Map OTP-join credential
  ansible.builtin.set_fact:
    ipaclient_otp: "{{ freeipa_client_otp }}"
  no_log: true
  when: freeipa_client_use_otp | bool

- name: Map optional NTP pool when provided
  ansible.builtin.set_fact:
    ipaclient_ntp_pool: "{{ freeipa_client_ntp_pool }}"
  when: freeipa_client_ntp_pool | default('') | length > 0

- name: Map optional NFS home automount location when provided
  ansible.builtin.set_fact:
    ipaclient_automount_location: "{{ freeipa_client_automount_location }}"
  when: freeipa_client_automount_location | default('') | length > 0

- name: Enrol via the upstream ipaclient role
  ansible.builtin.import_role:            # static import so task-level become propagates to the role's tasks
    name: freeipa.ansible_freeipa.ipaclient
  vars:
    state: present
  become: true                           # ipaclient writes /etc/ipa, sssd and krb5 config — root-only

# kinit -k FIRST, from this host's own keytab. The upstream ipaclient role ends
# enrolment with its own "Cleanup leftover ccache" task, which destroys the admin
# TGT obtained during the join — so ipa-certupdate cannot rely on an inherited
# ccache and fails "No credentials were supplied ... Preauthentication failed".
# The host principal in /etc/krb5.keytab is always available post-enrolment and
# needs no admin rights, so this works on both a fresh join and a re-run.
- name: Refresh local IPA certificate stores (ipa-certupdate)
  ansible.builtin.shell:                 # shell: needs && to chain kinit into ipa-certupdate
    cmd: kinit -k host/{{ freeipa_client_fqdn }}@{{ freeipa_client_realm }} && ipa-certupdate
  become: true                           # writes to the system NSS/CA trust store — root-only
  changed_when: false

# Enrolment reconfigures DNS/NetworkManager and may change the hostname, which
# resets the network path underneath the multiplexed SSH master. The master is
# not torn down immediately — it dies once ServerAlive keepalives go unanswered
# for their full budget, so the play fails on some UNRELATED task minutes later
# with "Data could not be sent to remote host". Dropping the connection makes
# the reconnect explicit instead of a delayed, misattributed failure.
# (Restarting sshd does NOT do this — established sessions are forked children
# and survive; it is the network path, not the daemon.)
#
# MUST come AFTER ipa-certupdate. Enrolment's Kerberos TGT lives in a
# SESSION-scoped ccache (KEYRING:/KCM: on EL9), so dropping the connection
# destroys it — ipa-certupdate then dies with "No credentials were supplied ...
# Preauthentication failed".
- name: Reconnect after enrolment reset the network path
  ansible.builtin.meta: reset_connection
