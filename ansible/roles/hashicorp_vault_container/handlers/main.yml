---
# Restart reloads the bind-mounted vault.hcl. Compose-file changes (image,
# ports, volumes) are applied by `docker compose up -d` in deploy.yml.
#
# throttle: 1 makes this a ROLLING restart so we never bounce every host at
# once. That is intentional — but under Shamir (auto-unseal off, the default)
# it does NOT preserve Raft quorum: a restarted node comes back SEALED and a
# sealed node is not a live voter. On a 3-node cluster, restarting the 2nd node
# leaves only 1 unsealed voter and the API is gone until unseal.yml catches up.
# throttle only bounds the blast radius of a simultaneous restart.
#
# Every phase that notifies this handler therefore imports seal_guard.yml, which
# refuses the run when the selected tags would restart a live unsealed Shamir
# cluster without also selecting the unseal phase. unseal.yml flushes pending
# handlers before it unseals, so a paired run (e.g. `--tags tls,unseal`) is
# restart-then-unseal and self-correcting.
#
# A KMS/transit hashicorp_vault_seal_config makes a rolling restart self-healing
# and stands the guard down. hashicorp_vault_auto_unseal does NOT: its unit is
# oneshot + WantedBy=multi-user.target, i.e. host boot only, and a container
# restart is not a boot. Certificate renewals need not come through here at all:
# the on-host post-save hook SIGHUPs Vault instead, reloading the listener cert
# in place with no seal.
- name: Restart vault container
  become: true  # root: docker CLI needs the root-owned docker socket
  ansible.builtin.command:
    cmd: "docker compose restart"
    chdir: "{{ hashicorp_vault_data_mount }}"
  changed_when: true
  throttle: 1

- name: Reload systemd
  become: true  # root: systemd daemon-reload
  ansible.builtin.systemd_service:
    daemon_reload: true

# fapolicyd caches its trust db in memory, so a freshly trusted file is not
# executable until the daemon picks it up. `--update` notifies the running
# daemon to refresh the database in place; the unit reports CanReload=no and a
# restart would briefly drop enforcement on a security-critical service, so
# prefer the notify over `systemctl restart`.
- name: Update the fapolicyd trust database
  become: true  # root: notifies the fapolicyd daemon
  ansible.builtin.command:
    cmd: fapolicyd-cli --update
  changed_when: true
