---
# Unseal — unseal every node using declared shares or on-disk init material.
# Self-contained so it can run alone with `--tags unseal` after reboot /
# container restart, without re-running init.
#
#   ansible-playbook ... --tags unseal
#
# Share source (declared-var-first):
#   1. hashicorp_vault_unseal_keys  (list of base64 shares; first `threshold` used)
#   2. else {{ keys_dir }}/vault_init.json on the first node
#
# Root token on disk is OPTIONAL convenience (hashicorp_vault_persist_init).
# Management phases resolve root via resolve_root_token.yml (var → disk).
#
# Boot-time auto-unseal is separate — see autounseal.yml.

# Handlers otherwise fire at the END of the play, i.e. AFTER this phase — so a
# combined run like `--tags tls,unseal` would unseal every node and only then
# bounce the container, leaving the cluster sealed exactly as if unseal had
# never been selected. Flushing first inverts that into restart-then-unseal, and
# is what makes "add the unseal phase" a real remedy (see seal_guard.yml).
# Cheap no-op when nothing is pending; carries this file's [init, unseal] tags,
# so it never fires on a run that did not select unsealing.
- name: "Unseal | Apply any pending container restart BEFORE unsealing"
  ansible.builtin.meta: flush_handlers

# ── Resolve Shamir shares ───────────────────────────────────────────────────
- name: "Unseal | Prefer declared unseal key list"
  ansible.builtin.set_fact:
    _hashicorp_vault_unseal_keys: >-
      {{ hashicorp_vault_unseal_keys[:hashicorp_vault_key_threshold | int] }}
  when: (hashicorp_vault_unseal_keys | default([]) | length) > 0
  no_log: true

- name: "Unseal | Fall back to on-disk vault_init.json"
  when: (hashicorp_vault_unseal_keys | default([]) | length) == 0
  block:
    - name: "Unseal | Read the persisted init material"
      become: true  # root: reads the root-only vault_init.json
      ansible.builtin.slurp:
        src: "{{ hashicorp_vault_keys_dir }}/vault_init.json"
      register: _hashicorp_vault_init_slurp
      delegate_to: "{{ hashicorp_vault_first_node }}"
      no_log: true

    - name: "Unseal | Extract unseal keys (and root) from init JSON"
      ansible.builtin.set_fact:
        _hashicorp_vault_unseal_keys: >-
          {{ (_hashicorp_vault_init_slurp.content | b64decode | from_json).unseal_keys_b64[:hashicorp_vault_key_threshold | int] }}
        _hashicorp_vault_init_root_token: >-
          {{ (_hashicorp_vault_init_slurp.content | b64decode | from_json).root_token | default('') }}
      no_log: true

- name: "Unseal | Assert enough unseal shares are available"
  ansible.builtin.assert:
    that:
      - (_hashicorp_vault_unseal_keys | default([]) | length) >= (hashicorp_vault_key_threshold | int)
    quiet: true
    fail_msg: >-
      Need at least hashicorp_vault_key_threshold ({{ hashicorp_vault_key_threshold }})
      Shamir share(s). Set hashicorp_vault_unseal_keys (list) from Ansible Vault
      custody, or restore {{ hashicorp_vault_keys_dir }}/vault_init.json on
      {{ hashicorp_vault_first_node }}.

# Root for optional disk persist: declared var wins, else root embedded in init JSON.
- name: "Unseal | Resolve root token for optional disk persist"
  ansible.builtin.set_fact:
    _hashicorp_vault_root_token: >-
      {{ (hashicorp_vault_root_token | string | trim)
         if ((hashicorp_vault_root_token | default('') | string | trim | length) > 0)
         else (_hashicorp_vault_init_root_token | default('')) }}
  when: hashicorp_vault_persist_init | bool
  no_log: true

- name: "Unseal | Save root_token.txt on the first node (persist_init)"
  become: true  # root: writes the root-only root_token.txt
  ansible.builtin.copy:
    content: "{{ _hashicorp_vault_root_token }}\n"
    dest: "{{ hashicorp_vault_keys_dir }}/root_token.txt"
    owner: root
    group: root
    mode: "0400"
  no_log: true
  run_once: true
  delegate_to: "{{ hashicorp_vault_first_node }}"
  when:
    - hashicorp_vault_persist_init | bool
    - (_hashicorp_vault_root_token | default('') | length) > 0

- name: "Unseal | Remove on-disk root_token.txt when not persisting"
  become: true  # root: removes residual root-only token file
  ansible.builtin.file:
    path: "{{ hashicorp_vault_keys_dir }}/root_token.txt"
    state: absent
  run_once: true
  delegate_to: "{{ hashicorp_vault_first_node }}"
  when: not (hashicorp_vault_persist_init | bool)

# ── Unseal the first node, then wait for it to come up ────────────────────
- name: "Unseal | Check the first node's seal status"
  become: true  # root: docker exec needs the root-owned docker socket
  ansible.builtin.command:
    cmd: "docker exec {{ hashicorp_vault_name }} vault status -format=json"
  register: _hashicorp_vault_leader_seal
  changed_when: false
  failed_when: false
  run_once: true
  delegate_to: "{{ hashicorp_vault_first_node }}"

# Vault refuses non-TTY stdin for unseal ("provide as first argument"). Key is
# therefore argv to docker/vault; no_log keeps it out of Ansible logs. Prefer
# short-lived process argv over permanent on-disk unseal_keys when auto_unseal is off.
- name: "Unseal | Unseal the first node"
  become: true  # root: docker exec needs the root-owned docker socket
  ansible.builtin.command:
    cmd: "docker exec {{ hashicorp_vault_name }} vault operator unseal {{ item }}"
  loop: "{{ _hashicorp_vault_unseal_keys }}"
  changed_when: true
  no_log: true
  run_once: true
  delegate_to: "{{ hashicorp_vault_first_node }}"
  when: (_hashicorp_vault_leader_seal.stdout | default('{}') | from_json).sealed | default(true)

# standbyok=true: passes for active leader or healthy unsealed standby
# (leadership may sit on another node). A sealed node returns 503, so the
# wait guarantees the node is up and unsealed.
- name: "Unseal | Wait for the first node to be unsealed (active or standby)"
  become: false  # localhost/API — API reachability probe, no host privilege
  ansible.builtin.uri:
    url: "{{ hashicorp_vault_scheme }}://127.0.0.1:{{ hashicorp_vault_api_port }}/v1/sys/health?standbyok=true"
    validate_certs: false
    status_code: [200]
  register: _hashicorp_vault_leader_active
  until: _hashicorp_vault_leader_active.status == 200
  retries: 30
  delay: 5
  run_once: true
  delegate_to: "{{ hashicorp_vault_first_node }}"

# ── Unseal the remaining nodes (HA only) ──────────────────────────────────
- name: "Unseal | Check the other nodes' seal status"
  become: true  # root: docker exec needs the root-owned docker socket
  ansible.builtin.command:
    cmd: "docker exec {{ hashicorp_vault_name }} vault status -format=json"
  register: _hashicorp_vault_node_seal
  changed_when: false
  failed_when: false
  when:
    - hashicorp_vault_is_ha | bool
    - inventory_hostname != hashicorp_vault_first_node

- name: "Unseal | Unseal the other nodes"
  become: true  # root: docker exec needs the root-owned docker socket
  ansible.builtin.command:
    cmd: "docker exec {{ hashicorp_vault_name }} vault operator unseal {{ item }}"
  loop: "{{ _hashicorp_vault_unseal_keys }}"
  changed_when: true
  no_log: true
  when:
    - hashicorp_vault_is_ha | bool
    - inventory_hostname != hashicorp_vault_first_node
    - (_hashicorp_vault_node_seal.stdout | default('{}') | from_json).sealed | default(true)
