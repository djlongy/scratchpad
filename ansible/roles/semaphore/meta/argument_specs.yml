---
argument_specs:
  main:
    short_description: Deploy Semaphore UI as a docker compose + systemd stack.
    description:
      - >-
        Installs Semaphore CE with PostgreSQL, optional LDAP (generic or
        FreeIPA-provisioned), declarative project reconcile, and an API smoke
        test. HashiCorp Vault and FreeIPA are opt-in external dependencies —
        defaults use a local secrets file and no directory integration.
      - >-
        Privilege is self-contained. Root work uses task-level become true;
        Vault lookups and API calls use become false. Do not set play-level
        become for this role.
    options:
      semaphore_fqdn:
        type: str
        required: true
        description: Public FQDN served in front of the instance (TLS terminates upstream).
      semaphore_dns_servers:
        type: list
        elements: str
        description: >-
          DNS resolvers injected into the Semaphore container. Empty inherits
          the host resolv.conf.
      semaphore_ansible_secret_store:
        type: str
        default: host_file
        choices:
          - host_file
          - vault_kv
        description: >-
          Where THIS ROLE (Ansible) persists install-time secrets it generates.
          host_file = host path under data_dir/secrets (default). vault_kv =
          HashiCorp KV v2 apps/semaphore/runtime (estate Vault vars + control-node
          token). Not Semaphore's own runtime secret-storage setting.
      semaphore_admin_password:
        type: str
        default: ""
        description: Optional declared admin password (else generate + persist).
      semaphore_db_password:
        type: str
        default: ""
        description: Optional declared DB password (else generate + persist).
      semaphore_ldap_enabled:
        type: bool
        default: false
        description: Enable Semaphore LDAP auth env vars (generic; not FreeIPA-specific).
      semaphore_ldap_host:
        type: str
        default: ""
        description: LDAPS hostname (required when LDAP is enabled).
      semaphore_ldap_port:
        type: int
        default: 636
        description: LDAPS port.
      semaphore_ldap_ca_cert_src:
        type: str
        default: ""
        description: Optional CA cert path for LDAPS when not using freeipa provision.
      semaphore_ldap_admins:
        type: list
        elements: dict
        description: LDAP users promoted to Semaphore admin (must already exist in the directory).
      semaphore_freeipa_provision:
        type: bool
        default: false
        description: >-
          When true (and LDAP on), provision svc-semaphore via FreeIPA and
          slurp the FreeIPA CA. Requires a non-empty freeipa inventory group.
      semaphore_freeipa_admin_password:
        type: str
        default: ""
        description: >-
          FreeIPA admin password for svc-semaphore provisioning. Empty falls
          back to HashiCorp Vault freeipa/runtime when
          semaphore_ansible_secret_store=vault_kv.
      semaphore_projects:
        type: list
        elements: dict
        description: Declarative project/inventory/template definitions reconciled via the REST API.
