---
# Collections used by this role (also listed in repo requirements.yml):
#   ansible.posix          — firewalld
#   community.general      — git_config
#   community.hashi_vault  — only when ansible_secret_store=vault_kv (or freeipa admin via Vault)
#   freeipa.ansible_freeipa — only when freeipa_provision=true
galaxy_info:
  role_name: semaphore
  author: operator
  description: >-
    Deploy Semaphore UI (Ansible/Terraform web orchestrator) as a docker compose
    stack — install, configure, optional LDAP admin promotion, declarative project
    reconcile, and smoke test. Privilege-self-contained (no play-level become).
    Vault and FreeIPA are opt-in.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: EL
      versions:
        - "9"
  galaxy_tags:
    - semaphore
    - ansible
    - orchestration
    - docker
dependencies: []
