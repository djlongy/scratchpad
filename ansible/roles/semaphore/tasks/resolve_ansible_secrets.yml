---
# resolve_ansible_secrets.yml — Ansible deploy-time secret resolution only.
#
# Named resolve_ansible_secrets rather than secrets.yml to stay out of the
# repo's secret-file ignore rules. That rename is not sufficient on its own
# here: this repo ignores `*secrets*`, so .gitignore also carries an explicit
# negation for this path. Both are required — drop either and the file silently
# stops being tracked, and every task file that imports it breaks.
#
# semaphore_ansible_secret_store:
#   host_file — {{ semaphore_data_dir }}/secrets/runtime.yml (default)
#   vault_kv  — HashiCorp KV v2 at apps/semaphore/runtime
#
# NOT Semaphore's runtime secret-storage integration (Vault/DB/etc).
# Declared role inputs (semaphore_admin_password etc.) always win when set.
# Missing values are generated once and persisted so re-runs stay stable.

- name: Assert Ansible secret store is supported
  ansible.builtin.assert:
    that:
      - semaphore_ansible_secret_store | default('host_file') in ['host_file', 'vault_kv']
    fail_msg: >-
      semaphore_ansible_secret_store must be 'host_file' or 'vault_kv'
      (got '{{ semaphore_ansible_secret_store | default('') }}').
      This is where Ansible persists install secrets — not Semaphore's own
      secret-storage setting.

- name: Assert Vault contract when ansible_secret_store=vault_kv
  ansible.builtin.assert:
    that:
      - (vault_addr | default('') | length) > 0
      - (vault_kv_mount | default('') | length) > 0
      - (vault_apps_runtime_base | default('') | length) > 0
      - (vault_token_file | default('') | length) > 0
    fail_msg: >-
      semaphore_ansible_secret_store=vault_kv requires vault_addr, vault_kv_mount,
      vault_apps_runtime_base, and vault_token_file (estate group_vars / control-node
      token). Use host_file (default) when Vault is not available for Ansible.
  when: (semaphore_ansible_secret_store | default('host_file')) == 'vault_kv'

# ── host_file store ──────────────────────────────────────────────────────────
- name: Resolve secrets from host_file store
  when: (semaphore_ansible_secret_store | default('host_file')) == 'host_file'
  block:
    - name: Create local secrets directory
      become: true  # root: under root-owned data dir
      ansible.builtin.file:
        path: "{{ semaphore_data_dir }}/secrets"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Stat existing local secrets file
      become: true
      ansible.builtin.stat:
        path: "{{ semaphore_data_dir }}/secrets/runtime.yml"
      register: _sem_local_secrets_stat

    - name: Load existing local secrets (if present)
      become: true
      ansible.builtin.slurp:
        src: "{{ semaphore_data_dir }}/secrets/runtime.yml"
      register: _sem_local_secrets_slurp
      when: _sem_local_secrets_stat.stat.exists | default(false)

    - name: Parse local secrets YAML
      ansible.builtin.set_fact:
        _sem_local_secrets: >-
          {{ (_sem_local_secrets_slurp.content | b64decode | from_yaml)
             if (_sem_local_secrets_stat.stat.exists | default(false))
             else {} }}
      no_log: true

    - name: Resolve admin password (declared > local file > generate)
      ansible.builtin.set_fact:
        _semaphore_admin_password: >-
          {{ semaphore_admin_password
             if (semaphore_admin_password | default('') | length > 0)
             else (_sem_local_secrets.admin_password | default('', true)
                   if (_sem_local_secrets.admin_password | default('') | length > 0)
                   else lookup('password', '/dev/null length=24 chars=ascii_letters,digits')) }}
      no_log: true

    - name: Resolve DB password (declared > local file > generate)
      ansible.builtin.set_fact:
        _semaphore_db_password: >-
          {{ semaphore_db_password
             if (semaphore_db_password | default('') | length > 0)
             else (_sem_local_secrets.db_password | default('', true)
                   if (_sem_local_secrets.db_password | default('') | length > 0)
                   else lookup('password', '/dev/null length=32 chars=ascii_letters,digits')) }}
      no_log: true

    - name: Resolve access-key encryption (declared > local file > generate)
      ansible.builtin.set_fact:
        _semaphore_access_key_encryption: >-
          {{ semaphore_access_key_encryption
             if (semaphore_access_key_encryption | default('') | length > 0)
             else (_sem_local_secrets.access_key_encryption | default('', true)
                   if (_sem_local_secrets.access_key_encryption | default('') | length > 0)
                   else (lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode)) }}
      no_log: true

    - name: Resolve LDAP bind password when LDAP is on
      ansible.builtin.set_fact:
        _semaphore_ldap_bind_password: >-
          {{ semaphore_ldap_bind_password
             if (semaphore_ldap_bind_password | default('') | length > 0)
             else (_sem_local_secrets.ldap_bind_password | default('', true)
                   if (_sem_local_secrets.ldap_bind_password | default('') | length > 0)
                   else lookup('password', '/dev/null length=32 chars=ascii_letters,digits')) }}
      no_log: true
      when: semaphore_ldap_enabled | bool

    - name: Clear LDAP bind password fact when LDAP is off
      ansible.builtin.set_fact:
        _semaphore_ldap_bind_password: ""
      when: not (semaphore_ldap_enabled | bool)

    - name: Assemble local secrets payload
      ansible.builtin.set_fact:
        _sem_local_payload: >-
          {{ {
               'admin_password': _semaphore_admin_password,
               'db_password': _semaphore_db_password,
               'access_key_encryption': _semaphore_access_key_encryption
             }
             | combine(
                 {
                   'ldap_bind_password': _semaphore_ldap_bind_password,
                   'ldap_bind_dn': semaphore_ldap_bind_dn
                 }
                 if (semaphore_ldap_enabled | bool)
                 else {}
               )
             | combine(
                 {'api_token_ci': _sem_local_secrets.api_token_ci}
                 if (_sem_local_secrets.api_token_ci | default('') | length > 0)
                 else {}
               ) }}
      no_log: true

    - name: Persist local secrets file (mode 0600)
      become: true  # root: writes under secrets dir
      ansible.builtin.copy:
        dest: "{{ semaphore_data_dir }}/secrets/runtime.yml"
        owner: root
        group: root
        mode: "0600"
        content: "{{ _sem_local_payload | to_nice_yaml(indent=2) }}"
      no_log: true

# ── vault_kv store (Ansible → HashiCorp KV; control-node auth) ───────────────
# Probe the whole secret once with vault_kv2_get:
#   * InvalidPath / missing → first-seed: generate missing fields
#   * ANY other failure (403, auth, connection) → FAIL CLOSED
#     (errors='ignore' + generate would overwrite live Postgres/admin secrets)
# Then write one consolidated dict. Preserve sibling fields the role does not
# own here (api_token_ci is minted later by reconcile_projects) so
# vault_kv2_write's full-PUT compare stays a true steady-state no-op.
- name: Resolve secrets from vault_kv store
  when: (semaphore_ansible_secret_store | default('host_file')) == 'vault_kv'
  block:
    # vault_apps_runtime_base is typically "kv-mgmt/data/apps" — strip the KV v2
    # "/data/" segment for vault_kv2_get which takes mount + path separately.
    - name: Probe existing Semaphore runtime secret in Vault
      community.hashi_vault.vault_kv2_get:
        url: "{{ vault_addr }}"
        token: "{{ lookup('file', vault_token_file) }}"
        engine_mount_point: "{{ vault_kv_mount }}"
        path: apps/semaphore/runtime
      register: _sem_vault_probe
      failed_when:
        - _sem_vault_probe.failed | default(false)
        - "'Invalid or missing path' not in (_sem_vault_probe.msg | default(''))"
      changed_when: false
      no_log: true
      delegate_to: localhost
      become: false

    # failed_when above absorbs a missing-path failure into failed=false, so
    # gating on .failed would take the success branch with no .secret attribute
    # (Ansible — failed_when rescue neutralises is failed). The return key is
    # the only reliable signal: present on a hit, absent on a miss.
    - name: Parse existing Vault fields (empty dict when path is missing)
      ansible.builtin.set_fact:
        _sem_vault_existing: "{{ _sem_vault_probe.secret | default({}, true) }}"
      no_log: true
      delegate_to: localhost
      become: false

    - name: Resolve admin password (declared > Vault > generate once)
      ansible.builtin.set_fact:
        _semaphore_admin_password: >-
          {{ semaphore_admin_password
             if (semaphore_admin_password | default('') | length > 0)
             else (_sem_vault_existing.admin_password | default('', true)
                   if (_sem_vault_existing.admin_password | default('') | length > 0)
                   else lookup('password', '/dev/null length=24 chars=ascii_letters,digits')) }}
      no_log: true
      delegate_to: localhost
      become: false

    - name: Resolve DB password (declared > Vault > generate once)
      ansible.builtin.set_fact:
        _semaphore_db_password: >-
          {{ semaphore_db_password
             if (semaphore_db_password | default('') | length > 0)
             else (_sem_vault_existing.db_password | default('', true)
                   if (_sem_vault_existing.db_password | default('') | length > 0)
                   else lookup('password', '/dev/null length=32 chars=ascii_letters,digits')) }}
      no_log: true
      delegate_to: localhost
      become: false

    - name: Resolve access-key encryption (declared > Vault > generate once)
      ansible.builtin.set_fact:
        _semaphore_access_key_encryption: >-
          {{ semaphore_access_key_encryption
             if (semaphore_access_key_encryption | default('') | length > 0)
             else (_sem_vault_existing.access_key_encryption | default('', true)
                   if (_sem_vault_existing.access_key_encryption | default('') | length > 0)
                   else (lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode)) }}
      no_log: true
      delegate_to: localhost
      become: false

    - name: Resolve LDAP bind password when LDAP is on (declared > Vault > generate)
      ansible.builtin.set_fact:
        _semaphore_ldap_bind_password: >-
          {{ semaphore_ldap_bind_password
             if (semaphore_ldap_bind_password | default('') | length > 0)
             else (_sem_vault_existing.ldap_bind_password | default('', true)
                   if (_sem_vault_existing.ldap_bind_password | default('') | length > 0)
                   else lookup('password', '/dev/null length=32 chars=ascii_letters,digits')) }}
      no_log: true
      delegate_to: localhost
      become: false
      when: semaphore_ldap_enabled | bool

    - name: Clear LDAP bind password fact when LDAP is off
      ansible.builtin.set_fact:
        _semaphore_ldap_bind_password: ""
      when: not (semaphore_ldap_enabled | bool)

    - name: Assemble Vault secret payload (preserve api_token_ci sibling)
      ansible.builtin.set_fact:
        _sem_vault_data: >-
          {{ {
               'admin_password': _semaphore_admin_password,
               'db_password': _semaphore_db_password,
               'access_key_encryption': _semaphore_access_key_encryption
             }
             | combine(
                 {
                   'ldap_bind_password': _semaphore_ldap_bind_password,
                   'ldap_bind_dn': semaphore_ldap_bind_dn
                 }
                 if (semaphore_ldap_enabled | bool)
                 else {}
               )
             | combine(
                 {'api_token_ci': _sem_vault_existing.api_token_ci}
                 if (_sem_vault_existing.api_token_ci | default('') | length > 0)
                 else {}
               ) }}
      no_log: true

    - name: Write Semaphore secrets to Vault (atomic, no-op when already in sync)
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        token: "{{ lookup('file', vault_token_file) }}"
        engine_mount_point: "{{ vault_kv_mount }}"
        path: apps/semaphore/runtime
        data: "{{ _sem_vault_data }}"
        read_before_write: true
      delegate_to: localhost
      become: false
      no_log: true
