---
# semaphore — install → configure → promote LDAP admins → smoke → reconcile.
# Role is privilege-self-contained: root tasks carry become: true; Vault/API
# tasks carry become: false. Playbooks must NOT set play-level become for this
# role.
#
# External deps (Vault, FreeIPA, LDAP) are opt-in via defaults/inventory —
# see semaphore_ansible_secret_store, semaphore_ldap_enabled, semaphore_freeipa_provision.

- name: Skip semaphore (semaphore_enabled is false)
  ansible.builtin.debug:
    msg: "semaphore_enabled is false — skipping semaphore"
  when: not (semaphore_enabled | bool)
  tags: [always]

- name: Configure semaphore
  when: semaphore_enabled | bool
  block:

    - name: Install Semaphore stack
      ansible.builtin.import_tasks: install.yml
      tags: [install]

    # install.yml may notify "Restart semaphore" (compose/unit change). Flush
    # BEFORE configure/smoke/reconcile so those API phases hit the new container,
    # not the pre-change process still serving until end-of-play handler flush.
    - name: Apply pending Semaphore service restarts before API phases
      ansible.builtin.meta: flush_handlers
      tags: [install, config, smoke, ldap, reconcile, projects]

    - name: Wait for Semaphore HTTP readiness
      ansible.builtin.import_tasks: configure.yml
      tags: [install, config]

    - name: Promote LDAP-backed admin users
      ansible.builtin.import_tasks: promote_admins.yml
      when:
        - semaphore_ldap_enabled | bool
        - (semaphore_ldap_admins | default([])) | length > 0
      tags: [install, ldap]

    - name: Smoke-test Semaphore via API
      ansible.builtin.import_tasks: smoke_test.yml
      tags: [install, smoke]

    - name: Reconcile declarative projects
      ansible.builtin.import_tasks: reconcile_projects.yml
      tags: [config, reconcile, projects]
