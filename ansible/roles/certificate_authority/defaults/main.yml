---
# Role enable gate — set false in host/group_vars to no-op this role
certificate_authority_enabled: true

# roles/certificate_authority/defaults/main.yml
#
# File-based internal CA built on community.crypto (no CA daemon, no Vault PKI).
# The system of record is a plain X.509 PEM tree under `certificate_authority_pki_dir`
# (repo-root `pki/` by default). Ansible is a replaceable executor — every operation
# has a bare-`openssl` break-glass equivalent (see pki/README.md). See ADR-0014.
#
# Every value below is GENERIC and SAFE. Estate-specific data (real common names,
# environment domains, name constraints) lives in inventory group_vars — NEVER here
# (no mgt/dev/prod or example.com literals in role code; the role stays portable).

# On-disk PKI tree. Defaults to the ansible-root pki/ (one level above the
# playbooks dir) — deliberately playbook_dir/../pki, NOT ../../, so the tree stays
# INSIDE the repo even when ansible/ itself is the repo root (2026-07-17 decision).
# Override with -e certificate_authority_pki_dir=<abs> for a scratch/throwaway run.
certificate_authority_pki_dir: "{{ playbook_dir }}/../pki"

# Root CA. `common_name` is the only estate value; `days` is its validity horizon.
certificate_authority_root:
  common_name: "Example Root CA"
  days: 7300

# TLS issuing intermediates (one map per environment). Each is signed DIRECTLY by
# the root as a pathlen:0, name-constrained CA. Shape:
#   { name: <stem>, common_name: <CN>, name_constraints: [<dns-suffix>, ...], days: <int> }
# name_constraints entries are bare DNS suffixes (e.g. ".example.test") — the role
# prefixes them with "DNS:" for the permitted-subtrees extension.
certificate_authority_intermediates: []

# Wildcard leaf certificates (one map per environment). Shape:
#   { name: <stem>, common_name: "*.<domain>", issuer: <intermediate-name>, days: <int>, sans: [<extra>, ...] }
# `issuer` references an intermediate `name`. `sans` is optional (the common_name is
# always added as a SAN automatically).
certificate_authority_wildcards: []

# Re-issue any wildcard leaf whose remaining validity falls inside this window.
certificate_authority_renew_within_days: 30

# ── Identity + coherence guard override (fail-closed clobber prevention) ──────
# This ONE var bypasses BOTH fail-closed cert guards the role applies before it will
# re-issue/overwrite an EXISTING certificate:
#   1. IDENTITY guard — the on-disk subject CN must equal the CN this run declares
#      (root: certificate_authority_root.common_name; each intermediate/wildcard: its
#      item.common_name). Guards the 2026-07-17 incident: a localhost CA play whose
#      certificate_authority_pki_dir resolved to the wrong tree (host_vars pki_dir is
#      invisible to an implicit-localhost play) silently RE-ISSUED the real root under a
#      test CN.
#   2. COHERENCE (keypair) guard — the on-disk cert and its private key must be the same
#      keypair (equal public keys). x509_certificate SILENTLY re-issues a cert that does
#      not match its key; for the root that cert IS the distributed trust anchor, so a
#      silent re-issue (new serial/notBefore) invalidates every trust store carrying the
#      old anchor. (Content/bring-your-own mode instead checks the PROVIDED key vs cert.)
# Set this to true ONLY to DELIBERATELY (a) rename an existing CA in place (same key,
# new CN), or (b) REPAIR a cert/key mismatch by re-issuing the cert from the canonical
# key (a new anchor — you must then re-distribute it). It does NOT bypass regenerate:never
# (keys are never re-keyed); it only permits a cert re-issue. Leave false in normal
# operation and in all inventory data; pass it per-run: -e certificate_authority_allow_identity_change=true
certificate_authority_allow_identity_change: false

# FreeIPA external-ca signing (opt-in, --tags sign_ipa). Control-node path of a CSR
# fetched from a FreeIPA server, the output stem, and the emitted CA cert lifetime.
certificate_authority_ipa_csr_path: ""
certificate_authority_ipa_name: ""
certificate_authority_ipa_days: 3650

# CRL nextUpdate horizon (root + intermediate CRLs).
certificate_authority_crl_days: 30

# ── Declarative revocation (fed into the root CRL; --tags crl) ────────────────
# The single source of truth for what is revoked — community.crypto builds the CRL
# from this list, no openssl CLI index database. Each entry:
#   { serial: <int-or-hex-string>, reason: <RFC 5280 or snake_case>, revoked_at: <ASN.1 time> }
# serial accepts a YAML int (decimal) OR a hex string (colons/0x tolerated — paste
# `openssl x509 -serial` output directly). reason accepts either the RFC 5280 camelCase
# name (keyCompromise, caCompromise, affiliationChanged, superseded, cessationOfOperation,
# certificateHold, privilegeWithdrawn, aACompromise, removeFromCRL, unspecified) or the
# module's snake_case equivalent. revoked_at is an ASN.1 time string, e.g. "20260717000000Z".
# Any matching serial is also flagged revoked: true in inventory.json (feature A),
# whether or not the opt-in crl phase has run. Example:
#   certificate_authority_revocations:
#     - { serial: "0A1B2C3D", reason: keyCompromise, revoked_at: "20260717000000Z" }
certificate_authority_revocations: []

# ── Credential resolution (ADR-0011) — passphrases are the ONLY secrets ──────
# Every private key under pki/ is passphrase-encrypted PKCS#8. Resolution is
# declared-var-FIRST (typically an Ansible-Vault group_var), HashiCorp Vault as an
# optional fallback, then a fail-fast assert. Leave the passphrase vars set from a
# vaulted group_var, OR point certificate_authority_vault_secret at a KV path whose
# fields hold them. Never pass a passphrase on argv/stdout.
certificate_authority_root_key_passphrase: ""
certificate_authority_intermediate_key_passphrase: ""
certificate_authority_wildcard_key_passphrase: ""

# HashiCorp Vault fallback: KV path holding the passphrases (empty = no fallback),
# and the field name each passphrase is stored under at that path.
certificate_authority_vault_secret: ""
certificate_authority_root_key_passphrase_field: "root_key_passphrase"
certificate_authority_intermediate_key_passphrase_field: "intermediate_key_passphrase"
certificate_authority_wildcard_key_passphrase_field: "wildcard_key_passphrase"

# ── Bring-your-own CA key from an external store (in-memory signer) ──────────
# Provide the CA (root) private key + certificate as PEM CONTENT — typically wired
# from an Ansible-Vault / secret-store variable. When _root_key_content is set the
# role SKIPS root generation and signs with this material IN MEMORY (the private key
# is never written to disk); only public certs are written. The root passphrase above
# is used only if the provided key is itself encrypted (leave empty for a passwordless
# key — the external store, e.g. Ansible Vault, is then the single at-rest layer).
certificate_authority_root_key_content: ""
certificate_authority_root_cert_content: ""

# ── Bootstrap (--tags bootstrap, opt-in) — encrypted root store in group_vars ──
# Destination of the generated Ansible-Vault-encrypted root store. The default is
# the playbook-adjacent group_vars/all/ scope, which auto-loads for EVERY play under
# playbooks/ (including implicit-localhost plays) — the same scope the estate's
# vault.yml uses. Once written, every run consumes the root in content mode.
certificate_authority_bootstrap_file: "{{ playbook_dir }}/group_vars/all/root_ca.yml"
# Existing Ansible-Vault-encrypted file used to VERIFY the supplied encryption
# password IS the estate's vault password before anything is written (fail-closed;
# a typo can never mint a store the real password won't open). Empty or absent →
# the check is skipped with a loud warning.
certificate_authority_bootstrap_verify_file: "{{ playbook_dir }}/group_vars/all/vault.yml"

# Trust-store distribution (--tags distribute) — where the root anchor lands on an
# EL-family target and how the OS trust store is refreshed. Generic EL defaults.
certificate_authority_trust_anchor_dir: "/etc/pki/ca-trust/source/anchors"
certificate_authority_trust_update_command: "update-ca-trust"
certificate_authority_trust_anchor_name: "internal-root-ca"
