---
# Resolve _nexus_admin_password once (Ansible Vault var, else HashiCorp Vault).
# Idempotent: skips when already set in this play.

- name: Resolve Nexus admin password from Vault when not already set
  ansible.builtin.set_fact:
    _nexus_admin_password: >-
      {{ nexus_admin_password
         if (nexus_admin_password | default('') | length > 0)
         else lookup('community.hashi_vault.hashi_vault',
              'secret=' + vault_apps_runtime_base + '/nexus/runtime:admin_password url=' + vault_addr) }}
  when: _nexus_admin_password is not defined
  delegate_to: localhost
  become: false
  no_log: true

- name: Assert resolved Nexus admin password is non-empty
  ansible.builtin.assert:
    that:
      - _nexus_admin_password | default('') | length > 0
    fail_msg: >-
      Resolved Nexus admin password is empty. Check nexus_admin_password or
      Vault path {{ vault_apps_runtime_base }}/nexus/runtime:admin_password.
    quiet: true
  no_log: true
