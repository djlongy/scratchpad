# ECK imports these permissions through spec.auth.roles. No credentials belong here.
logs-read:
  cluster: []
  indices:
  - names:
    - logs-*
    privileges:
    - read
    - view_index_metadata
  applications:
  - application: kibana-.kibana
    privileges:
    - feature_discover.read
    - feature_dashboard.read
    resources:
    - '*'

# Infrastructure visibility; inference management comes from the built-in role.
infrastructure_admin:
  cluster: [monitor]
  indices:
  - names: ["*"]
    privileges: [read, monitor, view_index_metadata]
    allow_restricted_indices: false
